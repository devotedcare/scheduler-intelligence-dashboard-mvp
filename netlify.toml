# ==============================================================
# Netlify configuration — Devoted Care Scheduler Intelligence
#
# There is no bundler and no framework. The "build" is a single
# Node script that writes config.js from environment variables.
# ==============================================================

[build]
  command   = "node scripts/build-config.js"
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Care notes are swept from AxisCare on a schedule rather than fetched
# live — the note text is only on the per-visit call, so a sweep is one
# request per visit. Each run stops before the platform timeout and saves
# a cursor, so several runs finish a sweep between them.
[functions."carenotes-sync"]
  schedule = "*/15 * * * *"

# Client matching comes from the Client Concierge project. Preferences
# and matched caregivers change maybe weekly, not by the minute, so this
# runs far less often than the care-notes sweep. One request to Concierge
# (21 client records today) plus the AxisCare roster for name resolution.
[functions."matching-sync"]
  schedule = "17 * * * *"

# Availability: the RE-CARVE, and the monthly copy. Two passes, one job.
#
# PASS A — the re-carve. The carve in the browser is a snapshot: it runs when
# a scheduler saves, against the visits AxisCare had at that instant. Match a
# client to a caregiver afterwards and the stored Open still covers hours they
# are now booked for. That is what left Alrenz Ellivera reading as free all
# day on 2026-09-12 while assigned to Jose Ortiz 8a–8p. This pass re-derives
# every future day that holds rows against the visits AxisCare has NOW, so the
# table corrects itself within the hour instead of never.
#
# PASS B — the monthly copy, for EVERY caregiver. The dashboard runs the same
# copy in the browser, but only for a caregiver somebody opens. On 2026-09-01
# that left 101 of 140 with an empty September: their September was never
# written while August was current, so once September arrived it became the
# source, it was empty, and October could not be built either. This is the
# backstop that fills November on October 1st whether or not anybody clicks.
#
# Hourly, and it now ALWAYS pays for the visit window — roughly 20 AxisCare
# requests and ~15s — because pass A has to run whether or not a month is
# empty. (It used to exit in ~3s with zero requests when there was nothing to
# copy; the days pass A fixes are the FULL ones, so that shortcut could not
# survive.) Both passes share a soft deadline and pass B saves a cursor, so a
# long run completes over the next few.
#
# Pass A is idempotent: once it has caught up, a run changes nothing.
# Open shifts are MIRRORED, not derived in the browser. Measured
# 2026-09-03, the browser scan was 14 SEQUENTIAL AxisCare requests over a
# 58-day visit window, 1,321 visits, 9.1s — to produce 12 rows — and it
# was the slowest of the five boot calls, so the whole dashboard waited
# for it.
#
# The cron is a FLOOR, not the main mechanism. The dashboard triggers a
# refresh when it reads (stale-while-revalidate), so AxisCare load follows
# real usage rather than the clock — a quiet weekend costs nothing. This
# entry exists so the first person in each morning is not the one who eats
# the staleness, and so the mirror keeps breathing if nobody opens the app.
#
# Ten minutes, not five: the read-trigger does the sharpening, and the
# function debounces anything closer than MIN_GAP_MS anyway. Correctness
# does not rest on the cadence — an assignment is re-checked against
# AxisCare before it is written (verifyShiftStillOpen in index.html).
[functions."openshifts-sync"]
  schedule = "*/10 * * * *"

[functions."availability-copy"]
  schedule = "35 * * * *"

# --------------------------------------------------------------
# Keep repo plumbing off the public site. Nothing here contains a
# secret (the AxisCare token only ever exists as a Netlify env var),
# but there is no reason to serve build scripts and SQL either.
# --------------------------------------------------------------
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# The dashboard used to be served as scheduler-intelligence.html.
# Keep old links working.
[[redirects]]
  from = "/scheduler-intelligence.html"
  to = "/"
  status = 301
  force = true

# --------------------------------------------------------------
# Caching. index.html and config.js must never go stale, or a
# redeploy will not reach people who already have the tab open.
# --------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "SAMEORIGIN"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=(), payment=()"

    # A Content-Security-Policy is left commented out on purpose.
    #
    # The dashboard is one large inline <script> and uses inline
    # onclick= handlers throughout, so a CSP here needs
    # 'unsafe-inline' to work at all — which removes most of its
    # value. It also risks breaking the print / PDF views, which
    # build a document with window.open() + document.write().
    #
    # If you do want it, uncomment the line below and then test
    # every print button (Forms, Medication List, Caregiver Resume,
    # Quick Guides) before trusting it.
    #
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
