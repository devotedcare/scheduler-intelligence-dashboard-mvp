function aoSelectReasons(e, shiftId){
  const cg=e.cg, s=shiftById(shiftId), cl=clById(s.clientId), dist=miles(cg.base, cl.city), pos=[], caution=[];
  pos.push('Available');
  if(dist<=10) pos.push('Within 10 miles'); else if(dist<=22) pos.push(dist+' miles away'); else caution.push(dist+' miles away');
  if(cg.weekHrs<38) pos.push('No overtime risk'); else if(cg.weekHrs<40) caution.push('Near overtime ('+cg.weekHrs+'h)'); else caution.push('At 40 hrs \u2014 overtime');
  const req=cl.reqSkills||[];
  if(req.length && req.every(sk=>cg.skills.includes(sk))) pos.push('Skills match');
  if(cg.priorClients.indexOf(cl.id)>=0) pos.push('Has worked with this client');
  if(cg.prefCities.indexOf(cl.city)>=0) pos.push('Prefers this area');
  if(cg.reliability>=95) pos.push(cg.reliability+'% reliable'); else if(cg.reliability<85) caution.push(cg.reliability+'% reliable');
  if(cg.tempNote && /extra|open/i.test(cg.tempNote)) pos.push('Wants extra shifts');
  if(cg.recentDeclines>=3) caution.push('Declined recently');
  return {pos, caution};
}

function specFromQuery(q){
  const startD=dateFromInputs(q.date,q.start), endD=dateFromInputs(q.date,q.end);
  const sh = q.shiftId ? state.shifts.find(x=>x.id===q.shiftId) : null;
  const base = { shiftId:q.shiftId, start:startD, end:endD,
    callOff: sh?sh.callOff:false, callOffReason: sh?sh.callOffReason:undefined, prevCaregiver: sh?sh.prevCaregiver:null,
    includeUnverified:(q.filters||[]).includes('Include Unverified Caregivers') };
  if(q.clientId){
    const cl=clById(q.clientId);
    return Object.assign(base, {clientId:cl.id, clientName:cl.name, city:q.city||cl.city, reqSkills:q.skills.length?q.skills:cl.reqSkills,
      restrictions:cl.restrictions, pets:cl.pets, smoking:cl.smoking, risk:cl.risk});
  }
  return Object.assign(base, {clientId:null, clientName:'Manual search', city:q.city||'', reqSkills:q.skills,
    restrictions:[], pets:false, smoking:false, risk:'low'});
}

// --- availability primitives ---
function driveMin(mi){ return Math.round(mi*1.6 + 2); }
function isAnytime(cg){ return cg.win.some(([a,b])=>(b-a)>=20); }
function windowsForDay(cg,dKey,dateStr){
  const ov=dateStr&&cg.ops&&cg.ops.availOverrides&&cg.ops.availOverrides[dateStr];
  if(ov){ const w=dayWindow(ov); return w?[w]:[]; }
  const a2=cg.ops&&cg.ops.avail2; if(a2&&a2[dKey]){ const w=dayWindow(a2[dKey]); return w?[w]:[]; }
  return cg.avail[dKey]===1 ? cg.win : [];
}
function coverageDetail(cg,dKey,start,end,dateStr){
  const wins=windowsForDay(cg,dKey,dateStr);
  if(end<=start) end+=24;
  for(const [ws,we] of wins){ if(ws<=start && we>=end) return {cov:'full', label:'Covers full shift'}; }
  let best=null;
  for(const [ws,we] of wins){ if(ws<end && we>start){ const os=Math.max(ws,start), oe=Math.min(we,end); if(!best||(oe-os)>(best.oe-best.os)) best={os,oe}; } }
  if(best) return {cov:'partial', label:'Covers '+fmtHr(best.os)+'\u2013'+fmtHr(best.oe)};
  return {cov:'none', label:'No overlap'};
}
const CATS=[['morning',6,12],['afternoon',12,17],['evening',17,21]];
function categoriesFor(cg,dKey){
  const wins=windowsForDay(cg,dKey); const set=new Set();
  wins.forEach(([ws,we])=>{
    CATS.forEach(([n,cs,ce])=>{ if(ws<ce && we>cs) set.add(n); });
    if((ws<24 && we>21) || (ws<6 && we>0)) set.add('overnight');
    if((we-ws)>=15) set.add('anytime');
  });
  return set;
}
function assignedDuring(cgId,dKey,start,end){
  for(const s of state.shifts){
    if(s.status==='filled' && s.assigned===cgId && dayKey(s.start)===dKey){
      const ss=decHr(s.start), se=decHr(s.end);
      if(ss<end && se>start) return clById(s.clientId).name;
    }
  }
  return null;
}

function manualSearch(q,dKey){
  const start=q.start, end=q.end;
  const cl=q.clientId?clById(q.clientId):null;
  const rg=cl?reqGender(cl.restrictions):null;
  const sh=q.shiftId?state.shifts.find(x=>x.id===q.shiftId):null;
  const ai=rankCaregivers(specFromQuery(q));
  const scoreMap={}; ai.eligible.forEach(r=>scoreMap[r.cg.id]=r.score);

  const fullPool=[], partialPool=[], excluded=[];
  state.caregivers.forEach(cg=>{
    const cd=coverageDetail(cg,dKey,start,end,q.date);
    let ex=null;
    if(sh && sh.callOff && sh.prevCaregiver===cg.id) ex='Called off this shift'+(sh.callOffReason?' \u00b7 '+sh.callOffReason:'');
    if(!ex && cd.cov==='none') ex='Not available '+dKey;
    if(!ex){ const a=assignedDuring(cg.id,dKey,start,end); if(a) ex='Already assigned \u00b7 '+a; }
    if(!ex && !q.allowOT && cg.weekHrs>=40) ex='Over overtime limit ('+cg.weekHrs+'h)';
    else if(!ex && !q.allowOT && cg.weekHrs>=38) ex='Overtime risk ('+cg.weekHrs+'h)';
    if(!ex && q.clientId && cg.blockedClients.includes(q.clientId)) ex='Blocked from client';
    if(!ex && rg && cg.gender!==rg) ex='Client restriction \u00b7 '+(rg==='F'?'female only':'male only');
    if(!ex){ const miss0=q.skills.filter(s=>!cg.skills.includes(s)); if(miss0.length) ex='Missing care-need skill: '+miss0.join(', '); }
    if(!ex && cl && cl.pets && cg.restrictions.includes('No pets')) ex='Caregiver restriction \u00b7 no pets';
    if(!ex && q.skills.includes('Transfers') && cg.restrictions.includes('No transfers (back)')) ex='Caregiver restriction \u00b7 no transfers';
    if(ex){ excluded.push({cg, reason:ex}); return; }
    if(!caregiverPassesFilters(cg, q.filters, {clientId:q.clientId})){ excluded.push({cg, reason:'Does not match selected filters'}); return; }

    const dist = q.city ? miles(cg.base,q.city) : 0;
    const miss = q.skills.filter(s=>!cg.skills.includes(s));
    const history = q.clientId ? cg.priorClients.includes(q.clientId) : null;
    const lc = q.shiftId ? lastContact(q.shiftId, cg.id) : null;
    let score = (cg.id in scoreMap) ? scoreMap[cg.id] : Math.max(0, 42 + cg.reliability*0.18 - dist*0.8 - miss.length*6 + (history?10:0));
    if(lc){ if(lc.result==='declined'||lc.result==='no-answer') score-=500; if(lc.result==='accepted') score+=500; }
    const e={cg, cov:cd.cov, covLabel:cd.label, dist, drive:driveMin(dist), driver:cg.driver, history, skillMiss:miss.join(', '), recentDecline:cg.recentDeclines>=1, score, contact:lc, ot:cg.weekHrs>=38};
    if(cd.cov==='full') fullPool.push(e); else partialPool.push(e);
  });
  const bySc=(a,b)=>(b.score-a.score)||(a.dist-b.dist);
  fullPool.sort(bySc); partialPool.sort(bySc);
  return {fullPool, partialPool, excluded};
}

// --- match card (shared by AI mode) ---
function matchCard(r, idx, shiftId, compact){
  const barColor = r.score>=75?'var(--good-solid)':r.score>=55?'var(--brand)':r.score>=40?'var(--soon-solid)':'var(--crit-solid)';
  let ctaTop, assignBtn='';
  if(shiftId){
    const lc=lastContact(shiftId, r.cg.id);
    ctaTop = lc
      ? `<button class="btn sm" disabled>${lc.result==='declined'?'Declined':lc.result==='no-answer'?'No answer':lc.result==='accepted'?'Accepted':'Called back'}</button>`
      : `<button class="btn pri sm" onclick="quickContact('${shiftId}','${r.cg.id}')">${ic('phone',14)} Call</button>`;
    assignBtn=`<button class="btn sm" onclick="assignShift('${shiftId}','${r.cg.id}')">${ic('check',14)} Assign</button>`;
  } else {
    ctaTop = `<button class="btn pri sm" onclick="manualCall('${r.cg.id}')">${ic('phone',14)} Call</button>`;
  }
  const reasons = compact ? r.reasons.slice(0,3) : r.reasons;
  return `<div class="matchcard ${idx===0&&!compact?'top':''} ${compact?'compact':''}">
    <div class="rank">${idx+1}</div>
    <div class="cg">
      <div class="nm">${r.cg.name} ${idx===0&&!compact?'<span class="chip solid-good" style="font-size:10.5px">Top match</span>':''}</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px">${r.cg.base} \u00b7 ${r.cg.hours} \u00b7 ${r.cg.weekHrs}h this week</div>
      <div class="reasons">${reasons.map(x=>`<span class="why ${x.k}">${x.t}</span>`).join('')}</div>
    </div>
    <div class="score">
      <div class="val tnum" style="color:${barColor}">${r.score}</div>
      <div class="bar"><i style="width:${r.score}%;background:${barColor}"></i></div>
      <div class="lab">Match</div>
    </div>
    <div class="cta">${ctaTop}<button class="btn sm ghost" onclick="openCoverageText('${r.cg.id}')">${ic('send',13)} Text</button>${assignBtn}</div>
  </div>`;
}

// --- AI mode ---
function renderAI(q){
  const spec=specFromQuery(q);
  const {eligible,excluded}=rankCaregivers(spec);
  const best=eligible.slice(0,3), expanded=eligible.slice(3);

  let list='';
  if(!best.length){
    list=`<div class="card"><div class="empty"><div class="ei">${ic('coverage',40)}</div><div class="et">No eligible caregivers for this request</div><div class="subnote">Everyone is filtered out below with a reason \u2014 or switch to Manual Availability to see who is free regardless of fit.</div></div></div>`;
  } else {
    list=`<div class="section-h"><h2>Best Match \u00b7 ${best.length}</h2><span class="hint">AI recommendation \u2014 call these first</span></div><div class="stack">`;
    best.forEach((r,i)=>list+=matchCard(r,i,spec.shiftId,false));
    list+=`</div>`;
    if(expanded.length){
      list+=`<div class="expand-head ${state.expandedOpen?'open':''}" onclick="toggleExpanded()">
        <span class="eh-title">Expanded Match \u00b7 ${expanded.length}</span>
        <span class="eh-sub">If the top 3 don't pick up</span>
        <span class="eh-toggle">${state.expandedOpen?'Hide':'Show'} ${ic('chevron',15)}</span>
      </div>`;
      if(state.expandedOpen){ list+=`<div class="stack">`; expanded.forEach((r,i)=>list+=matchCard(r,i+3,spec.shiftId,true)); list+=`</div>`; }
    }
  }
  let exHtml='';
  if(excluded.length){
    exHtml=`<div class="divider"></div><div class="section-h"><h2>Not eligible \u00b7 ${excluded.length}</h2><span class="hint">Filtered out \u2014 shown so you don't waste a call</span></div><div class="stack">`;
    excluded.forEach(r=>{
      exHtml+=`<div class="matchcard excluded"><div class="rank">\u2014</div>
        <div class="cg"><div class="nm">${r.cg.name}</div><div class="reasons">${r.reasons.map(x=>`<span class="why minus">${x.t}</span>`).join('')}</div></div>
        <div class="score"><div class="val">\u2014</div><div class="lab">Excluded</div></div><div class="cta"></div></div>`;
    });
    exHtml+=`</div>`;
  }
  return list + exHtml;
}

// --- Manual mode ---
function statusBadge(lc){
  if(!lc) return '';
  const map={'no-answer':['No answer','st-no'],'declined':['Declined','st-dec'],'callback':['Call back','st-cb'],'accepted':['Accepted','st-acc']};
  const [lbl,cls]=map[lc.result]||['Logged','st-no'];
  return `<span class="status ${cls}">${lbl}</span>`;
}
function manualCtaFor(e,q){
  if(e.contact) return statusBadge(e.contact)+`<button class="btn sm ghost" onclick="event.stopPropagation();manualCall('${e.cg.id}')">Re-log</button>`;
  return `<button class="btn pri sm" onclick="event.stopPropagation();manualCall('${e.cg.id}')">${ic('phone',13)} Call</button>`;
}
function availText(cg,q){
  const dKey=dayKeyFromDate(q.date);
  const wins=windowsForDay(cg,dKey);
  if(!wins.length) return 'Not available '+dKey;
  if(isAnytime(cg)) return 'Available all day';
  return 'Available '+wins.map(([a,b])=>`${fmtHr(a)}\u2013${fmtHr(b)}`).join(', ');
}
function whyFirst(e,q){
  const cg=e.cg, r=[];
  if(q.clientId && e.history) r.push(`has worked with ${clById(q.clientId).name.split(' ')[0]}`);
  if(q.city && e.dist!=null) r.push(`closest at ${e.dist} mi`);
  if(cg.reliability>=93) r.push(`${cg.reliability}% reliable`);
  if(q.skills.length && !e.skillMiss) r.push('matches all required skills');
  if(cg.driver) r.push('drives');
  if(cg.weekHrs<32) r.push(`${cg.weekHrs}h scheduled \u00b7 room before OT`);
  return r.slice(0,3).join(' \u00b7 ') || 'best overall match for this shift';
}
function topMatchChecks(e,q){
  const cg=e.cg, c=[];
  c.push('Available for the full shift');
  if(q.skills.length && !e.skillMiss) c.push('Skills match');
  if(q.city && cg.prefCities && cg.prefCities.includes(q.city)) c.push('Preferred city');
  if(q.clientId && e.history) c.push('Worked with client before');
  if(cg.driver) c.push('Driver');
  if(cg.reliability>=93) c.push(`${cg.reliability}% reliable`);
  if(cg.weekHrs<32) c.push('Room before overtime');
  return c;
}
function bestCard(e,i,q){
  const cg=e.cg;
  const facts=[cg.base, q.city?`${e.dist} mi (${e.drive} min)`:null, `${cg.reliability}% reliable`, `${cg.weekHrs}h scheduled`, `Driver: ${cg.driver?'Yes':'No'}`, (q.clientId?`Worked with client: ${e.history?'Yes':'No'}`:null)].filter(Boolean).join(' \u00b7 ');
  const flags=[];
  if(e.skillMiss) flags.push(`<span class="tag warn">Skill gap: ${e.skillMiss}</span>`);
  if(e.recentDecline) flags.push(`<span class="tag warn">Recent decline</span>`);
  const overlap=`<div class="b-avail"><span class="cov-dot ${e.cov==='full'?'full':'partial'}"></span>${availText(cg,q)} \u00b7 ${e.covLabel}</div>`;
  const why = i===0 ? `<div class="b-why"><div class="b-why-l">Top match \u2014 why</div><div class="b-checks">${topMatchChecks(e,q).map(t=>`<span class="bchk">${ic('check',11)} ${t}</span>`).join('')}</div></div>` : '';
  return `<div class="bcard">
    <div class="b-rank">${i+1}</div>
    <div class="b-body">
      <div class="b-name">${cg.name}${flags.length?'<span class="b-flags">'+flags.join(' ')+'</span>':''}</div>
      <div class="b-facts">${facts}</div>
      ${overlap}
      ${why}
    </div>
    <div class="b-cta">${manualCtaFor(e,q)}</div>
  </div>`;
}
function compactCard(e,i,q,partial){
  const cg=e.cg;
  const cov = `<span class="covlabel ${e.cov==='full'?'full':'partial'}">${e.covLabel}</span>`;
  const facts=[cg.base, q.city?`${e.dist} mi`:null, `${cg.reliability}%`, `${cg.weekHrs}h`, `Driver: ${cg.driver?'Y':'N'}`, (q.clientId?`Worked: ${e.history?'Y':'N'}`:null)].filter(Boolean).join(' \u00b7 ');
  return `<div class="ccard">
    <div class="c-rank">${i+1}</div>
    <div class="c-main"><span class="c-name">${cg.name}</span>${cov}<span class="c-facts">${facts}</span></div>
    <div class="c-cta">${manualCtaFor(e,q)}</div>
  </div>`;
}
function agoShort(d){ const m=Math.round((Date.now()-new Date(d).getTime())/60000); if(m<1)return'just now'; if(m<60)return m+'m ago'; const h=Math.round(m/60); return h+'h ago'; }
function contactedRow(e,q){
  const cg=e.cg, lc=e.contact;
  const detail = lc.result==='declined' ? ('Declined'+(lc.reason?' \u00b7 '+lc.reason:''))
    : lc.result==='callback' ? ('Call back'+(lc.callback?' \u00b7 '+lc.callback:''))
    : lc.result==='accepted' ? 'Accepted'
    : 'No answer';
  const cta = lc.result==='accepted'
    ? `<button class="btn pri sm" onclick="event.stopPropagation();assignShift('${q.shiftId}','${cg.id}')">${ic('check',13)} Assign</button>`
    : `<button class="btn sm ghost" onclick="event.stopPropagation();manualCall('${cg.id}')">${ic('phone',13)} Call again</button>`;
  return `<div class="ccard contacted">
    <div class="c-main"><span class="c-name">${cg.name}</span>${statusBadge(lc)}<span class="c-facts">${detail} \u00b7 ${agoShort(lc.time)} \u00b7 by ${lc.by}</span></div>
    <div class="c-cta">${cta}</div>
  </div>`;
}
function dispFacts(e,q){
  const cg=e.cg;
  const base=[cg.base, q.city?`${e.dist}mi (${e.drive}min)`:null, `${cg.reliability}% reliable`, `Driver ${cg.driver?'Yes':'No'}`, `${cg.weekHrs}h/wk`].filter(Boolean).join(' \u00b7 ');
  const ot=cg.weekHrs>=38?` \u00b7 <span class="q-ot">OT risk</span>`:'';
  const hist=q.clientId?(e.history?` \u00b7 Worked before \u00b7 last ${lastWorkedStr(cg)}`:' \u00b7 New to client'):'';
  return base+ot+hist;
}
function dispActions(cg,q,exp){
  const sid=q.shiftId; if(!sid) return '';
  const bar=`<div class="q-acts">
     <a class="q-b call" href="tel:${cg.phone.replace(/[^0-9]/g,'')}" onclick="dispCall('${cg.id}')">${ic('phone',12)} Call</a>
     <button class="q-b acc" onclick="dispAccept('${sid}','${cg.id}')">Accepted</button>
     <button class="q-b dec" onclick="dispExpandRow('${sid}','${cg.id}','declined')">Declined</button>
     <button class="q-b na" onclick="dispResult('${sid}','${cg.id}','no-answer')">No answer</button>
     <button class="q-b cb" onclick="dispExpandRow('${sid}','${cg.id}','callback')">Callback</button>
     <button class="q-b pt" onclick="dispResult('${sid}','${cg.id}','partial')">Partial</button>
     <button class="q-b sk" onclick="dispResult('${sid}','${cg.id}','skipped')">Skip</button>
   </div>`;
  let expand='';
  if(exp==='declined'){ const reasons=['Already working','Too far','Transportation','Childcare','Does not want overnight','Does not want heavy care','Not comfortable with client','Other']; expand=`<div class="q-expand"><span class="q-exl">Decline reason:</span>${reasons.map(r=>`<button class="q-rchip" onclick="dispDecline('${sid}','${cg.id}','${r}')">${r}</button>`).join('')}</div>`; }
  if(exp==='callback'){ const times=[['15 min',15],['30 min',30],['1 hour',60],['2 hours',120]]; expand=`<div class="q-expand"><span class="q-exl">Call back in:</span>${times.map(([l,m])=>`<button class="q-rchip" onclick="dispCallback('${sid}','${cg.id}','${l}',${m})">${l}</button>`).join('')}</div>`; }
  return bar+expand;
}
function dispQueueRow(item,q,active){

}
function dispPartialRow(e,q){

function dispContactedRow(e,l,q){
  const cg=e.cg, sid=q.shiftId;
  const detail = l.result==='declined' ? ('Declined'+(l.reason?' \u00b7 '+l.reason:''))
    : l.result==='callback' ? ('Callback'+(l.callback?' in '+l.callback:'')+(l.callbackAt?' \u00b7 due '+fmtTime(new Date(l.callbackAt)):''))
    : l.result==='accepted' ? 'Accepted \u00b7 assigned \u2713'
    : l.result==='partial' ? 'Partial coverage agreed'
    : 'No answer';
  const cta = l.result==='accepted' ? ''
    : `<button class="q-mini call" onclick="dispCall('${cg.id}')">${ic('phone',11)} Call</button><button class="q-mini" onclick="dispReopen('${sid}','${cg.id}')">Re-queue</button>`;
  return `<div class="crow ${l.result}">

    <div class="c-cta">${cta}</div>

function dispContactedHistory(q, latestOf, fullPool, partialPool){

/* ===================== MULTI-DAY AVAILABILITY SEARCH + SCORING ===================== */
const DAY_PRESETS=[['Mon\u2013Fri',['Mon','Tue','Wed','Thu','Fri']],['Weekends',['Sat','Sun']],['Tue/Thu',['Tue','Thu']],['Mon/Wed/Fri',['Mon','Wed','Fri']],['Every day',['Mon','Tue','Wed','Thu','Fri','Sat','Sun']]];
const TIME_PRESETS=[['Mornings',6,12],['Afternoons',12,18],['Evenings',18,23],['Full day',7,19]];
const TIME_CATS=[['AM',6,14],['PM',14,18],['Evening',18,22],['Overnight',22,30]];
function coversShift(wins,s,e){
  if(e<=24) return wins.some(([ws,we])=>ws<=s && we>=e);
  // overnight wrap (e>24): needs the late part [s,24] and the early part [0,e-24]
  return wins.some(([ws,we])=>ws<=s && we>=24) && wins.some(([ws,we])=>ws<=0 && we>=(e-24));
}
function fmtClock(dec){ dec=((dec%24)+24)%24; let h=Math.floor(dec); const m=Math.round((dec-h)*60); const ap=h<12?'AM':'PM'; let hh=h%12; if(hh===0)hh=12; return hh+':'+(m<10?'0'+m:m)+' '+ap; }
function daysPlus(days){ return daySpanLabel(days).replace(/, /g,' + '); }
function sameDays(a,b){ if(a.length!==b.length) return false; return b.every(d=>a.includes(d)); }
function daySpanLabel(days){
  const order=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const s=order.filter(d=>days.includes(d));
  if(!s.length) return 'no days';
  if(s.length===7) return 'Every day';
  if(sameDays(s,['Mon','Tue','Wed','Thu','Fri'])) return 'Mon\u2013Fri';
  if(sameDays(s,['Sat','Sun'])) return 'Weekends';
  const idx=s.map(d=>order.indexOf(d)); let contig=true; for(let i=1;i<idx.length;i++){ if(idx[i]!==idx[i-1]+1){contig=false;break;} }
  if(contig && s.length>2) return s[0]+'\u2013'+s[s.length-1];
  return s.join(', ');
}
function defaultSearchQuery(){ const wd=REC_DAYS[(new Date(NOW).getDay()+6)%7]; const today=toDateInput(NOW); return {clientId:null, city:'', days:[wd], start:6, end:14, timeCat:'AM', specStart:8, specEnd:14, skills:[], filters:[], useDates:false, searchType:'single', dates:[today], rangeStart:today, rangeEnd:addDaysStr(today,6), recDays:[]}; }

function searchAvailability(sq){
  const reqDays=REC_DAYS.filter(d=>sq.days.includes(d));
  if(!reqDays.length) return {best:[],other:[],near:[],partial:[],expand:[],reqDays,exact:0,total:0};
  const cl=sq.clientId?clById(sq.clientId):null;
  const rg=cl?reqGender(cl.restrictions):null;
  const best=[], other=[], near=[], partial=[], expand=[];
  state.caregivers.forEach(cg=>{
    // hard excludes (safety/capability): blocked, client gender restriction, missing required care skill
    if(sq.clientId && cg.blockedClients.includes(sq.clientId)) return;
    if(rg && cg.gender!==rg) return;
    if(!(sq.filters||[]).includes('Include Unverified Caregivers') && availVerifyStatus(cg).key==='unverified') return;
    if(sq.skills.some(s=>!cg.skills.includes(s))) return;
    const coverDays=reqDays.filter(d=>coversShift(windowsForDay(cg,d), sq.start, sq.end));
    const missingReqs=(sq.filters||[]).filter(f=>!caregiverPassesFilters(cg,[f],{clientId:sq.clientId}));
    const dist=sq.city?miles(cg.base,sq.city):null;
    const history=sq.clientId?cg.priorClients.includes(sq.clientId):false;
    const allDays=coverDays.length===reqDays.length && coverDays.length>0;
    const base={cg, coverDays, count:coverDays.length, reqLen:reqDays.length, allDays,
      missingReqs, reqOk:missingReqs.length===0, dist, drive:dist!=null?driveMin(dist):null, history};
    // EXPAND pool — outside the criteria: not available these days/time, or missing 2+ requirements
    if(!coverDays.length){ base.cov='partial'; base.availLabel='Not available these days/time'; base.reason='Not available these days/time'; expand.push(base); return; }
    if(missingReqs.length>=2){ base.cov='partial'; base.availLabel='Missing '+missingReqs.join(', '); base.reason='Missing '+missingReqs.join(', '); expand.push(base); return; }
    // PARTIAL COVERAGE — covers some, not all, of the selected days
    if(!allDays){ base.cov='partial'; base.availLabel=`Covers ${coverDays.join(', ')} \u00b7 ${reqDays.length-coverDays.length} day${reqDays.length-coverDays.length>1?'s':''} short`; partial.push(base); return; }
    // covers ALL selected days at the full time window
    const far = dist!=null && dist>20;
    const ot = cg.weekHrs>=38;
    const issue = missingReqs.length>=1 || far || ot;
    if(!issue){
      base.cov='full'; base.availLabel=`Available ${daySpanLabel(coverDays)} ${fmtHr(sq.start)}\u2013${fmtHr(sq.end)}`;
      const strong = cg.driver && (dist==null||dist<=15) && cg.reliability>=90;
      (strong?best:other).push(base);
    } else {
      base.cov='full';
      const flag = missingReqs.length ? ('missing '+missingReqs.join(', ')) : (far ? `${dist} mi out` : 'near overtime');
      base.availLabel=`Available \u00b7 ${flag}`; base.nearFlag=flag;
      near.push(base);
    }
  });
  [best,other,near,partial,expand].forEach(a=>a.sort(rankCmp));
  return {best, other, near, partial, expand, reqDays,
    exact:best.length+other.length,
    total:best.length+other.length+near.length+partial.length};
}

  if((x=allD(b)-allD(a))) return x;
  if((x=fullS(b)-fullS(a))) return x;
  if((x=(b.history?1:0)-(a.history?1:0))) return x;
  if((x=(b.cg.driver?1:0)-(a.cg.driver?1:0))) return x;
  const da=a.dist==null?999:a.dist, db=b.dist==null?999:b.dist;
  if((x=da-db)) return x;

function dateSearch(sq){
  const dates=selectedDates(sq), start=sq.specStart, end=sq.specEnd;
  const cl=sq.clientId?clById(sq.clientId):null, rg=cl?reqGender(cl.restrictions):null, rows=[];
  state.caregivers.forEach(cg=>{
    if(cg.active===false) return;
    if(!caregiverPassesFilters(cg, sq.filters, {clientId:sq.clientId})) return;
    if((sq.skills||[]).some(sk=>!cg.skills.includes(sk))) return;
    if(sq.clientId && cg.blockedClients.includes(sq.clientId)) return;
    if(rg && cg.gender!==rg) return;
    if(!(sq.filters||[]).includes('Include Unverified Caregivers') && availVerifyStatus(cg).key==='unverified') return;
    let covered=0; const perDate=dates.map(ds=>{ const dk=dayKeyFromDate(ds); const cd=coverageDetail(cg,dk,start,end,ds); const conflict=assignedOnDate(cg.id,ds,start,end);
      let cov = conflict?'conflict':cd.cov, label = conflict?('Assigned \u00b7 '+conflict):cd.label;
      if(cov==='full') covered++; return {ds, cov, label}; });
    if(covered===0 && !dates.length) return;
    rows.push({cg, covered, total:dates.length, perDate});
  });
  rows.sort((a,b)=> b.covered-a.covered || availVerifyStatus(a.cg).rank-availVerifyStatus(b.cg).rank || b.cg.reliability-a.cg.reliability || miles(a.cg.base,sq.city||a.cg.base)-miles(b.cg.base,sq.city||b.cg.base));
  const withCov=rows.filter(r=>r.covered>0);
  return {dates, exact:withCov.filter(r=>r.covered===dates.length && dates.length>0), partial:withCov.filter(r=>r.covered>0 && r.covered<dates.length)};
}

function removeSearchDate(d){ const sq=state.searchQuery; sq.dates=(sq.dates||[]).filter(x=>x!==d); render(); }
function toggleRecSearchDay(d){ const sq=state.searchQuery; if(!sq.recDays) sq.recDays=[]; const i=sq.recDays.indexOf(d); if(i>=0) sq.recDays.splice(i,1); else sq.recDays.push(d); render(); }
function toggleUseDates(on){ const sq=state.searchQuery; sq.useDates=on; if(on && !(sq.dates&&sq.dates.length)) sq.dates=[toDateInput(NOW)]; render(); }

  return `<div class="cov-dayblock ds-enh"><label class="ds-enh-tog"><input type="checkbox" ${on?'checked':''} onchange="toggleUseDates(this.checked)"> Search by specific dates <span class="cov-fhint">optional \u2014 single date, multiple dates, range, or recurring, instead of weekdays</span></label>${body}</div>`;

  return `<div class="ds-row">
    <div class="ds-rtop"><span class="ds-name">${esc(r.cg.name)}</span><span class="ds-badge ${exact?'ok':'part'}">${exact?ic('check',12):ic('alerts',12)} Available ${r.covered} of ${r.total} dates</span></div>
    <div class="ds-meta">${miles(r.cg.base,sq.city||r.cg.base)}mi \u00b7 ${r.cg.weekHrs}h/wk \u00b7 ${r.cg.reliability}% reliable${r.cg.driver?' \u00b7 driver':''}</div>
    <div class="ds-chips">${chips}</div>
    <div class="ds-acts"><button class="btn sm" onclick="manualCall('${r.cg.id}')">${ic('phone',12)} Call</button></div>

}

  return head + grp('Exact Matches','available for all selected dates & times',r.exact) + grp('Partial Matches','available for some of the selected dates',r.partial);

function recurringSearch(rq){
  const cl=rq.clientId?clById(rq.clientId):null;
  const rg=cl?reqGender(cl.restrictions):null;
  const reqDays=REC_DAYS.filter(d=>rq.days.includes(d));   // keep canonical order
  const full=[], partial=[], excluded=[];
  if(!reqDays.length) return {full,partial,excluded,reqDays};
  state.caregivers.forEach(cg=>{
    let ex=null;
    if(rq.clientId && cg.blockedClients.includes(rq.clientId)) ex='Blocked from client';
    if(!ex && rg && cg.gender!==rg) ex='Client restriction \u00b7 '+(rg==='F'?'female only':'male only');
    if(!ex){ const miss=rq.skills.filter(s=>!cg.skills.includes(s)); if(miss.length) ex='Missing skill: '+miss.join(', '); }
    if(!ex && cl && cl.pets && cg.restrictions.includes('No pets')) ex='Caregiver restriction \u00b7 no pets';
    if(!ex && rq.skills.includes('Transfers') && cg.restrictions.includes('No transfers (back)')) ex='Caregiver restriction \u00b7 no transfers';
    if(ex){ excluded.push({cg,reason:ex}); return; }
    if(!caregiverPassesFilters(cg, rq.filters, {clientId:rq.clientId})){ excluded.push({cg, reason:'Does not match selected filters'}); return; }
    const coverDays=reqDays.filter(d=>coversShift(windowsForDay(cg,d), rq.start, rq.end));
    if(!coverDays.length){ excluded.push({cg,reason:'Not available on requested days/time'}); return; }
    const dist=rq.city?miles(cg.base,rq.city):0;
    const history=rq.clientId?cg.priorClients.includes(rq.clientId):null;
    const e={cg, coverDays, dist, drive:driveMin(dist), history, count:coverDays.length};
    if(coverDays.length===reqDays.length) full.push(e); else partial.push(e);
  });
  const rel=(a,b)=>(b.cg.reliability-a.cg.reliability)||(a.dist-b.dist);
  full.sort((a,b)=>((b.history?1:0)-(a.history?1:0))||rel(a,b));
  partial.sort((a,b)=>(b.count-a.count)||rel(a,b));
  return {full, partial, excluded, reqDays};
}

function recCard(e,i,reqDays,isFull){
  const cg=e.cg;
  const dayChips=reqDays.map(d=>`<span class="rday ${e.coverDays.includes(d)?'on':'off'}">${d}</span>`).join('');
  const facts=[cg.base, e.dist?`${e.dist} mi (${e.drive} min)`:null, `${cg.reliability}% reliable`, `${cg.weekHrs}h scheduled`, `Driver: ${cg.driver?'Yes':'No'}`, (e.history!=null?`Worked with client: ${e.history?'Yes':'No'}`:null)].filter(Boolean).join(' \u00b7 ');
  const cover = isFull
    ? `<span class="cov-all">Can cover: all ${reqDays.length} day${reqDays.length>1?'s':''}</span>`
    : `<span class="cov-some">Can cover: ${e.coverDays.join(', ')} <span class="cov-frac">${e.count} of ${reqDays.length}</span></span>`;
  return `<div class="bcard rec-card">
    <div class="b-rank">${i+1}</div>
    <div class="b-body">
      <div class="b-name">${cg.name}</div>
      <div class="rec-cover">${cover}</div>
      <div class="rec-days">${dayChips}</div>
      <div class="b-facts">${facts}</div>
    </div>
    <div class="b-cta"><button class="btn pri sm" onclick="recurringCall('${cg.id}')">${ic('phone',13)} Call</button></div>
  </div>`;
}

function renderRecurring(rq){
  if(!rq.days.length) return `<div class="cov-empty">Select the days needed above to search for caregivers.</div>`;
  const {full, partial, excluded, reqDays}=recurringSearch(rq);
  const span = rq.ongoing?'ongoing':(rq.endDate?('through '+new Date(rq.endDate+'T12:00:00').toLocaleDateString([], {month:'short',day:'numeric'})):'');
  const ctx=`${reqDays.join(', ')} \u00b7 ${fmtHr(rq.start)}\u2013${fmtHr(rq.end)}${rq.city?' \u00b7 '+rq.city:''}${rq.clientId?' \u00b7 '+clById(rq.clientId).name:''}${span?' \u00b7 '+span:''}`;
  const head=`<div class="cov-pool"><div class="cp-count"><b>${full.length}</b> caregiver${full.length===1?'':'s'} can cover the full schedule</div><div class="cp-ctx">${ctx}</div></div>`;

  const fullSec = full.length
    ? `<div class="rec-h">Full schedule match <span class="more-n">covers all ${reqDays.length} day${reqDays.length>1?'s':''}</span></div><div class="rec-rows">${full.map((e,i)=>recCard(e,i,reqDays,true)).join('')}</div>`
    : `<div class="cov-empty">No single caregiver can cover the entire schedule. Combine the partial matches below for split coverage.</div>`;

  const partialSec = (!(rq.filters||[]).includes('Available All Requested Days') && partial.length)
    ? `<div class="rec-h">Partial schedule match <span class="more-n">combine for split coverage</span></div><div class="rec-rows">${partial.map((e,i)=>recCard(e,i,reqDays,false)).join('')}</div>`
    : '';

  const exSec = '';

  return head + fullSec + partialSec + exSec;
}

/* ============ AVAILABILITY ============ */
function availStatusOf(c){
  if(c.today===1 && c.avail[dayKey(NOW)]===1) return {label:'Available today', tone:'good'};
  if(Object.values(c.avail).some(v=>v===1)) return {label:'Available this week', tone:'watch'};
  return {label:'Not available', tone:'soon'};
}
function availPattern(c){
  const on=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].filter(d=>c.avail[d]===1);
  if(on.length===7) return 'Every day';
  return daySpanLabel(on);
}
function openHrsOf(c){ return Math.max(0, 40-c.weekHrs); }
function hasOpenSchedule(c){ if(!c.active) return false; const hasAvail=Object.values(c.avail).some(v=>v===1); return hasAvail && openHrsOf(c)>=6; }
function schedStatus(c){ return hasOpenSchedule(c) ? {label:'Open Schedule', tone:'good'} : {label:'No Open Availability', tone:'neut'}; }
const FREQ_OPTS=['Weekly','Every 2 weeks','Every 3 weeks','Monthly','Every 3 months','As needed'];
const STRENGTH_OPTS=['Companion Care','Dementia Care',"Alzheimer's Experience",'Hospice Support','Transfers & Mobility Assistance','Family Communication','Hospital Sitting','Overnight Care','Feeding Assistance','Fall Prevention'];
const STRENGTH_SOURCES=['Scheduler evaluation','Client feedback','Performance review','Caregiver self-assessment','AxisCare skill records'];
const FREQ_DAYS={'Weekly':7,'Every 2 weeks':14,'Every 3 weeks':21,'Monthly':30,'Every 3 months':90,'As needed':null};
const CONFIRM_METHODS=['Call','Text','App','In Person'];
const VERIFY_TPL_DEFAULT="Hi [Caregiver Name], this is Devoted Care. Please reply with your current availability for the next [time period], including days, times, preferred cities, and whether you are available for weekends or overnights. Thank you.";
const CADENCE_OPTS=['Weekly','Every 2 weeks','Monthly','Every 3 months','Custom'];
const CADENCE_MAP={'Weekly':7,'Every 2 weeks':14,'Monthly':30,'Every 3 months':90};
function cadenceDays(c){ const fr=c.ops.availCheckFreq; if(fr==='Custom') return Math.max(1, c.ops.customCadenceDays||30); return CADENCE_MAP[fr]!=null?CADENCE_MAP[fr]:30; }
function verifyDays(c){ return cadenceDays(c); }
function cadenceTimePeriod(c){ const fr=c.ops.availCheckFreq; const M={'Weekly':'week','Every 2 weeks':'2 weeks','Monthly':'month','Every 3 months':'3 months'}; if(fr==='Custom') return (c.ops.customCadenceDays||30)+' days'; return M[fr]||'period'; }
const AV_STATUS={
  current:{key:'current',label:'Current',cls:'current',desc:'Confirmed \u2014 next check not due yet',rank:0},
  duesoon:{key:'duesoon',label:'Due Soon',cls:'duesoon',desc:'Verification coming due shortly',rank:1},
  needs:{key:'needs',label:'Needs Verification',cls:'needs',desc:'Verification is now due',rank:2},
  overdue:{key:'overdue',label:'Overdue',cls:'overdue',desc:'Past due \u2014 verify as soon as possible',rank:3},
  unverified:{key:'unverified',label:'Unverified',cls:'unverified',desc:'No response after repeated attempts',rank:4}
};
function vfEntries(c){ return (c.ops.verifyHistory||(c.ops.verifyHistory=[])); }
function vfSinceConfirm(c){ const out=[]; for(const e of vfEntries(c)){ if(e.result==='verified') break; out.push(e); } return out; }
function noRespCount(c){ return vfSinceConfirm(c).filter(e=>e.result==='noresponse').length; }
function vfLatest(c){ return vfEntries(c)[0]; }
function vfAwaiting(c){ const l=vfLatest(c); return !!(l && l.result==='reminder'); }
function vfReachedPending(c){ const l=vfLatest(c); return !!(l && l.result==='reached'); }
function relDays(d){ if(!d) return ''; const n=Math.floor((NOW-new Date(d))/86400000); return n<=0?'today':(n===1?'yesterday':n+' days ago'); }
const WF_UNVERIFIED_AT=3; /* placeholder threshold \u2014 business rule TBD */
function availVerifyStatus(c){
  if(c.ops.archived) return AV_STATUS.unverified;
  if(noRespCount(c)>=WF_UNVERIFIED_AT) return AV_STATUS.unverified;
  const du=availDaysUntilDue(c); if(du==null) return AV_STATUS.unverified;
  const soon=Math.max(1, Math.ceil(cadenceDays(c)*0.2));
  if(du> soon) return AV_STATUS.current;
  if(du> 0) return AV_STATUS.duesoon;
  if(du> -7) return AV_STATUS.needs;
  return AV_STATUS.overdue;
}
const WF_STAGES=[['start','Send text'],['await','Awaiting reply'],['call','Call'],['second','2nd attempt'],['final','Final notice'],['escalate','Inactive / archive']];
function verifyFlow(c){
  const u=noRespCount(c), st=availVerifyStatus(c), id=c.id;
  const A=(label,fn,kind)=>({label,fn,kind:kind||'sm'});
  if(c.ops.archived) return {idx:5,tone:'crit',title:'Archived',rec:'This caregiver is archived and out of the scheduling pool. Re-confirm availability to reactivate.',actions:[A('Reactivate \u2014 Confirm Availability',`vfReached('${id}')`,'pri')]};
  if(vfReachedPending(c)) return {idx:-1,tone:'good',title:'Caregiver responded',rec:'Record their updated availability to reset the verification cycle.',actions:[A('Confirm Availability Now',`toggleConfirm('${id}')`,'pri')]};
  if(st.key==='current' && !vfSinceConfirm(c).length) return {idx:-1,tone:'good',title:'Availability confirmed',rec:'No action needed until the next check is due ('+(availNextDue(c)?fmtDate(availNextDue(c)):'\u2014')+').',actions:[A('Confirm Again Now',`toggleConfirm('${id}')`,'sm')]};
  if(!vfSinceConfirm(c).length) return {idx:0,tone:'info',title:'Verification due',rec:'Send a verification text to request current availability.',actions:[A('Send Verification Text',`vfSendText('${id}')`,'pri'),A('Log Phone Call \u2014 No Answer',`vfNoResponse('${id}')`),A('Confirm Manually',`toggleConfirm('${id}')`)]};

function cgCalEvents(c, date){

function buildDayEntry(){

  if(!offStatus){
    if(modalState.win==='Custom'){ const s=document.getElementById('dpstart'), en=document.getElementById('dpend'); e.win='Custom'; e.start=s?parseInt(s.value):modalState.start; e.end=en?parseInt(en.value):modalState.end; }
    else e.win=modalState.win;
  }

function saveDayAvail(){
  const c=cgById(modalState.dayCg), entry=buildDayEntry(), d0=new Date(modalState.dayDate), rep=modalState.repeat;
  if(!c.ops.availOverrides) c.ops.availOverrides={};
  if(rep==='Every week'){
    const wd=wdOf(d0); c.ops.avail2[wd]=Object.assign({}, entry);
    c.avail[wd]= dayWindow(entry)?1:0;
    delete c.ops.availOverrides[dateKey(d0)];
  } else {
    const n = rep==='One day only'?1 : (rep==='Every 2 weeks'?27 : (rep==='Monthly'?12 : 1));
    const stepDays = rep==='Every 2 weeks'?14 : 0;
    for(let i=0;i<n;i++){
      let dt;
      if(rep==='Monthly'){ dt=new Date(d0.getFullYear(), d0.getMonth()+i, d0.getDate()); }
      else { dt=new Date(d0.getTime()+i*stepDays*86400000); }
      c.ops.availOverrides[dateKey(dt)]=Object.assign({}, entry);
    }
  }
  c.ops.lastUpdated=new Date(); c.ops.lastUpdatedBy=state.onShift;
  closeSidePanel(); toast('Availability updated for '+d0.toLocaleDateString('en-US',{month:'short',day:'numeric'})); render();
}

function saveAvailability(id){
  const c=cgById(id), ops=c.ops, gV=x=>{const e=document.getElementById(x);return e?e.value:'';};
  if(document.getElementById('rs_'+DAY_ORDER[0])){
    DAY_ORDER.forEach(d=>{
      const st=gV('rs_'+d);
      if(st==='Off'){ ops.avail2[d]={type:'Off'}; c.avail[d]=0; }
      else if(st==='Unavailable'){ ops.avail2[d]={type:'Unavailable'}; c.avail[d]=0; }
      else if(st==='Other Agency'){ ops.avail2[d]={type:'Other Agency'}; c.avail[d]=0; }
      else {
        const wt=gV('rwt_'+d), e={type: st==='Available'?(wt==='Custom'?'Custom':wt):st};
        if(st!=='Available') e.win=wt;
        if(wt==='Custom'){ e.start=parseInt(gV('rs0_'+d)); e.end=parseInt(gV('re0_'+d)); if(st!=='Available'){ e.win='Custom'; } else { e.type='Custom'; } }
        ops.avail2[d]=e; c.avail[d]=1;
      }
    });
    const vs=gV('vacstart'), ve=gV('vacend');
    ops.vacationDates = vs ? {start:vs, end:ve||vs} : null;
  }
  ['short','medium','long','twelve','liveIn'].forEach(k=>{ const e=document.getElementById('sp_'+k); if(e) ops.shiftPrefs[k]=e.checked; });
  const mn=parseInt(gV('minh')), mx=parseInt(gV('maxh'));
  if(!isNaN(mn)) ops.minHours=mn; if(!isNaN(mx)) ops.maxHours=mx;
  const gC=x=>{const e=document.getElementById(x);return e?e.checked:false;};
  if(document.getElementById('em_overnight')) ops.emergency=Object.assign({}, ops.emergency, {day:gC('em_day'),evening:gC('em_evening'),urgent:gC('em_urgent'),sameDay:gC('em_sameday'),sitter:gC('em_sitter'),overnight:gC('em_overnight')});
  if(document.getElementById('tv_vehicle')!==null){ c.ownVehicle=gC('tv_vehicle'); c.driver=gC('tv_driver'); }
  const mi=parseInt(gV('maxmiles')); if(!isNaN(mi)) ops.maxMiles=mi;
  if(document.getElementById('prefcities')) c.prefCities=gV('prefcities').split(',').map(s=>s.trim()).filter(Boolean);
  if(document.getElementById('av_restr')!==null) c.restrictions=gV('av_restr').split('\n').map(s=>s.trim()).filter(Boolean);
  const lf=gV('av_lift'); if(lf!=='') c.liftLimit=parseInt(lf)||0;
  if(document.getElementById('blk_'+state.clients[0].id)){ const prev=ops.clientRestr||[]; ops.clientRestr=state.clients.filter(cl=>gC('blk_'+cl.id)).map(cl=>{ const ex=prev.find(r=>r.client===cl.id); return {client:cl.id, reason:gV('blkr_'+cl.id)||'Do not assign', level:gV('blkl_'+cl.id)||'hard', duration:gV('blkd_'+cl.id)||'permanent', notes:(gV('blkn_'+cl.id)||'').trim(), addedBy: ex?ex.addedBy:state.onShift, addedDate: ex?ex.addedDate:new Date()}; }); }
  const vl=gV('vlast2'); if(vl) ops.availLastConfirmed=new Date(vl+'T12:00');
  ops.availCheckFreq=gV('vfreq2')||ops.availCheckFreq;
  ops.lastUpdated=new Date(); ops.lastUpdatedBy=state.onShift;
  state.cgAvailEdit=null; toast('Availability updated'); render();
}

function resumeData(c){

/* ============ CONTACT LOG ============ */
function openContactLog(shiftId){ state.activeShift=shiftId; go('log'); }
function viewLog(){
  const shifts=openShifts().slice().sort((a,b)=>a.start-b.start);
  if(!shifts.length) return emptyState('No open shifts to track','The contact log keeps every call attempt per shift so two schedulers never call the same caregiver twice.');
  if(!state.activeShift || !shifts.find(s=>s.id===state.activeShift)) state.activeShift=shifts[0].id;
  const s=state.shifts.find(x=>x.id===state.activeShift);
  const cl=clById(s.clientId);
  const log=state.contactLog[s.id]||[];

  const picker=`<div class="filters">
    <span style="font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px">Shift:</span>
    ${shifts.map(x=>{const n=(state.contactLog[x.id]||[]).length; return `<button class="fchip ${x.id===s.id?'on':''}" onclick="openContactLog('${x.id}')">${clById(x.clientId).name}${n?` · ${n}`:''}</button>`}).join('')}
  </div>`;

  const head=`<div class="card" style="padding:15px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="flex:1"><div style="font-weight:800;font-size:16px">${cl.name} · ${cl.city}</div>
    <div style="font-size:13px;color:var(--ink-soft);margin-top:2px">${fmtDay(s.start)} ${fmtTime(s.start)}–${fmtTime(s.end)} · ${log.length} attempt${log.length!==1?'s':''} logged</div></div>
    <button class="btn pri" onclick="openContactModal('${s.id}', null)">${ic('phone',15)} Log a contact</button>
    <button class="btn" onclick="openFindCoverage('${s.id}')">${ic('coverage',15)} Ranked caregivers</button>
  </div>`;

  let body;
  if(!log.length){
    body=`<div class="card" style="padding:0 18px"><div class="empty"><div class="et">No calls logged yet for this shift</div><div class="subnote">Log every attempt so the next scheduler picks up where you left off.</div></div></div>`;
  } else {
    const resMap={'accepted':['Accepted','ld-accept','A'],'declined':['Declined','ld-decline','D'],'no-answer':['No answer','ld-noanswer','—'],'callback':['Call back','ld-callback','↺']};
    body=`<div class="card" style="padding:6px 18px">`+
      log.slice().reverse().map(l=>{
        const cg=cgById(l.caregiverId); const r=resMap[l.result]||['?','ld-noanswer','?'];
        return `<div class="logitem">
          <div class="ldot ${r[1]}">${r[2]}</div>
          <div class="lmain">
            <div class="lhead"><b>${cg?cg.name:'Caregiver'}</b> — ${r[0]}${l.reason?` · <span style="color:var(--crit-tx)">${l.reason}</span>`:''}</div>
            <div class="lmeta">${fmtTime(l.time)} · by ${l.by}${l.note?` · "${l.note}"`:''}</div>
          </div>
        </div>`;
      }).join('')+`</div>`;
  }
  const dupNote=`<div class="subnote" style="margin-top:12px">Already contacted: ${log.length?[...new Set(log.map(l=>cgById(l.caregiverId)?.name))].join(', '):'no one yet'}. These are flagged in Find Coverage so they aren't called again.</div>`;
  return picker + head + body + dupNote;
}

function viewHandoff(){
  function tdot(tier){ return tier==='critical'?'crit':(tier==='urgent'?'soon':(tier==='upcoming'?'watch':'neut')); }
  function clog(){ const out=[]; Object.keys(state.contactLog||{}).forEach(sid=>{ (state.contactLog[sid]||[]).forEach(l=>out.push(Object.assign({sid},l))); }); return out; }
  // ---- Coverage Updates ----
  function gOpenCoverage(){ return openShifts().map(s=>{const cl=clById(s.clientId),a=openAgeInfo(s);return {main:cl.name+' \u00b7 '+cl.city, meta:timeUntilText(s)+' \u00b7 open '+a.label, cls:tdot(startPriority(s).tier)};}); }
  function gPendingResp(){ return clog().filter(l=>l.result==='no-answer').map(l=>{const cg=cgById(l.caregiverId),s=shiftById(l.sid);return {main:cg.name, meta:'No answer \u00b7 '+(s?clById(s.clientId).name:'')+' \u2014 awaiting callback', cls:'soon'};}); }
  function gAutoCampaigns(){ const ao=state.autoOffer; if(ao&&ao.step==='tracking'){ const cl=clById(shiftById(ao.shiftId).clientId), interested=ao.contacted.filter(id=>ao.responses[id]==='yes').length; return [{main:cl.name+' \u2014 auto-offer running', meta:'sent to '+ao.contacted.length+' \u00b7 '+interested+' interested', cls:'neut'}]; } return []; }
  function gHighPrio(){ return openShifts().filter(s=>['critical','urgent'].includes(startPriority(s).tier)).map(s=>{const cl=clById(s.clientId);return {main:cl.name+' \u00b7 '+cl.city, meta:startPriority(s).label+' \u00b7 starts '+fmtTime(s.start), cls:tdot(startPriority(s).tier)};}); }
  // ---- Follow-Ups Needed ----
  function gCallbacks(){ return clog().filter(l=>l.result==='callback').map(l=>{const cg=cgById(l.caregiverId),s=shiftById(l.sid);return {main:cg.name, meta:'Call back \u00b7 '+(s?clById(s.clientId).name:'')+(l.reason?' ('+l.reason+')':''), cls:'soon'};}); }
  function gAvailVerify(){ return state.caregivers.filter(c=>c.active!==false).map(c=>({c,st:availVerifyStatus(c),d:availDaysSince(c)})).filter(x=>['duesoon','needs','overdue','unverified'].includes(x.st.key)).sort((a,b)=>availVerifyStatus(b.c).rank-availVerifyStatus(a.c).rank||(b.d||0)-(a.d||0)).map(({c,st,d})=>({main:c.name, meta:st.label+' \u2014 '+c.ops.availCheckFreq+' cadence'+(d!=null?', '+d+'d since confirmed':''), cls:(st.key==='unverified'||st.key==='overdue')?'urgent':'followup'})); }
  function gClientConfirm(){ const seen={},out=[]; state.shifts.filter(s=>s.filledToday).forEach(s=>{ if(seen[s.clientId])return; seen[s.clientId]=1; out.push({main:clById(s.clientId).name, meta:'Confirm the replacement caregiver worked out', cls:'neut'}); }); return out; }
  function gPendingActions(){ return [...state.handoff.opener,...state.handoff.closer].filter(h=>!h.done && (h.tag==='Urgent'||h.tag==='Follow-up')).map(h=>({main:h.text, meta:h.by?('flagged by '+h.by):'', cls:h.tag==='Urgent'?'crit':'soon'})); }
  // ---- Issues to Watch ----
  function gDifficult(){ return openShifts().filter(s=>{const att=(state.contactLog[s.id]||[]).length, best=autoOfferTiers(s.id).best.length; return att>=2||best===0;}).map(s=>{const cl=clById(s.clientId),att=(state.contactLog[s.id]||[]).length,best=autoOfferTiers(s.id).best.length;return {main:cl.name+' \u00b7 '+cl.city, meta:best===0?'no strong matches available':att+' attempts so far, still open', cls:'crit'};}); }
  function gRepeatCallOffs(){ return state.caregivers.filter(c=>c.callOffs30>=2).map(c=>({main:c.name, meta:c.callOffs30+' call-offs in the last 30 days', cls:c.callOffs30>=3?'crit':'soon'})); }
  function gCoverageConcerns(){ return openShifts().filter(s=>hoursUntil(s.start)>0 && hoursUntil(s.start)<24).map(s=>{const cl=clById(s.clientId);return {main:cl.name+' \u00b7 '+cl.city, meta:'starts in '+timeUntilText(s)+' \u2014 still uncovered', cls:'crit'};}); }
  function gStaffingRisks(){ return overtimeRisk().map(c=>({main:c.name, meta:c.weekHrs+'h this week \u2014 overtime risk', cls:'soon'})); }
  // ---- renderers ----
  function rows(arr){ if(!arr.length) return '<div class="ho-clear">'+ic('check',12)+' All clear</div>'; const show=arr.slice(0,5).map(r=>`<div class="ho-row"><span class="ho-dot ${r.cls||'neut'}"></span><div class="ho-rtx"><div class="ho-main">${esc(r.main)}</div>${r.meta?`<div class="ho-meta">${esc(r.meta)}</div>`:''}</div></div>`).join(''); return show+(arr.length>5?`<div class="ho-more">+${arr.length-5} more</div>`:''); }
  function grp(label,arr){ return `<div class="ho-grp"><div class="ho-grp-l">${label}${arr.length?`<span class="ho-grp-n">${arr.length}</span>`:''}</div>${rows(arr)}</div>`; }
  function card(title,icon,groups){ const total=groups.reduce((n,g)=>n+g.arr.length,0); return `<div class="ho-card"><div class="ho-card-h">${ic(icon,16)}<span class="ho-card-t">${title}</span><span class="ho-card-n ${total?'on':''}">${total}</span></div><div class="ho-card-b">${groups.map(g=>grp(g.l,g.arr)).join('')}</div></div>`; }

  const cov=card('Coverage Updates','coverage',[
    {l:'Open shifts still needing coverage', arr:gOpenCoverage()},
    {l:'Pending caregiver responses', arr:gPendingResp()},
    {l:'Auto-offer campaigns in progress', arr:gAutoCampaigns()},
    {l:'High-priority shifts', arr:gHighPrio()} ]);
  const fol=card('Follow-Ups Needed','phone',[
    {l:'Caregiver callbacks', arr:gCallbacks()},
    {l:'Availability verification', arr:gAvailVerify()},
    {l:'Client schedule confirmations', arr:gClientConfirm()},
    {l:'Pending actions', arr:gPendingActions()} ]);
  const iss=card('Issues to Watch','alerts',[
    {l:'Difficult-to-fill shifts', arr:gDifficult()},
    {l:'Repeated call-offs', arr:gRepeatCallOffs()},
    {l:'Coverage concerns', arr:gCoverageConcerns()},
    {l:'Staffing risks', arr:gStaffingRisks()} ]);

  // ---- Notes for Next Scheduler ----
  const allNotes=[...state.handoff.opener.map(h=>({h,col:'Opener'})),...state.handoff.closer.map(h=>({h,col:'Closer'}))].sort((a,b)=>(a.h.done?1:0)-(b.h.done?1:0));
  const noteRows = allNotes.length ? allNotes.map(x=>{const h=x.h, tagCls=h.tag==='Urgent'?'crit':h.tag==='Follow-up'?'soon':h.tag==='Done'?'good':'watch'; return `<div class="hnote ${h.done?'done':''}"><div class="tick" onclick="toggleHandoff('${h.id}')">${h.done?ic('check',12):''}</div><div class="htxt">${esc(h.text)}<span class="hnote-by">${esc(x.col)}${h.by?' \u00b7 '+esc(h.by):''}</span></div><span class="htag chip ${tagCls}">${esc(h.tag)}</span></div>`;}).join('') : '<div class="ho-clear">'+ic('check',12)+' No notes yet \u2014 add anything the next scheduler should know.</div>';
  const notes=`<div class="ho-card ho-notes"><div class="ho-card-h">${ic('log',16)}<span class="ho-card-t">Notes for Next Scheduler</span><button class="btn sm" onclick="openHandoffModal()" style="margin-left:auto">+ Add note</button></div><div class="ho-card-b">${noteRows}</div></div>`;

  const SA=activeSchedulerNames(), opener=SA[0]||state.onShift||'Opener', closer=SA[1]||SA[0]||'Closer';
  const openN=openShifts().length, followN=gCallbacks().length+gAvailVerify().length+gClientConfirm().length+gPendingActions().length, watchN=gDifficult().length+gRepeatCallOffs().length+gCoverageConcerns().length+gStaffingRisks().length;
  const banner=`<div class="banner ${openN||watchN?'':'calm'}">
    <div class="bico">${ic('handoff',20)}</div>
    <div class="btxt"><div class="t">${esc(opener)} \u2192 ${esc(closer)} \u00b7 shift handoff</div>
    <div class="s">${openN} open shift${openN===1?'':'s'} \u00b7 ${followN} follow-up${followN===1?'':'s'} \u00b7 ${watchN} to watch \u2014 scan top to bottom to pick up where the last scheduler left off.</div></div>
  </div>`;
  return banner + `<div class="grid g-2 ho-grid">${cov}${fol}${iss}${notes}</div>`;
}

function toggleHandoff(id){
  [...state.handoff.opener,...state.handoff.closer].forEach(h=>{ if(h.id===id) h.done=!h.done; });
  render(); toast('Handoff updated');
}

/* ============ ALERTS ============ */
function viewAlerts(){
  const alerts=buildAlerts();
  if(!alerts.length) return emptyState('No active alerts','Devoted Care is in good shape. Alerts only appear when a real threshold is crossed.');
  const head=`<div class="section-h"><h2>Only what crossed a threshold</h2><span class="hint">No noise — each alert reflects a rule worth acting on</span></div>`;
  const colorMap={crit:['var(--crit-bg)','var(--crit-tx)'],soon:['var(--soon-bg)','var(--soon-tx)'],watch:['var(--watch-bg)','var(--watch-tx)']};
  return head + alerts.map(a=>{
    const [bg,tx]=colorMap[a.k];
    return `<div class="alertrow">
      <div class="aico" style="background:${bg};color:${tx}">${ic(a.icon,18)}</div>
      <div class="amain"><div class="at">${a.t}</div><div class="ad">${a.d}</div></div>
      ${a.go?`<button class="btn sm" onclick="(${a.go.toString()})()">Act</button>`:`<span class="chip ${a.k==='crit'?'crit':a.k==='soon'?'soon':'watch'}">${a.k==='crit'?'Urgent':a.k==='soon'?'Today':'Monitor'}</span>`}
    </div>`;
  }).join('');
}

/* ============ AI ASSISTANT ============ */
const AI_CITIES=['Camarillo','Thousand Oaks','Westlake Village','Newbury Park','Moorpark','Simi Valley','Oxnard','Ventura','Ojai','Santa Paula','Fillmore','Port Hueneme'];
const AI_SKILLS=[['dementia','Dementia'],['memory','Dementia'],['hospice','Hospice'],['hoyer','Hoyer Lift'],['transfer','Transfers'],['companion','Companion'],['medication','Medication Reminders'],['feeding','Feeding Tube'],['tube','Feeding Tube'],['suction','Suctioning']];
const AI_EXAMPLES=[
 'Who is available tomorrow from 8 AM\u20132 PM in Camarillo?',
 'Which caregivers have called off in the last 90 days?',
 'Who has the highest reliability score?',
 'Which caregivers have no active schedules?',
 'Which caregivers are available for overnights?',
 'Which caregivers have dementia experience?',
 'Which clients currently have staffing concerns?',
 'Show me all unresolved handoff items.',
 'Which caregivers have the most call-offs?',
 'Which clients are hardest to staff?',
 'Which shifts take the longest to fill?',
 'Which caregivers have not worked recently?',
 'What are the biggest coverage risks this week?',
 'Who is available for hospital sitter coverage?'
];
function aiCgLink(c){ return `<a class="ai-cg" onclick="openCaregiver('${c.id}')">${c.name}</a>`; }
function aiEmpty(m){ return `<div class="ai-none">${m}</div>`; }
function aiRows(rows){ return rows.length?`<div class="ai-rows">${rows.join('')}</div>`:''; }
function aiRow(main, meta){ return `<div class="ai-r"><div class="ai-rm">${main}</div>${meta?`<div class="ai-rmeta">${meta}</div>`:''}</div>`; }
function aiActive(){ return state.caregivers.filter(c=>c.active!==false); }
function aiParseWin(q){
  if(/overnight/.test(q)) return [22,30];
  if(/evening/.test(q)) return [17,22];
  if(/\bmorning/.test(q)) return [6,12];
  if(/afternoon/.test(q)) return [12,17];
  const m=q.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|\u2013|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(m){
    let s=parseInt(m[1])+(m[2]?parseInt(m[2])/60:0), e=parseInt(m[4])+(m[5]?parseInt(m[5])/60:0);
    const ap1=m[3], ap2=m[6];
    if(ap1==='pm'&&s<12)s+=12; if(ap1==='am'&&s===12)s=0;
    if(ap2==='pm'&&e<12)e+=12; if(ap2==='am'&&e===12)e=0;
    if(!ap2 && e<=s) e+=12;
    return [s,e];
  }
  return null;
}
function aiParseDay(q){
  if(/today/.test(q)) return new Date(NOW);
  if(/tomorrow/.test(q)){ const d=new Date(NOW); d.setDate(d.getDate()+1); return d; }
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  for(let i=0;i<7;i++){ if(q.includes(days[i])){ const d=new Date(NOW); let add=(i-d.getDay()+7)%7; if(add===0)add=7; d.setDate(d.getDate()+add); return d; } }
  return null;
}
function aiParseCity(q){ for(const c of AI_CITIES){ if(q.includes(c.toLowerCase())) return c; } return null; }
function aiParseSkill(q){ for(const [k,v] of AI_SKILLS){ if(q.includes(k)) return v; } return null; }

function aiAnswer(raw){
  const q=raw.toLowerCase().trim();
  const win=aiParseWin(q), city=aiParseCity(q), day=aiParseDay(q);
  const wantsAvail=/\bavailable\b|who can work|free /.test(q);
  if(/overnight/.test(q) && (wantsAvail||/\bwho\b|caregiver/.test(q))) return aiOvernight();
  if(wantsAvail && (win||day||city) && !/sitter/.test(q)) return aiAvailable(day, win, city);
  if(/most call.?off|highest call.?off|call.?off.*most/.test(q)) return aiCallOffRank();
  if(/call.?off|called off/.test(q)) return aiCallOffs(q);
  if(/no.?show/.test(q)) return aiNoShows();
  if(/reliab/.test(q)) return aiReliability(!/low|worst|concern|risk|bottom/.test(q));
  if(/no (active )?schedul|no open avail|not (currently )?working|without (a )?schedul/.test(q)) return aiNoSchedule();
  if(/not worked|haven'?t worked|not.*recent|idle/.test(q)) return aiNotRecent();
  const skill=aiParseSkill(q);
  if(skill && /experience|who has|which|certif|trained|skill|qualified|can do|comfortable/.test(q)) return aiBySkill(skill);
  if(/bilingual|spanish|tagalog/.test(q)) return aiLanguage(q);
  if(/sitter|hospital/.test(q)) return aiSitter();
  if(/hardest|difficult.*staff|hard to staff/.test(q)) return aiHardestClients();
  if(/client/.test(q) && /concern|staffing|risk|problem|issue|trouble/.test(q)) return aiClientConcerns();
  if(/longest|slow/.test(q) && /fill|cover|open/.test(q)) return aiLongestFill();
  if(/open shift|coverage need|uncovered|need.*cover|what.*open|shifts? open/.test(q)) return aiOpenShifts();
  if(/handoff|hand-off|hand off/.test(q)) return aiHandoff();
  if(/verif/.test(q)) return aiVerification();
  if(/risk/.test(q) || /biggest.*(gap|problem)/.test(q)) return aiCoverageRisks();
  if(skill) return aiBySkill(skill);
  if(wantsAvail) return aiAvailable(day, win, city);
  const named=state.caregivers.find(c=>{ const f=c.name.toLowerCase().split(' ')[0]; return f.length>3 && q.includes(f); });
  if(named) return aiCaregiver(named);
  return {title:'Not sure I caught that', html:`<div class="ai-none">Try one of the example questions below, or ask about availability, call-offs, reliability, skills, open shifts, clients, handoff, or coverage risks.</div>`};
}
function aiAvailable(day, win, city){
  if(!day){ day=new Date(NOW); day.setDate(day.getDate()+1); }
  if(!win) win=[8,16];
  const dKey=dayKey(day), ds=dateKey(day), ws=win[0], we=win[1];
  const cover=[];
  aiActive().forEach(c=>{
    if(city && !c.prefCities.includes(city)) return;
    const wins=windowsForDay(c,dKey,ds); let full=false, partial=null;
    wins.forEach(([a,b])=>{ if(a<=ws && b>=we) full=true; else if(a<we && b>ws){ const os=Math.max(a,ws),oe=Math.min(b,we); if(!partial||(oe-os)>(partial[1]-partial[0])) partial=[os,oe]; } });
    if(full||partial) cover.push({c,full,partial});
  });
  cover.sort((a,b)=>(b.full-a.full)||(b.c.reliability-a.c.reliability));
  const dayLbl=day.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}), winLbl=_h12(ws)+'\u2013'+_h12(we);
  if(!cover.length) return {title:`Available ${dayLbl}, ${winLbl}${city?' in '+city:''}`, html:aiEmpty('No caregivers match that window'+(city?' in '+city:'')+'. Widen the time or drop the city filter.')};
  const rows=cover.map(({c,full,partial})=>aiRow(aiCgLink(c)+(full?' <span class="ai-tag good">Full</span>':` <span class="ai-tag soon">Partial ${_h12(partial[0])}\u2013${_h12(partial[1])}</span>`), `${c.prefCities.slice(0,2).join(', ')} \u00b7 ${c.weekHrs}h booked \u00b7 ${c.reliability}% reliable${c.skills.length?' \u00b7 '+c.skills.slice(0,3).join(', '):''}`));
  return {title:`${cover.length} available ${dayLbl}, ${winLbl}${city?' in '+city:''}`, html:aiRows(rows)};
}
function aiOvernight(){
  const ovDays=c=>DAY_ORDER.filter(d=>{ const w=dayWindow((c.ops.avail2||{})[d]); return w&&(w[1]>24||w[0]>=22); });
  const list=aiActive().filter(c=>ovDays(c).length || (c.ops.emergency&&c.ops.emergency.overnight)).sort((a,b)=>b.reliability-a.reliability);
  if(!list.length) return {title:'Overnight availability', html:aiEmpty('No caregivers are set up for overnight coverage right now.')};
  const rows=list.map(c=>{ const dd=ovDays(c); return aiRow(aiCgLink(c), (dd.length?'Overnight: '+dd.join(', '):'Open to overnight coverage')+` \u00b7 ${c.reliability}% reliable`); });
  return {title:`${list.length} available for overnights`, html:aiRows(rows)};
}
function aiCallOffs(q){
  const m=q.match(/(\d{1,3})\s*day/); const days=m?parseInt(m[1]):90, cutoff=NOW.getTime()-days*864e5;
  const list=aiActive().map(c=>{ const ev=((c.ops.attendance&&c.ops.attendance.events)||[]).filter(e=>e.type==='calloff'&&new Date(e.date).getTime()>=cutoff); return {c,n:ev.length,last:ev.length?ev.map(e=>new Date(e.date)).sort((a,b)=>b-a)[0]:null}; }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(!list.length) return {title:`Call-offs in the last ${days} days`, html:aiEmpty('No call-offs recorded in that window.')};
  const rows=list.map(({c,n,last})=>aiRow(aiCgLink(c)+` <span class="ai-tag ${n>=2?'crit':'soon'}">${n} call-off${n>1?'s':''}</span>`, 'Last: '+fmtDate(last)));
  return {title:`${list.length} caregiver${list.length>1?'s':''} called off in the last ${days} days`, html:aiRows(rows)};
}
function aiCallOffRank(){
  const list=aiActive().map(c=>({c,s:attendanceStats(c)})).filter(x=>x.s.callOffs>0).sort((a,b)=>b.s.callOffs-a.s.callOffs);
  if(!list.length) return {title:'Most call-offs', html:aiEmpty('No call-offs on record.')};
  const rows=list.map(({c,s})=>aiRow(aiCgLink(c)+` <span class="ai-tag ${s.callOffs>=2?'crit':'soon'}">${s.callOffs}</span>`, `${s.callOffsWeek?s.callOffsWeek+' this week \u00b7 ':''}${s.criticalNotice?s.criticalNotice+' short-notice \u00b7 ':''}${s.lastCallOff?'last '+fmtDate(s.lastCallOff):''}`));
  return {title:'Caregivers ranked by call-offs', html:aiRows(rows)};
}
function aiNoShows(){
  const list=aiActive().map(c=>({c,s:attendanceStats(c)})).filter(x=>x.s.noShows>0).sort((a,b)=>b.s.noShows-a.s.noShows);
  if(!list.length) return {title:'No-shows', html:aiEmpty('No no-shows on record.')};
  const rows=list.map(({c,s})=>aiRow(aiCgLink(c)+` <span class="ai-tag crit">${s.noShows} no-show${s.noShows>1?'s':''}</span>`, s.lastNoShow?'Last '+fmtDate(s.lastNoShow):''));
  return {title:`${list.length} caregiver${list.length>1?'s':''} with no-shows`, html:aiRows(rows)};
}
function aiReliability(top){
  const list=[...aiActive()].sort((a,b)=> top? b.reliability-a.reliability : a.reliability-b.reliability).slice(0,8);
  const rows=list.map(c=>{ const s=attendanceStats(c); return aiRow(aiCgLink(c)+` <span class="ai-tag ${c.reliability>=95?'good':c.reliability>=85?'soon':'crit'}">${c.reliability}%</span>`, `${c.weekHrs}h/wk \u00b7 ${s.callOffs} call-off${s.callOffs!==1?'s':''} on record`); });
  return {title: top?'Highest reliability':'Lowest reliability \u2014 watch list', html:aiRows(rows)};
}
function aiNoSchedule(){
  const list=state.caregivers.filter(c=>c.active===false || c.weekHrs===0 || !hasOpenSchedule(c));
  if(!list.length) return {title:'No active schedules', html:aiEmpty('Every caregiver is active with an open schedule.')};
  const rows=list.map(c=>aiRow(aiCgLink(c)+(c.active===false?' <span class="ai-tag">Inactive</span>':''), c.active===false?'Not active':(c.weekHrs===0?'No shifts scheduled':'No open availability')));
  return {title:`${list.length} caregiver${list.length>1?'s':''} with no active schedule`, html:aiRows(rows)};
}
function aiNotRecent(){
  const list=state.caregivers.filter(c=>c.active===false || c.weekHrs<12).sort((a,b)=>a.weekHrs-b.weekHrs);
  if(!list.length) return {title:'Caregivers not working recently', html:aiEmpty('Everyone has recent hours.')};
  const rows=list.map(c=>aiRow(aiCgLink(c)+(c.active===false?' <span class="ai-tag">Inactive</span>':''), c.active===false?'Not active':`${c.weekHrs}h this week`+(c.ops.lastClient&&clById(c.ops.lastClient)?' \u00b7 last with '+clById(c.ops.lastClient).name:'')));
  return {title:`${list.length} caregiver${list.length>1?'s':''} with little or no recent work`, html:aiRows(rows)};
}
function aiBySkill(skill){
  const list=aiActive().filter(c=>c.skills.includes(skill)).sort((a,b)=>b.reliability-a.reliability);
  if(!list.length) return {title:`${skill} experience`, html:aiEmpty(`No active caregivers list ${skill}.`)};
  const rows=list.map(c=>aiRow(aiCgLink(c), `${c.skills.join(', ')} \u00b7 ${c.reliability}% reliable \u00b7 ${c.prefCities.slice(0,2).join(', ')}`));
  return {title:`${list.length} caregiver${list.length>1?'s':''} with ${skill} experience`, html:aiRows(rows)};
}
function aiLanguage(q){
  const lang=/spanish/.test(q)?'Spanish':/tagalog/.test(q)?'Tagalog':null;
  const list=aiActive().filter(c=>(c.languages||[]).some(l=> lang? l===lang : l!=='English'));
  if(!list.length) return {title:'Bilingual caregivers', html:aiEmpty('No matching caregivers.')};
  const rows=list.map(c=>aiRow(aiCgLink(c), (c.languages||[]).join(', ')+` \u00b7 ${c.reliability}% reliable`));
  return {title: lang?`${lang}-speaking caregivers`:'Bilingual caregivers', html:aiRows(rows)};
}
function aiSitter(){
  const cgs=aiActive().filter(c=>c.ops.emergency&&c.ops.emergency.sitter).sort((a,b)=>b.reliability-a.reliability);
  const clients=state.clients.filter(cl=>cl.careType&&/sitter|hospital/i.test(cl.careType));

function confirmBlockOverride(){ const bw=state._bw; if(!bw) return; const reason=((document.getElementById('bwReason')||{}).value||'').trim(); if(reason.length<=2) return; if(bw.hard && !gC('bwAdmin')) return; const sid=bw.shiftId, cid=bw.cgId, hard=bw.hard; state._bw=null; closeModal(); doAssign(sid,cid,{level:hard?'hard':'soft', reason, by:state.onShift}); }

function partialGap(cg,q,dKey){
  const wins=windowsForDay(cg,dKey,q&&q.date); let cs=null,ce=null;
  wins.forEach(([ws,we])=>{ const s=Math.max(ws,q.start), e=Math.min(we,q.end); if(e>s){ if(cs===null||s<cs)cs=s; if(ce===null||e>ce)ce=e; } });
  const gaps=[]; if(cs!==null){ if(cs>q.start) gaps.push([q.start,cs]); if(ce<q.end) gaps.push([ce,q.end]); }
  return {cs,ce,gaps};
}
function logContact(result, opt){
  opt=opt||{};

  state.contactLog[shiftId].push({caregiverId:cgId, by:state.onShift, time:new Date(), result, reason:opt.reason||'', callback:opt.callback||'', note:''});

function assignShift(shiftId, cgId){
  const s=state.shifts.find(x=>x.id===shiftId);
  s.status='filled'; s.assigned=cgId; s.callOff=false;
  if(!state.contactLog[shiftId]) state.contactLog[shiftId]=[];
  if(!lastContact(shiftId,cgId) || lastContact(shiftId,cgId).result!=='accepted'){
    state.contactLog[shiftId].push({caregiverId:cgId, by:state.onShift, time:new Date(), result:'accepted', reason:'', note:'Assigned'});

n:absolute;top:-4px;left:-4px;width:24px;height:24px;border-radius:50%;background:#2C5F7C;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}.po-step-tx{font-size:17px;font-weight:700;line-height:1.3;color:#1c3140}.po-arrow{display:flex;justify-content:flex-start;padding-left:23px;color:#A6C4D6;height:22px;align-items:center}.po-arrow svg{width:22px;height:22px}.po-lis{padding:16px 26px 10px;display:flex;flex-direction:column;gap:12px}.po-li{display:flex;align-items:flex-start;gap:13px;font-size:15.5px;line-height:1.4;font-weight:500;color:#2b3a44}.po-tick{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;margin-top:1px}.po-tick svg{width:16px;height:16px}.po-tick.green{background:#2E9E6A}.po-tick.red{background:#D24A3D}.po-warn{display:flex;gap:16px;align-items:flex-start;margin:14px 26px 4px;background:#FFF4E0;border:2px solid #F0C475;border-left:8px solid #E0922E;border-radius:14px;padding:18px 20px}.po-warn-ic{width:54px;height:54px;border-radius:14px;background:#E0922E;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.po-warn-ic svg{width:32px;height:32px}.po-warn-body{flex:1;min-width:0}.po-warn-h{font-size:15px;font-weight:800;color:#9A5B12;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}.po-warn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}.po-warn li{font-size:15px;line-height:1.4;color:#6e4a13;font-weight:600}.po-contact{margin:16px 26px 6px;background:#2C5F7C;border-radius:14px;padding:16px 20px}.po-contact-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#bcd6e6;margin-bottom:12px}.po-contact-h svg{color:#bcd6e6;flex:0 0 auto}.po-contact-row{display:flex;flex-wrap:wrap;gap:14px 28px}.po-ci{display:flex;flex-direction:column}.po-ci-l{font-size:10px;color:#9ec3da;font-weight:700;text-transform:uppercase;letter-spacing:.3px}.po-ci-p{font-size:19px;font-weight:800;color:#fff;white-space:nowrap}.po-foot{padding:18px 26px 22px;text-align:center;font-size:10.5px;color:#9aa3ad;font-weight:600;letter-spacing:.3px}@media(max-width:560px){.po-title{font-size:26px}.po-head{gap:14px;padding:22px 18px}.po-head-ic{width:66px;height:66px}.po-head-ic svg{width:36px;height:36px}.po-bar,.po-steps,.po-lis{padding-left:18px;padding-right:18px}.po-warn,.po-contact{margin-left:18px;margin-right:18px}.po-step-tx{font-size:16px}}.po-step,.po-li,.po-warn,.po-contact,.po-sec{break-inside:avoid}`;
function stepIcon(t){ t=(t||'').toLowerCase();
  if(/\bcall\b|phone|dial/.test(t)) return 'phone';
  if(/text|message/.test(t)) return 'ban';
  if(/911|emergency|ambulance/.test(t)) return 'alerts';
  if(/\bname\b/.test(t)) return 'user';
  if(/client/.test(t)) return 'pin';
  if(/date|time|shift/.test(t)) return 'calendar';
  if(/reason|document|note|record|write|report|incident/.test(t)) return 'forms';
  if(/confirm/.test(t)) return 'check';
  if(/wait/.test(t)) return 'clock';
  if(/coverage|cover/.test(t)) return 'coverage';
  if(/family|daughter|son|wife|husband/.test(t)) return 'heart';
  if(/wash|hand|hygiene/.test(t)) return 'droplet';
  if(/drink|fluid|water|hydrat/.test(t)) return 'droplet';
  if(/eat|meal|food|appetite|feed/.test(t)) return 'utensils';
  if(/transfer/.test(t)) return 'swap';
  if(/sit|position|reposition|bed|chair|pillow|\bturn\b/.test(t)) return 'repeat';
  if(/monitor|watch|observe|look for|signs/.test(t)) return 'eye';
  if(/medication|pill|dose|meds/.test(t)) return 'pill';
  if(/notify|office|inform/.test(t)) return 'bell';
  if(/calm|reassure|comfort|redirect/.test(t)) return 'heart';
  if(/safe|safety|hazard|lock|brake|belt|gait/.test(t)) return 'shield';
  if(/fall|fell|lift/.test(t)) return 'alerts';
  if(/space|remove|noise|light/.test(t)) return 'spark';
  return 'check';
}
function infographicBody(g){
  const def=guideTypeDef(g);
  const liList=(items,cls,tick)=> `<div class="po-lis">${items.map(x=>`<div class="po-li"><span class="po-tick ${cls}">${ic(tick,16)}</span><span>${gEsc(x)}</span></div>`).join('')}</div>`;
  const numbered=(items,label)=>{
    const steps=items.map((x,i)=>{ const arrow=i<items.length-1?`<div class="po-arrow">${ic('flowdown',22)}</div>`:''; return `<div class="po-step"><div class="po-step-badge">${ic(stepIcon(x),30)}<span class="po-step-n">${i+1}</span></div><div class="po-step-tx">${gEsc(x)}</div></div>${arrow}`; }).join('');
    return `<div class="po-sec"><div class="po-bar po-bar-brand">${ic('tasks',16)} ${gEsc(label)}</div><div class="po-steps">${steps}</div></div>`;
  };
  const sectionHtml=(fl)=>{
    if(fl.style==='text'||fl.style==='name') return '';
    const items=g[fl.slot]||[]; if(!items.length) return '';
    if(fl.style==='numbered') return numbered(items,fl.label);
    if(fl.style==='bullets') return `<div class="po-sec"><div class="po-bar po-bar-brand">${ic('guide',16)} ${gEsc(fl.label)}</div>${liList(items,'brand','check')}</div>`;
    if(fl.style==='do') return `<div class="po-sec"><div class="po-bar po-bar-green">${ic('check',16)} ${gEsc(fl.label)}</div>${liList(items,'green','check')}</div>`;
    if(fl.style==='dont') return `<div class="po-sec"><div class="po-bar po-bar-red">${ic('x',16)} ${gEsc(fl.label)}</div>${liList(items,'red','x')}</div>`;
    if(fl.style==='warn') return `<div class="po-warn"><div class="po-warn-ic">${ic('alerts',32)}</div><div class="po-warn-body"><div class="po-warn-h">${gEsc(fl.label)}</div><ul>${items.map(x=>`<li>${gEsc(x)}</li>`).join('')}</ul></div></div>`;
    return '';
  };
  const body=def.fields.map(sectionHtml).join('');
  const contact = g.contact ? `<div class="po-contact"><div class="po-contact-h">${ic('phone',15)} Questions? Call the Office</div><div class="po-contact-row">${DC_CONTACT.map(c=>`<div class="po-ci"><div class="po-ci-l">${gEsc(c.label)}</div><div class="po-ci-p">${gEsc(c.phone)}</div></div>`).join('')}</div></div>` : '';
  const forWho=(g.type==='client'&&g.clientName)?`<div class="po-forwho">For ${gEsc(g.clientName)}</div>`:'';
  return `<div class="po">
    <div class="po-head"><div class="po-head-l"><div class="po-eyebrow">${brandLogo('po-logo')}<span>Devoted Care \u00b7 ${gEsc(def.label)}</span></div><div class="po-cat">${gEsc(g.category||'')}</div><div class="po-title">${gEsc(g.title||'Untitled Guide')}</div>${forWho}${g.topic?`<div class="po-topic">${gEsc(g.topic)}</div>`:''}</div><div class="po-head-ic">${ic(guideCatIcon(g.category),46)}</div></div>
    ${body}${contact}
    <div class="po-foot">Devoted Care Services \u00b7 Because you deserve, devoted care.</div>
  </div>`;
}

function previewGuide(id, fmt){ const g=guideById(id); if(!g) return; state.guidePreviewId=id; state.guidePreviewFmt = (fmt==='info'||fmt==='guide') ? fmt : (state.guidePreviewFmt||'guide'); renderPreviewModal(); }
function setPreviewFmt(f){ state.guidePreviewFmt=f; renderPreviewModal(); }
function renderPreviewModal(){
  const g=guideById(state.guidePreviewId); if(!g) return;
  const fmt=state.guidePreviewFmt==='info'?'info':'guide';
  const body=fmt==='info'?infographicBody(g):guideBody(g);
  const infoLabel = fmt==='guide' ? `${ic('spark',13)} Generate Infographic` : `${ic('spark',13)} Infographic`;
  const seg=`<div class="gd-fmtwrap"><div class="gd-fmt"><button class="gd-fmtbtn ${fmt==='guide'?'on':''}" onclick="setPreviewFmt('guide')">${ic('forms',13)} Quick Guide</button><button class="gd-fmtbtn ${fmt==='info'?'on':''}" onclick="setPreviewFmt('info')">${infoLabel}</button></div></div>`;
  mEl.classList.add('mwide');
  mEl.innerHTML=`<div class="mh"><span class="mt">${fmt==='info'?'Infographic':'Quick Guide'} preview</span><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb gd-modalbody">${seg}<div class="gd-pvwrap">${body}</div></div>
    <div class="mf gd-modalfoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn" onclick="editGuide('${g.id}')">${ic('log',13)} Edit</button><button class="btn" onclick="openGuideSend('${g.id}','${fmt}')">${ic('send',13)} Send</button><button class="btn pri" onclick="printGuide('${g.id}','${fmt}')">${ic('print',13)} Print / PDF</button></div>`;

}
function printGuide(id, fmt){
  const g=guideById(id); if(!g) return;
  fmt = fmt==='info'?'info':'guide';
  const css = (fmt==='info'?INFOGRAPHIC_PRINT_CSS:GUIDE_PRINT_CSS)+GUIDE_EXTRA_CSS;
  const body = fmt==='info'?infographicBody(g):guideBody(g);
  const label = fmt==='info'?'Infographic':'Quick Guide';
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${gEsc(g.title)} \u2014 ${label} \u2014 Devoted Care</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>${css}@page{size:letter portrait;margin:0.45in}</style></head><body>${body}</body></html>`;
  const w=window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); setTimeout(()=>{try{w.print();}catch(e){}},350); } else { toast('Allow pop-ups to print or save as PDF'); }
}
function openGuideSend(id, fmt){
  const g=guideById(id); if(!g) return;
  fmt = fmt==='info'?'info':'guide';
  closeModal();
  const label = fmt==='info'?'Infographic':'Quick Guide';
  mEl.innerHTML=`<div class="mh"><span class="mt">Send ${label}</span><button class="mc" onclick="closeModal()">×</button></div>
    <div class="mb"><div class="gs-title">${gEsc(g.title)}</div><div class="gs-sub">Sending the <b>${label}</b> format. Choose how:</div>
      <div class="gs-opts">
        <button class="gs-opt" onclick="sendGuide('${g.id}','text','${fmt}')">${ic('phone',18)}<span>Text message</span></button>
        <button class="gs-opt" onclick="sendGuide('${g.id}','email','${fmt}')">${ic('forms',18)}<span>Email</span></button>
        <button class="gs-opt" onclick="sendGuide('${g.id}','link','${fmt}')">${ic('send',18)}<span>Copy share link</span></button>
      </div></div>`;
  mbg.classList.add('show');
}
function sendGuide(id, channel, fmt){
  const g=guideById(id); if(!g) return;
  fmt = fmt==='info'?'info':'guide';
  const label = fmt==='info'?'Infographic':'Quick Guide';
  if(!state.guideSends) state.guideSends=[];
  state.guideSends.unshift({id:'gs'+Date.now(), guideId:id, channel, fmt, by:state.onShift, at:new Date()});
  if(channel==='link'){ const link='https://guides.devoted.care/'+id+'?f='+fmt; try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(link); }catch(e){} toast(label+' link copied'); }
  else toast(label+' sent by '+(channel==='text'?'text message':'email'));
  closeModal();
}

function useTemplate(key){ const t=GUIDE_TEMPLATES.find(x=>x.key===key); if(!t) return; state.guideEditId=null; state.guideDraft=templateToDraft(t); state.guideCreateStep=null; toast('Template loaded — review and edit'); render(); }

function editGuide(id){ closeModal(); const g=guideById(id); if(!g) return; state.guideEditId=id; const ty=g.type||GUIDE_SEED_TYPES[g.title]||'whatif'; state.guideDraft={type:ty,title:g.title,category:g.category,clientName:g.clientName||'',topic:g.topic||'',stepsText:(g.steps||[]).join('\n'),remindersText:(g.reminders||[]).join('\n'),mistakesText:(g.mistakes||[]).join('\n'),whenCallText:(g.whenCall||[]).join('\n'),contact:g.contact!==false}; state.guideCreateStep=null; state.guidesMode='edit'; render(); }
function guideDraftToObj(){ const d=state.guideDraft||{}; const lines=t=>(t||'').split('\n').map(s=>s.trim()).filter(Boolean); const ex=guideById(state.guideEditId); return {id:state.guideEditId||gGid(), type:d.type||'whatif', title:(d.title||'').trim(), category:d.category||GUIDE_CATEGORIES[0], clientName:(d.clientName||'').trim(), topic:(d.topic||'').trim(), steps:lines(d.stepsText), reminders:lines(d.remindersText), mistakes:lines(d.mistakesText), whenCall:lines(d.whenCallText), contact:!!d.contact, createdBy:(ex&&ex.createdBy)||'Office', createdAt:(ex&&ex.createdAt)||new Date(), updatedAt:new Date()}; }
function gd_set(field, val){ if(!state.guideDraft) return; state.guideDraft[field]=val; renderGuidePreview(); }
function gd_toggleContact(v){ if(!state.guideDraft) return; state.guideDraft.contact=v; renderGuidePreview(); }
function renderGuidePreview(){ const el=document.getElementById('gdPreview'); if(el) el.innerHTML=(state.guideEditFmt==='info'?infographicBody:guideBody)(guideDraftToObj()); }

function cancelGuideEdit(){ state.guidesMode='library'; state.guideDraft=null; state.guideEditId=null; state.guideCreateStep=null; render(); }
function saveGuide(){
  const obj=guideDraftToObj();
  if(!obj.title) return toast('Enter a guide title');
  if(!obj.steps.length && !obj.reminders.length && !obj.mistakes.length && !obj.whenCall.length) return toast('Add at least one step, reminder, mistake, or call-the-office trigger');

function deleteGuide(){ if(!state.guideEditId) return; state.guides=state.guides.filter(g=>g.id!==state.guideEditId); toast('Guide deleted'); state.guidesMode='library'; state.guideDraft=null; state.guideEditId=null; state.guideCreateStep=null; render(); }

function categorizeNote(text){
  const t=(text||'').toLowerCase().trim();
  if(t.length<12) return ['missing'];
  const hits=[];
  CARE_CATEGORIES.forEach(c=>{ if(c.keywords&&c.keywords.length && c.keywords.some(k=>t.indexOf(k)>=0)) hits.push(c.key); });
  const generic=['shift went fine','went fine','all good','no issues','nothing to report'];
  if(hits.length===0 && (t.length<30 || generic.some(g=>t.indexOf(g)>=0))) hits.push('documentation');
  return hits;
}

  (state.careNotes||[]).forEach(n=>{
    categorizeNote(n.text).forEach(catKey=>{
      const cat=CARE_CAT_BY_KEY[catKey]; if(!cat) return;
      const id=n.id+'__'+catKey; const ov=state.careAlertOverrides[id]||{};

    });

}
