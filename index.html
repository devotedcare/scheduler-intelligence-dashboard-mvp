<!DOCTYPE html>
<!--
  ==========================================================================
  Scheduler Intelligence — Devoted Care
  READ CLAUDE.md BEFORE ANSWERING ANY QUESTION ABOUT AXISCARE DATA.
  ==========================================================================

  Two things that are easy to get wrong here:

  1. THE CAREGIVERS, CLIENTS AND SHIFTS ON SCREEN ARE DEMO DATA.
     Rosa Delgado, Cal Miller, Eleanor Wu and the rest are invented and
     generated in the browser on every load. None of it comes from AxisCare.
     The AxisCare connection is built and working, but no screen is wired to
     it yet — that was a deliberate decision, explained in CLAUDE.md.

  2. NEVER INVENT AN AXISCARE FIELD.
     CLAUDE.md lists every field AxisCare actually provides, confirmed by
     live calls. If a field is not on that list, it does not exist — say so
     rather than guessing. A guessed field name renders a silently blank row
     and looks like it worked.

     In particular AxisCare has NO reliability score, NO call-off count and
     NO weekly-hours field. Those numbers in the UI are hardcoded demo
     values. They can be computed from /api/visits, but they are not fields.

  Safe to edit: anything in this file EXCEPT the CLOUD PERSISTENCE block near
  the bottom and the CLOUD.boot() call on the last line. See CLAUDE.md.
  Backend (Netlify env vars, Supabase, the AxisCare token) is Carlo's side.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduler Intelligence — Devoted Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Cloud sync. config.js is generated at deploy time from Netlify env vars (scripts/build-config.js).
     If either of these fails to load, the app still runs — in local-only mode. -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* Structural — navy + charcoal carry ALL chrome and hierarchy */
    --navy-900:#1B3B54; --navy-850:#1F4361; --navy-800:#244B6C; --navy-700:#2C5F7C; --navy-600:#3D7197;
    --accent:#9BBDD4;            /* light steel marker on the dark rail */
    --brand:#2C5F7C;             /* steel blue — primary buttons / focus / active (brand color) */
    --brand-deep:#11181E;

    /* Canvas + surfaces — cleaner, less washed out */
    --app-bg:#F2F4F7;
    --surface:#FFFFFF;
    --panel-head:#EEF1F4;
    --line:#DCE2E8;
    --line-soft:#E8ECF0;
    --line-strong:#BFC9D3;

    /* Ink — high contrast charcoal */
    --ink:#0F171D;
    --ink-soft:#36424B;
    --ink-faint:#64727C;

    /* Status — disciplined; used ONLY for status */
    --crit-bg:#F7DEDA; --crit-tx:#891610; --crit-solid:#C0271A;   /* strong red — immediate action */
    --soon-bg:#FAEBCE; --soon-tx:#785109; --soon-solid:#BD8312;   /* amber — attention needed */
    --good-bg:#DEEDE4; --good-tx:#14542F; --good-solid:#1F7A4A;   /* green — healthy / done */
    --neutral-bg:#E9EDF1; --neutral-tx:#3A4750;                   /* gray — reference only */
    /* legacy "watch" repointed to neutral so blue is no longer a status accent */
    --watch-bg:#E9EDF1; --watch-tx:#36424B; --watch-solid:#1E2A33;
    --r:3px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--app-bg);
    color:var(--ink);
    font-size:13px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .tnum{font-variant-numeric:tabular-nums}

  /* ---------- Shell ---------- */
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  .sidebar{
    background:var(--navy-900);border-right:1px solid var(--navy-700);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  }
  .brand{padding:15px 16px 13px;border-bottom:1px solid var(--navy-700);display:flex;gap:10px;align-items:center}
  .brand .mark{width:32px;height:32px;border-radius:var(--r);background:var(--brand);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand .mark svg{width:19px;height:19px}
  .brand .name{font-weight:800;color:#EAF2F8;font-size:14px;letter-spacing:-.2px;line-height:1.05}
  .brand .sub{font-size:9px;color:#6C849A;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}

  .nav{padding:16px 9px 8px;flex:1;overflow:auto}
  .nav-group{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:#56708A;font-weight:700;padding:13px 9px 5px}
  .nav a{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);
    color:#A9BECE;text-decoration:none;font-weight:550;font-size:13px;cursor:pointer;
    position:relative;margin-bottom:1px;
  }
  .nav a .ico{width:16px;height:16px;flex:0 0 auto;color:#7790A4}
  .nav a:hover{background:rgba(255,255,255,.06);color:#E4EEF5}
  .nav a.active{background:var(--navy-700);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
  .nav a.active .ico{color:var(--accent)}
  .nav a .pill{margin-left:auto;font-size:10.5px;font-weight:800;min-width:19px;height:18px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;padding:0 5px;font-variant-numeric:tabular-nums}
  .nav a .pill.crit{background:var(--crit-solid);color:#fff}
  .nav a .pill.soon{background:var(--soon-solid);color:#fff}
  .nav a .pill.neut{background:rgba(255,255,255,.14);color:#C7D6E2}

  .sidefoot{padding:11px 16px;border-top:1px solid var(--navy-700);font-size:10.5px;color:#7C92A4;line-height:1.5}
  .sidefoot b{color:#CBDAE6;font-weight:700}

  /* ---------- Main ---------- */
  .main{min-width:0}
  .topbar{
    background:#fff;border-bottom:1px solid var(--line-strong);
    padding:9px 20px;display:flex;align-items:stretch;gap:0;position:sticky;top:0;z-index:20;min-height:56px;
  }
  .tb-title{display:flex;flex-direction:column;justify-content:center;padding-right:6px}
  .tb-title .crumb{font-size:10px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
  .tb-title h1{font-size:17px;font-weight:800;letter-spacing:-.3px;line-height:1.15;margin-top:1px}

  .statbar{display:flex;align-items:stretch;margin-left:22px;border-left:1px solid var(--line)}
  .statbar .stat{padding:0 15px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:62px}
  .statbar .stat .sv{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .statbar .stat .sv.crit{color:var(--crit-solid)} .statbar .stat .sv.soon{color:var(--soon-solid)} .statbar .stat .sv.watch{color:var(--brand)} .statbar .stat .sv.good{color:var(--good-solid)}
  .statbar .stat .sl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700;margin-top:4px;white-space:nowrap}

  .live{margin-left:auto;display:flex;align-items:center;gap:10px;align-self:center}
  .livepill{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--good-tx);background:var(--good-bg);padding:5px 9px;border-radius:var(--r);text-transform:uppercase}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good-solid)}
  .axis-note{display:flex;align-items:center;gap:6px;background:var(--navy-900);color:#C7D6E2;border-radius:var(--r);padding:5px 10px;font-size:10.5px;font-weight:650}
  .axis-note svg{color:var(--accent)}
  .syncpill{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 9px;border-radius:var(--r);cursor:default;white-space:nowrap}
  .syncpill .sdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .syncpill.s-synced{color:var(--good-tx);background:var(--good-bg)}
  .syncpill.s-saving{color:var(--soon-tx);background:var(--soon-bg)}
  .syncpill.s-offline{color:var(--neutral-tx);background:var(--neutral-bg)}
  .syncpill.s-error{color:var(--crit-tx);background:var(--crit-bg);cursor:help}

  .view{padding:16px 28px 48px;max-width:1760px}
  .section-h{display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin:26px 0 14px}
  .section-h:first-child{margin-top:4px}
  .section-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink);font-weight:800}
  .section-h .hint{font-size:12.5px;color:var(--ink-faint);font-weight:550}

  /* priority banner */
  .banner{
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--crit-solid);
    border-radius:var(--r);padding:12px 16px;display:flex;gap:13px;align-items:center;margin-bottom:14px;
  }
  .banner.calm{border-left-color:var(--good-solid)}
  .banner .bico{width:36px;height:36px;border-radius:var(--r);background:var(--crit-bg);color:var(--crit-tx);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .banner.calm .bico{background:var(--good-bg);color:var(--good-tx)}
  .banner .btxt{flex:1;min-width:0}
  .banner .btxt .t{font-weight:800;font-size:14.5px;letter-spacing:-.1px}
  .banner .btxt .s{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .banner .baction{flex:0 0 auto}

  /* grids */
  .grid{display:grid;gap:9px}
  .g-crit{grid-template-columns:repeat(3,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:1080px){.g-crit,.g-3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.g-crit,.g-3,.g-2{grid-template-columns:1fr}.statbar{display:none}}

  /* attention tile */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .acard{display:flex;flex-direction:column;cursor:pointer;transition:border-color .1s;position:relative}
  .acard:hover{border-color:var(--brand)}
  .acard .body{padding:12px 13px 9px;flex:1;padding-left:16px}
  .acard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .acard .label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
  .acard .num{font-size:32px;font-weight:800;letter-spacing:-1.2px;margin:6px 0 2px;line-height:1}
  .acard .sub{font-size:12px;color:var(--ink-faint);min-height:17px;line-height:1.35}
  .acard .next{
    border-top:1px solid var(--line-soft);padding:8px 13px 8px 16px;background:var(--panel-head);
    font-size:11.5px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.3px;
  }
  .acard .next .ico{width:13px;height:13px}
  .acard .next .arr{margin-left:auto;color:var(--ink-faint);font-weight:800}
  .acard.is-crit .num{color:var(--crit-solid)}
  .acard.is-soon .num{color:var(--soon-solid)}
  .acard.is-watch .num{color:var(--brand)}
  .acard.is-good .num{color:var(--good-solid)}
  .acard.is-zero .num{color:var(--ink-faint)}
  .acard{position:relative}
  .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
  .rail.crit{background:var(--crit-solid)} .rail.soon{background:var(--soon-solid)}
  .rail.watch{background:var(--brand)} .rail.good{background:var(--good-solid)} .rail.zero{background:var(--line-strong)}

  /* chips / badges — sharp, uppercase */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:var(--r);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  .chip.crit{background:var(--crit-bg);color:var(--crit-tx)}
  .chip.soon{background:var(--soon-bg);color:var(--soon-tx)}
  .chip.watch{background:var(--watch-bg);color:var(--watch-tx)}
  .chip.good{background:var(--good-bg);color:var(--good-tx)}
  .chip.neut{background:var(--neutral-bg);color:var(--neutral-tx)}
  .chip.solid-good{background:var(--good-solid);color:#fff}
  .chip.solid-crit{background:var(--crit-solid);color:#fff}
  .chip .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* buttons — sharp */
  .btn{font-family:inherit;font-size:12.5px;font-weight:650;border-radius:var(--r);padding:7px 12px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s;white-space:nowrap}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.danger{color:var(--crit-tx);border-color:var(--line-strong)}
  .btn.danger:hover{border-color:var(--crit-solid);color:var(--crit-solid)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--panel-head);color:var(--brand)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn .ico{width:14px;height:14px}

  /* list rows */
  .stack{display:flex;flex-direction:column;gap:7px}
  .shiftrow{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:0;display:flex;overflow:hidden}
  .shiftrow .rail{position:static;width:4px;flex:0 0 auto}
  .shiftrow .inner{padding:10px 14px;flex:1;min-width:0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .shiftrow .who{min-width:200px;flex:1}
  .shiftrow .who .cn{font-weight:750;font-size:14.5px;letter-spacing:-.1px}
  .shiftrow .who .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .shiftrow .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .shiftrow .act{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .open-age{font-size:11.5px;color:var(--ink-faint);font-weight:700;font-variant-numeric:tabular-nums}

  .req{font-size:11px;color:var(--ink-soft);background:var(--panel-head);border:1px solid var(--line);padding:2px 7px;border-radius:var(--r);font-weight:650}
  .req.warn{background:var(--soon-bg);color:var(--soon-tx);border-color:transparent}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-strong);background:var(--panel-head)}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-head)}

  /* match ranking */
  .matchcard{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:#fff;display:flex;gap:13px;align-items:center}
  .matchcard.top{border-color:var(--good-solid);box-shadow:inset 3px 0 0 var(--good-solid)}
  .matchcard .rank{font-size:13px;font-weight:800;color:var(--ink-faint);width:22px;text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .matchcard .cg{flex:1;min-width:0}
  .matchcard .cg .nm{font-weight:750;font-size:14.5px;display:flex;align-items:center;gap:8px;letter-spacing:-.1px}
  .matchcard .reasons{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .why{font-size:11px;font-weight:650;padding:2px 7px;border-radius:var(--r);display:inline-flex;gap:5px;align-items:center}
  .why.plus{background:var(--good-bg);color:var(--good-tx)}
  .why.minus{background:var(--crit-bg);color:var(--crit-tx)}
  .why.note{background:var(--neutral-bg);color:var(--neutral-tx)}
  .score{flex:0 0 auto;text-align:center;width:70px}
  .score .val{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
  .score .bar{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
  .score .bar > i{display:block;height:100%}
  .score .lab{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-top:4px}
  .matchcard .cta{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;width:138px}
  .excluded{opacity:.7;background:var(--panel-head)}
  .excluded .score .val{color:var(--ink-faint)}

  .expand-head{display:flex;align-items:center;gap:11px;margin:18px 0 9px;padding:11px 14px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--panel-head);cursor:pointer;transition:.1s}
  .expand-head:hover{border-color:var(--brand)}
  .expand-head .eh-title{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .expand-head .eh-sub{font-size:12px;color:var(--ink-faint)}
  .expand-head .eh-toggle{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.4px}
  .expand-head .eh-toggle svg{transition:transform .15s}
  .expand-head.open .eh-toggle svg{transform:rotate(180deg)}
  .matchcard.compact{padding:9px 14px}
  .matchcard.compact .cg .nm{font-size:13.5px}
  .matchcard.compact .score{width:58px}
  .matchcard.compact .score .val{font-size:19px}
  .matchcard.compact .cta{width:126px}

  /* availability */
  .avail-group{margin-bottom:16px}
  .avail-group h3{font-size:12.5px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft)}
  .cgrow{display:flex;gap:13px;align-items:center;padding:9px 13px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:6px;flex-wrap:wrap}
  .cgrow .nm{font-weight:750;font-size:14px;min-width:148px}
  .cgrow .info{font-size:12px;color:var(--ink-soft);display:flex;gap:13px;flex-wrap:wrap;flex:1}
  .cgrow .info b{color:var(--ink);font-weight:650}
  .reason-tag{font-size:11.5px;color:var(--soon-tx);background:var(--soon-bg);padding:3px 8px;border-radius:var(--r);font-weight:700}

  /* filters */
  .filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .fchip{font-size:12px;font-weight:650;padding:5px 11px;border-radius:var(--r);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);cursor:pointer}
  .cg-fgroup .fchip{font-size:13.5px;font-weight:700;padding:9px 16px;display:inline-flex;align-items:center}
  .fchip:hover{border-color:var(--brand)}
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .search{flex:1;min-width:170px;max-width:270px;padding:7px 11px;border:1px solid var(--line-strong);border-radius:var(--r);font-family:inherit;font-size:12.5px;color:var(--ink)}
  .search:focus{outline:none;border-color:var(--brand)}

  /* contact log */
  .logitem{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
  .logitem:last-child{border-bottom:none}
  .logitem .ldot{width:28px;height:28px;border-radius:var(--r);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .ld-accept{background:var(--good-bg);color:var(--good-tx)}
  .ld-decline{background:var(--crit-bg);color:var(--crit-tx)}
  .ld-noanswer{background:var(--soon-bg);color:var(--soon-tx)}
  .ld-callback{background:var(--watch-bg);color:var(--watch-tx)}
  .logitem .lmain{flex:1;min-width:0}
  .logitem .lhead{font-size:13px}
  .logitem .lhead b{font-weight:750}
  .logitem .lmeta{font-size:11.5px;color:var(--ink-faint);margin-top:2px}

  /* handoff */
  .handoff-col{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .handoff-col .hc-head{padding:10px 15px;border-bottom:1px solid var(--line-strong);display:flex;align-items:center;gap:10px;background:var(--panel-head)}
  .handoff-col .hc-head .ttl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .handoff-col .hc-head .by{font-size:11px;color:var(--ink-faint);margin-left:auto;font-weight:700}
  .hnote{padding:11px 15px;border-bottom:1px solid var(--line-soft);display:flex;gap:11px}
  .hnote:last-child{border-bottom:none}
  .hnote .tick{width:18px;height:18px;border-radius:var(--r);border:1px solid var(--line-strong);flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hnote.done .tick{background:var(--good-solid);border-color:var(--good-solid);color:#fff}
  .hnote.done .htxt{color:var(--ink-faint);text-decoration:line-through}
  .hnote .htxt{font-size:13px;flex:1;line-height:1.4}
  .hnote .htag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:var(--r);flex:0 0 auto;height:fit-content}

  /* alerts */
  .alertrow{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:6px}
  .alertrow .aico{width:32px;height:32px;border-radius:var(--r);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .alertrow .amain{flex:1;min-width:0}
  .alertrow .amain .at{font-weight:750;font-size:13.5px;letter-spacing:-.1px}
  .alertrow .amain .ad{font-size:12px;color:var(--ink-soft);margin-top:1px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(11,32,52,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:var(--r);width:100%;max-width:460px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.32);border-top:3px solid var(--brand)}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel-head)}
  .modal .mh .mt{font-weight:800;font-size:15px}
  .modal .mh .mc{margin-left:auto;cursor:pointer;color:var(--ink-faint);font-size:20px;line-height:1;background:none;border:none}
  .modal .mb{padding:16px 18px;max-height:62vh;overflow:auto}
  .modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-head)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .field select,.field input,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line-strong);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--ink)}
  .field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
  .field textarea{resize:vertical;min-height:62px}
  .radio-row{display:flex;gap:7px;flex-wrap:wrap}
  .radio-opt{flex:1;min-width:88px;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
  .radio-opt.sel{border-color:var(--brand);background:var(--watch-bg);color:var(--brand)}

  .empty{text-align:center;padding:30px 20px;color:var(--ink-faint)}
  .empty .ei{width:38px;height:38px;margin:0 auto 9px;color:var(--good-solid)}
  .empty .et{font-weight:750;color:var(--ink-soft);font-size:13.5px}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy-900);color:#fff;padding:11px 17px;border-radius:var(--r);font-size:13px;font-weight:650;opacity:0;transition:.22s;z-index:200;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:3px solid var(--good-solid)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .subnote{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
  .divider{height:1px;background:var(--line);margin:16px 0}

  /* ===== Today: command-center triage ===== */
  /* Section 1 — urgent hero */
  .urgent{background:#fff;border:1px solid var(--line);border-left:6px solid var(--crit-solid);border-radius:var(--r);padding:18px 20px;margin-bottom:22px}
  .urgent.calm{border-left-color:var(--good-solid)}
  .urgent .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--crit-solid)}
  .urgent.calm .eyebrow{color:var(--good-tx)}
  .urgent .eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:var(--crit-solid);box-shadow:0 0 0 3px var(--crit-bg)}
  .urgent.calm .eyebrow .pulse{background:var(--good-solid);box-shadow:0 0 0 3px var(--good-bg)}
  .urgent .uhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-top:10px}
  .urgent .uclient{font-size:25px;font-weight:800;letter-spacing:-.6px;line-height:1.08;color:var(--ink)}
  .urgent .ustatus{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .urgent .umeta{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
  .urgent .ucount{font-size:30px;font-weight:800;color:var(--crit-solid);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-1.2px}
  .urgent .ucount-l{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);font-weight:800;margin-top:4px;text-align:right}
  .urgent .matches{margin-top:13px;border-top:1px solid var(--line-soft);padding-top:11px}
  .urgent .matches .ml{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);margin-bottom:7px}
  .urgent .mrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
  .urgent .mrow:last-child{border-bottom:none}
  .urgent .mrow .mr{width:19px;height:19px;border-radius:var(--r);background:var(--good-bg);color:var(--good-tx);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .urgent .mrow .mn{font-weight:750}
  .urgent .mrow .ms{margin-left:auto;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .urgent .uactions{display:flex;gap:8px;margin-top:14px}

  /* Section 2 — work queue (inbox) */
  .queue-group{margin-bottom:13px}
  .queue-head{display:flex;align-items:center;gap:8px;padding:7px 0 6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.1px;color:var(--ink-soft)}
  .queue-head .qtick{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .queue-head .qn{margin-left:4px;font-size:10.5px;color:var(--ink-faint);font-weight:700;font-variant-numeric:tabular-nums}
  .qitem{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-top:none;cursor:pointer;transition:background .1s}
  .queue-group .qitem:first-of-type{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .queue-group .qitem:last-of-type{border-radius:0 0 var(--r) var(--r)}
  .queue-group .qitem:only-of-type{border-radius:var(--r)}
  .qitem:hover{background:var(--panel-head)}
  .qitem .qbar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;margin:-10px 0;min-height:40px}
  .qitem .qmain{flex:1;min-width:0}
  .qitem .qt{font-weight:750;font-size:13.5px;letter-spacing:-.1px}
  .qitem .qc{font-size:12px;color:var(--ink-soft);margin-top:1px}
  .qitem .qmeta{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .qitem .qchev{color:var(--ink-faint);font-weight:800;font-size:17px;line-height:1}

  /* Section 3 — team status strip */
  .team-summary{display:flex;align-items:stretch;background:var(--navy-900);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
  .team-summary .ts{padding:11px 20px;border-right:1px solid var(--navy-700);display:flex;align-items:baseline;gap:9px;flex:1;min-width:130px}
  .team-summary .ts:last-child{border-right:none}
  .team-summary .ts .tsv{font-size:21px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
  .team-summary .ts .tsl{font-size:10.5px;color:#90A6B8;font-weight:650;text-transform:uppercase;letter-spacing:.6px}

  /* ===== Find Coverage: dual mode ===== */
  .cov-form{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:14px}
  .mode-toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;margin-bottom:13px}
  .mode-toggle button{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 15px;border:none;background:#fff;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:7px}
  .mode-toggle button .ico{width:15px;height:15px}
  .mode-toggle button + button{border-left:1px solid var(--line-strong)}
  .mode-toggle button.on{background:var(--brand);color:#fff}
  .mode-toggle button.on .ico{color:#fff}
  .cov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
  .cov-field label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:4px}
  .cov-field select,.cov-field input{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--ink);background:#fff}
  .cov-field select:focus,.cov-field input:focus{outline:none;border-color:var(--brand)}
  .cov-skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .cov-skills .sk{font-size:11.5px;font-weight:650;padding:5px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;color:var(--ink-soft);cursor:pointer}
  .cov-skills .sk:hover{border-color:var(--brand)}
  .cov-skills .sk.on{background:var(--watch-bg);border-color:var(--brand);color:var(--brand)}

  .manual-stats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .mstat{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:var(--r);border-left:4px solid var(--ink-soft);padding:13px 15px}
  .mstat .mv{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1;color:var(--ink)}
  .mstat.full{border-left-color:var(--good-solid)} .mstat.full .mv{color:var(--good-tx)}
  .mstat.partial{border-left-color:var(--soon-solid)} .mstat.partial .mv{color:var(--soon-tx)}
  .mstat .ml2{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:800;margin-top:5px}
  .cat-strip{display:flex;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
  .cat-strip .cat{flex:1;min-width:88px;padding:10px 14px;border-right:1px solid var(--line);text-align:center}
  .cat-strip .cat:last-child{border-right:none}
  .cat-strip .cat .cv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .cat-strip .cat .cl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:800;margin-top:3px}

  .grp{margin-bottom:14px}
  .grp-head{display:flex;align-items:center;gap:9px;padding:8px 0 7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-soft)}
  .grp-head .gdot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .grp-head .gn{margin-left:auto;font-size:11px;color:var(--ink-faint);font-weight:700;font-variant-numeric:tabular-nums}
  .availrow{display:flex;align-items:center;gap:12px;padding:9px 13px;background:#fff;border:1px solid var(--line);border-top:none;flex-wrap:wrap}
  .grp .availrow:first-of-type{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .grp .availrow:last-of-type{border-radius:0 0 var(--r) var(--r)}
  .grp .availrow:only-of-type{border-radius:var(--r)}
  .availrow .arname{font-weight:750;font-size:13.5px;min-width:138px}
  .availrow .ardet{font-size:12px;color:var(--ink-soft);flex:1;display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-width:200px}
  .availrow .aract{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
  .warnchip{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:var(--r);background:var(--soon-bg);color:var(--soon-tx)}
  .covlabel{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:var(--r);white-space:nowrap}
  .covlabel.full{background:var(--good-bg);color:var(--good-tx)}
  .covlabel.partial{background:var(--soon-bg);color:var(--soon-tx)}
  .availrow.excl{opacity:.74;background:var(--panel-head)}
  .exreason{font-size:11.5px;color:var(--crit-tx);font-weight:700}

  /* ===== Today: four-level hierarchy (critical dominates, reference fades) ===== */
  .tier{margin-bottom:22px}
  .tier-h{display:flex;align-items:center;gap:9px;margin:0 0 9px}
  .tier-h .tdot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .tier-h .tlabel{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--ink)}
  .tier-h .tcount{font-size:11px;font-weight:800;color:var(--ink-faint);font-variant-numeric:tabular-nums;background:var(--neutral-bg);border-radius:var(--r);padding:1px 7px}
  .tier-rows{display:flex;flex-direction:column}
  .tier-rows .qitem{border:1px solid var(--line);border-top:none}
  .tier-rows .qitem:first-child{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .tier-rows .qitem:last-child{border-radius:0 0 var(--r) var(--r)}
  .tier-rows .qitem:only-child{border-radius:var(--r)}
  /* weight: strong = critical */
  .tier.strong .tier-h .tlabel{font-size:13.5px}
  .qitem.strong{padding:14px 16px}
  .qitem.strong .qt{font-size:15px;font-weight:800;color:var(--ink)}
  .qitem.strong .qc{font-size:12.5px;color:var(--ink-soft)}
  /* weight: normal = risks */
  .qitem.normal .qt{font-size:14px;font-weight:750;color:var(--ink)}
  /* weight: quiet = resources */
  .qitem.quiet{padding:10px 14px}
  .qitem.quiet .qt{font-size:13px;font-weight:700}
  /* weight: faded = reference (recedes) */
  .tier.faded{opacity:.82}
  .tier.faded .tier-h .tlabel{color:var(--ink-faint);font-weight:750}
  .tier.faded .tier-h .tdot{opacity:.6}
  .qitem.faded{background:transparent;border-color:var(--line-soft);padding:9px 14px}
  .qitem.faded .qt{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
  .qitem.faded .qc{font-size:11.5px;color:var(--ink-faint)}
  .qitem.faded:hover{background:var(--panel-head)}
  .qitem.faded .qbar{opacity:.5}

  /* ===== Today: true work queue ===== */
  .wq-summary{font-size:13.5px;color:var(--ink-soft);margin:2px 0 16px;font-weight:600}
  .wq-summary b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .wq-tier{margin-bottom:12px}
  .wq-tier.faded{opacity:.86}
  .wq-tier-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .wq-tier-h .tdot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .wq-tier-h .tlabel{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink)}
  .wq-tier.faded .wq-tier-h .tlabel{color:var(--ink-faint)}
  .wq-tier.faded .wq-tier-h .tdot{opacity:.6}
  .wq-tier-h .thint{font-size:11.5px;color:var(--ink-faint);font-weight:600}
  .wq-rows{display:flex;flex-direction:column}
  .wqi{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-top:none;cursor:pointer;transition:background .1s}
  .wq-rows .wqi:first-child{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .wq-rows > .wqi:last-child{border-radius:0 0 var(--r) var(--r)}
  .wqi:hover{background:var(--panel-head)}
  .wqi.crit.open{background:var(--panel-head);border-bottom-color:var(--line-soft)}
  .wqi .wqbar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;margin:-11px 0;min-height:46px}
  .wqi .num{font-size:13px;font-weight:800;color:var(--ink-faint);font-variant-numeric:tabular-nums;width:20px;text-align:center;flex:0 0 auto}
  .wqi.crit .num{color:var(--crit-solid)}
  .wqi .wqmain{flex:1;min-width:0}
  .wqi .wqt{font-weight:750;font-size:14px;letter-spacing:-.1px;color:var(--ink)}
  .wqi.crit .wqt{font-weight:800}
  .wqi .wqsub{font-size:12px;color:var(--ink-soft);margin-top:1px}
  .wqi.faded .wqt{font-weight:700;color:var(--ink-soft);font-size:13px}
  .wqi.faded .wqsub{color:var(--ink-faint)}
  .wqi.faded .wqbar{opacity:.5}
  .wqi .wqmeta{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .wqi .wqcaret{color:var(--ink-faint);display:flex}
  .wqi .wqcaret svg{transition:transform .15s}
  .wqi.open .wqcaret svg{transform:rotate(180deg)}
  .wqi .wqnav{color:var(--ink-faint);font-weight:800;font-size:17px;line-height:1}

  /* condensed detail */
  .wq-detail{background:#fff;border:1px solid var(--line);border-top:none;padding:13px 16px 14px 29px}
  .wq-rows > .wq-detail:last-child{border-radius:0 0 var(--r) var(--r)}
  .wqd-meta{font-size:12.5px;color:var(--ink-soft)}
  .wqd-meta b{color:var(--crit-solid);font-weight:800}
  .wqd-status{font-size:13.5px;font-weight:800;color:var(--ink);margin-top:3px}
  .wqd-cols{display:flex;gap:30px;flex-wrap:wrap;margin-top:12px}
  .wqd-col{flex:1;min-width:210px}
  .wqd-h{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .wqd-h .wqd-n{background:var(--neutral-bg);border-radius:var(--r);padding:0 6px;font-size:10px;color:var(--ink-soft);font-weight:800}
  .wqd-cg{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;padding:3px 0;color:var(--ink)}
  .wqd-cg .wqd-r{width:17px;height:17px;border-radius:var(--r);background:var(--good-bg);color:var(--good-tx);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .wqd-cg .wqd-s{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-weight:600;font-variant-numeric:tabular-nums}
  .wqd-empty{font-size:12px;color:var(--ink-faint)}
  .wqd-pool{font-size:13px;color:var(--ink-soft);padding:3px 0;font-weight:600;display:flex;align-items:baseline}
  .wqd-pool .wqd-pv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-right:7px;min-width:22px}
  .wqd-pool .wqd-pv.good{color:var(--good-tx)} .wqd-pool .wqd-pv.soon{color:var(--soon-tx)}
  .wqd-pool.subtle{font-size:11.5px;color:var(--ink-faint);margin-top:3px;font-weight:600}
  .wqd-actions{display:flex;gap:8px;margin-top:14px}

  /* ===== Manual mode: dispatch-style coverage ===== */
  .manual-head{display:flex;align-items:baseline;gap:12px;margin:4px 0 12px;flex-wrap:wrap}
  .manual-head .mh-total{font-size:16px;font-weight:800;color:var(--ink)}
  .manual-head .mh-ctx{font-size:12.5px;color:var(--ink-faint);font-weight:600}

  .pool-strip{display:flex;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;flex-wrap:wrap}
  .pool-strip .pc{flex:1;min-width:92px;padding:9px 14px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
  .pool-strip .pc:last-child{border-right:none}
  .pool-strip .pc .pcv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
  .pool-strip .pc .pcl{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);font-weight:700}
  .pool-strip .pc.warn .pcv{color:var(--soon-tx)}

  .rec-h,.more-h{display:flex;align-items:baseline;gap:9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--ink);margin:14px 0 8px}
  .rec-h .more-n,.more-h .more-n{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0}
  .ex-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-soft);margin:14px 0 8px;cursor:pointer}
  .ex-h:hover{color:var(--ink)}
  .ex-h .ex-caret{font-size:10px}
  .ex-h .more-n{font-size:11px;font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0}

  .rec-rows,.more-rows{display:flex;flex-direction:column}
  .acg{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-top:none;padding:11px 14px}
  .rec-rows .acg:first-child,.more-rows .acg:first-child,.more-rows .availrow:first-child{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .rec-rows .acg:last-child,.more-rows .acg:last-child,.more-rows .availrow:last-child{border-radius:0 0 var(--r) var(--r)}
  .acg .acg-rank{font-size:13px;font-weight:800;color:var(--ink-faint);width:20px;text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .acg-body{flex:1;min-width:0}
  .acg-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .acg-nm{font-weight:800;font-size:14px;color:var(--ink)}
  .acg-dist{font-size:12px;color:var(--ink-soft);font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
  .acg-meta{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .acg-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .acg-cta{display:flex;gap:6px;align-items:center;flex:0 0 auto}
  .acg.compact{padding:8px 14px}
  .acg.compact .acg-line{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acg.compact .acg-nm{font-size:13.5px;font-weight:750}
  .acg.compact .acg-dim{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:var(--r);white-space:nowrap}
  .tag.drv{background:var(--neutral-bg);color:var(--ink-soft)}
  .tag.hist{background:var(--good-bg);color:var(--good-tx)}
  .tag.ot{background:var(--soon-bg);color:var(--soon-tx)}
  .tag.warn{background:var(--soon-bg);color:var(--soon-tx)}
  .status{font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--r);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .status.st-acc{background:var(--good-solid);color:#fff}
  .status.st-dec{background:var(--crit-bg);color:var(--crit-tx)}
  .status.st-no{background:var(--soon-bg);color:var(--soon-tx)}
  .status.st-cb{background:var(--neutral-bg);color:var(--neutral-tx)}

  /* ===== Manual mode: shift-centric, minimal ===== */
  .cov-pool{margin:4px 0 14px}
  .cov-pool .cp-count{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
  .cov-pool .cp-ctx{font-size:12.5px;color:var(--ink-faint);font-weight:600;margin-top:2px}
  .cov-empty{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-size:13px;color:var(--ink-soft);font-weight:600}

  .rec-rows{display:flex;flex-direction:column;gap:8px}
  .bcard{display:flex;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 15px}
  .bcard .b-rank{font-size:15px;font-weight:800;color:var(--ink-faint);width:22px;text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .bcard .b-body{flex:1;min-width:0}
  .bcard .b-name{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
  .bcard .b-facts{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
  .bcard .b-name .b-flags{margin-left:8px;display:inline-flex;gap:6px;vertical-align:middle}
  .bcard .b-avail{font-size:12px;color:var(--ink-soft);margin-top:3px;font-weight:600;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .bcard .b-avail .cov-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .cov-dot.full{background:var(--good-solid)}
  .cov-dot.partial{background:var(--soon-solid)}
  .bcard .b-why{margin-top:7px;background:var(--good-bg);border-left:3px solid var(--good-solid);padding:6px 9px;border-radius:0 var(--r) var(--r) 0}
  .bcard .b-why .b-why-l{font-weight:800;color:var(--good-solid);text-transform:uppercase;font-size:9.5px;letter-spacing:.6px;margin-bottom:4px}
  .bcard .b-why .b-checks{display:flex;flex-wrap:wrap;gap:6px 12px}
  .bcard .b-why .bchk{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink)}
  .bcard .b-why .bchk svg{color:var(--good-solid);flex:0 0 auto}
  .covlabel.full{color:var(--good-solid);font-weight:700}
  .bcard .b-cta{display:flex;gap:6px;align-items:center;flex:0 0 auto}

  .disclosure{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;font-family:inherit;cursor:pointer;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-soft);padding:15px 2px 8px}
  .disclosure:hover{color:var(--ink)}
  .disclosure.quiet{color:var(--ink-faint)}
  .disclosure .d-caret{font-size:10px;width:10px}
  .disclosure .more-n{font-weight:600;color:var(--ink-faint);text-transform:none;letter-spacing:0;font-size:11.5px}

  .more-rows{display:flex;flex-direction:column}
  .ccard{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-top:none;padding:9px 14px}
  .more-rows .ccard:first-child{border-top:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
  .more-rows .ccard:last-child{border-radius:0 0 var(--r) var(--r)}
  .ccard .c-rank{font-size:12.5px;font-weight:800;color:var(--ink-faint);width:18px;text-align:center;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .ccard .c-main{flex:1;min-width:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .ccard .c-name{font-weight:750;font-size:13.5px;color:var(--ink)}
  .ccard .c-facts{font-size:11.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .ccard .c-cta{display:flex;gap:6px;align-items:center;flex:0 0 auto}

  /* ===== Today header (title + KPI band) ===== */
  .today-head{margin:0 0 16px}
  .today-head h1{font-size:21px;font-weight:800;letter-spacing:-.4px;color:var(--ink);line-height:1.1}
  .kpi-band{display:flex;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .kpi-band .kpi{flex:1;padding:11px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .kpi-band .kpi:last-child{border-right:none}
  .kpi-band .kpi .kv{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink);letter-spacing:-.5px}
  .kpi-band .kpi .kl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint)}
  .kpi-band .kpi.crit .kv{color:var(--crit-solid)}
  .kpi-band .kpi.soon .kv{color:var(--soon-solid)}
  /* dense critical dispatch row */
  .wqi.crit{align-items:center}
  .wqi.crit .wqt-row{display:flex;align-items:center;gap:9px}
  .wqi.crit .wqt-row .wqt{font-size:14.5px;font-weight:800;color:var(--ink)}
  .wqi.crit .wqfacts{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;font-variant-numeric:tabular-nums}
  .wqi .wqacts{display:flex;gap:7px;align-items:center;flex:0 0 auto;margin-left:auto}
  @media(max-width:860px){ .wqi.crit{flex-wrap:wrap} .wqi .wqacts{margin-left:31px;margin-top:8px} }

  /* ===== Find Coverage: shift-locked header ===== */
  .lock-head{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r);padding:13px 16px;margin-bottom:16px;flex-wrap:wrap}
  .lock-head .lk-main{flex:1;min-width:0}
  .lock-head .lk-eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint)}
  .lock-head .lk-client{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-top:2px;line-height:1.05}
  .lock-head .lk-meta{font-size:13px;color:var(--ink-soft);font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .lock-head .lk-needs{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:5px}
  .lock-head .lk-actions{display:flex;gap:7px;align-items:center;flex:0 0 auto}

  /* ===== Quick-log contact modal ===== */
  .ql-ctx{padding:0 18px 2px;font-size:11.5px;color:var(--ink-faint);font-weight:600;font-variant-numeric:tabular-nums}
  .ql-body{padding-top:10px}
  .ql-sub{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:11px}
  .ql-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ql-out{padding:17px 12px;border-radius:var(--r);border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;transition:background .08s,color .08s,border-color .08s}
  .ql-out.no{border-color:var(--soon-solid);color:var(--soon-solid)}
  .ql-out.no:hover{background:var(--soon-solid);color:#fff}
  .ql-out.dec{border-color:var(--crit-solid);color:var(--crit-solid)}
  .ql-out.dec:hover{background:var(--crit-solid);color:#fff}
  .ql-out.cb{border-color:var(--ink-soft);color:var(--ink-soft)}
  .ql-out.cb:hover{background:var(--ink-soft);color:#fff}
  .ql-out.acc{border-color:var(--good-solid);color:var(--good-solid)}
  .ql-out.acc:hover{background:var(--good-solid);color:#fff}
  .ql-chips{display:flex;flex-wrap:wrap;gap:8px}
  .ql-chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:background .08s,color .08s,border-color .08s}
  .ql-chip:hover{border-color:var(--brand);background:var(--brand);color:#fff}
  .ql-back{margin-top:14px;background:none;border:none;color:var(--ink-faint);font-size:12px;font-weight:700;cursor:pointer;padding:4px 0}
  .ql-back:hover{color:var(--ink)}
  .ql-custom{display:flex;gap:8px}
  .ql-custom input{flex:1;padding:10px 11px;border:1.5px solid var(--line);border-radius:var(--r);font-size:13px}
  .ql-accepted{text-align:center;padding:6px 0 2px}
  .ql-acc-msg{font-size:15px;font-weight:800;color:var(--good-solid);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn.lg{padding:13px 20px;font-size:14px;width:100%;justify-content:center;margin-bottom:8px}
  /* already-contacted section */
  .contacted-h{margin-top:18px}
  .contacted-rows{display:flex;flex-direction:column;gap:6px}
  .ccard.contacted .c-name{color:var(--ink-soft)}

  /* ===== Recurring Coverage Search ===== */
  .cov-tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;width:fit-content;background:#fff}
  .cov-tabs button{display:flex;align-items:center;gap:7px;padding:9px 16px;border:none;background:#fff;font-size:12.5px;font-weight:800;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line)}
  .cov-tabs button:last-child{border-right:none}
  .cov-tabs button.on{background:var(--brand);color:#fff}
  .cov-tabs button svg{opacity:.85}
  .cov-lbl{font-size:10px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px;align-self:center;margin-right:3px}
  .cov-days{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
  .day-chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:var(--ink-soft);cursor:pointer;transition:background .08s,color .08s,border-color .08s}
  .day-chip:hover{border-color:var(--brand)}
  .day-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .rec-end{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .rec-end input[type=date]{width:100%}
  .rec-end input[type=date]:disabled{opacity:.45}
  .rec-ongoing{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;cursor:pointer}
  .rec-ongoing input{cursor:pointer}
  .rec-card .rec-cover{margin-top:3px}
  .cov-all{font-size:13px;font-weight:800;color:var(--good-solid)}
  .cov-some{font-size:13px;font-weight:700;color:var(--ink)}
  .cov-some .cov-frac{font-size:11px;font-weight:800;color:var(--ink-faint);margin-left:4px}
  .rec-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .rday{font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;letter-spacing:.3px}
  .rday.on{background:var(--good-bg);color:var(--good-solid)}
  .rday.off{background:var(--neutral-bg);color:var(--ink-faint);opacity:.6;text-decoration:line-through}
  .rec-card .b-facts{margin-top:6px}

  /* ===== Today urgency emphasis ===== */
  .wqi .wq-starts{font-weight:800;color:var(--ink)}
  .wqi.crit.urgent{background:linear-gradient(90deg,var(--crit-bg) 0%,#fff 55%)}
  .wqi.crit.urgent .wqbar{width:5px}
  .wqi.crit.urgent .wq-starts{color:var(--crit-solid)}
  .chip.urgent-chip{background:var(--crit-solid);color:#fff}

  /* ===== From-open-shift dropdown (optional) ===== */
  .cov-fromshift{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
  .cov-fromshift label{font-size:10px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px}
  .cov-fromshift label .opt{font-weight:600;text-transform:none;letter-spacing:0;opacity:.7;margin-left:3px}
  .cov-fromshift select{padding:7px 11px;border:1.5px solid var(--line);border-radius:var(--r);font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;min-width:280px}

  /* ===== Attendance / EVV alert rows ===== */
  .wqi.att .evv-tag{font-size:8.5px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:3px;background:var(--navy-900);color:#fff;text-transform:uppercase}
  .wqi.att.urgent{background:linear-gradient(90deg,var(--crit-bg) 0%,#fff 55%)}
  .wqi.att.urgent .wqbar{width:5px}
  .wqi.att .wq-starts{font-weight:700;color:var(--ink-soft)}
  .wqi.att.urgent .wq-starts{color:var(--crit-solid);font-weight:800}

  /* ===== Find Coverage filter groups ===== */
  .cov-filters{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
  .cov-fgroup{display:flex;flex-direction:column;gap:6px}
  .cov-flabel{font-size:10px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.6px}
  .cov-fchips{display:flex;gap:6px;flex-wrap:wrap}
  .cov-fchips .sk{font-size:11.5px;font-weight:650;padding:5px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;color:var(--ink-soft);cursor:pointer}
  .cov-fchips .sk:hover{border-color:var(--brand)}
  .cov-fchips .sk.on{background:var(--brand);border-color:var(--brand);color:#fff}

  /* ===== EVV alert modal + coverage progress ===== */
  .ql-phone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px 4px}
  .ql-num{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .evv-grid{grid-template-columns:1fr 1fr 1fr}
  .ql-out.ontheway{border-color:var(--good-solid);color:var(--good-solid)}
  .ql-out.ontheway:hover{background:var(--good-solid);color:#fff}
  .ql-out.tech{border-color:var(--soon-solid);color:var(--soon-solid)}
  .ql-out.tech:hover{background:var(--soon-solid);color:#fff}
  .ql-out.cannot{border-color:var(--crit-solid);color:var(--crit-solid)}
  .ql-out.cannot:hover{background:var(--crit-solid);color:#fff}
  .wqprogress{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .wqprogress b{color:var(--ink-soft);font-weight:800}
  .wqprogress .prog-status{font-weight:800;color:var(--soon-tx);background:var(--soon-bg);padding:1px 7px;border-radius:3px}

  /* ===== Next best action + no-show severity + multi-action ===== */
  .wqnext{font-size:12px;font-weight:700;color:var(--brand);margin-top:5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:var(--watch-bg);border-radius:var(--r);border:1px solid transparent}
  .wqnext:hover{border-color:var(--brand)}
  .wqnext b{font-weight:800}
  .wqacts-multi{display:flex;flex-direction:column;gap:5px;align-items:stretch}
  .wqacts-multi .btn{white-space:nowrap;justify-content:center}
  .sevdot{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:10px;text-transform:uppercase;color:#fff}
  .sevdot.yellow{background:var(--soon-solid)}
  .sevdot.orange{background:#D2691E}
  .sevdot.red{background:var(--crit-solid)}

  /* ===== Escalation workflow + ownership ===== */
  .esc-panel{margin-top:14px;border:1px solid var(--crit-solid);border-radius:var(--r);overflow:hidden;background:#fff}
  .esc-title{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--crit-solid);text-transform:uppercase;letter-spacing:.4px;padding:9px 14px;background:var(--crit-bg);border-bottom:1px solid var(--crit-solid)}
  .esc-owner{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:none;letter-spacing:0}
  .esc-rung{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .esc-rung:last-child{border-bottom:none}
  .esc-rung.done{background:var(--good-bg)}
  .esc-step{flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .esc-rung.done .esc-step{background:var(--good-solid)}
  .esc-body{flex:1;display:flex;flex-direction:column;gap:1px}
  .esc-body b{font-size:13px;font-weight:750;color:var(--ink)}
  .esc-body span{font-size:11.5px;color:var(--ink-soft)}
  .esc-act{flex:none}
  .esc-badge{font-size:11px;font-weight:800;color:var(--good-solid);background:var(--good-bg);padding:4px 10px;border-radius:var(--r)}
  .esc-otlist{padding:4px 14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--soon-bg)}
  .ot-card{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--soon-solid);border-radius:var(--r);padding:8px 12px}
  .ot-main{display:flex;flex-direction:column;gap:2px}
  .ot-flag{font-size:9.5px;font-weight:800;color:var(--soon-tx);background:var(--soon-bg);padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;margin-left:5px}
  .owner-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--ink-soft);background:var(--neutral-bg);padding:2px 8px;border-radius:10px}
  .chip.esc{background:var(--crit-solid);color:#fff;display:inline-flex;align-items:center;gap:4px}
  .wqi.crit.escalated{background:linear-gradient(90deg,var(--crit-bg) 0%,#fff 60%)}

  /* ===== Coverage decision engine panel ===== */
  .cs-panel{margin:14px 0;border:1px solid var(--line-strong);border-radius:var(--r);background:#fff;overflow:hidden}
  .cs-head{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);border-bottom:1px solid var(--line);background:var(--panel)}
  .cs-status{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
  .st-open{background:var(--crit-bg);color:var(--crit-solid)}
  .st-inprogress{background:var(--soon-bg);color:var(--soon-tx)}
  .st-covered{background:var(--good-bg);color:var(--good-solid)}
  .st-escalated{background:var(--crit-solid);color:#fff}
  .cs-starts{margin-left:auto;font-size:11px;font-weight:700;color:var(--crit-solid);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
  .cs-grid{display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1px solid var(--line)}
  .cs-cell{padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
  .cs-cell:last-child{border-right:none}
  .cs-cell.crit{background:var(--crit-bg)}
  .cs-cell.good{background:var(--good-bg)}
  .cs-v{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .cs-cell.crit .cs-v{color:var(--crit-solid)}
  .cs-cell.good .cs-v{color:var(--good-solid)}
  .cs-l{font-size:9.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-top:4px}

  /* ===== Priority board: risk badge + handled ===== */

  /* ===== Dispatch board / call queue ===== */

  .q-empty{font-size:12.5px;color:var(--ink-soft);padding:10px 12px;background:var(--neutral-bg);border-radius:var(--r)}

  .qrow.skip{opacity:.5}
  .qrow.part{border-left:3px solid var(--soon-solid)}
  .q-lead{flex:none;width:22px;text-align:center;color:var(--brand);font-weight:800;padding-top:1px}
  .q-main{flex:1;min-width:0}
  .q-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .q-name{font-size:14px;font-weight:750;color:var(--ink)}
  .q-name.sm{font-size:13px}
  .q-active-tag{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:var(--brand);color:#fff;padding:2px 7px;border-radius:10px}
  .q-due{font-size:9px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:var(--crit-solid);color:#fff;padding:2px 7px;border-radius:10px}
  .q-avail{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .q-avail.full{background:var(--good-bg);color:var(--good-solid)}
  .q-avail.part{background:var(--soon-bg);color:var(--soon-tx)}
  .q-gap{font-size:11px;font-weight:700;color:var(--crit-solid)}
  .q-facts{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
  .q-ot{color:var(--soon-tx);font-weight:700}
  .q-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .q-b{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:var(--r);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .q-b:hover{border-color:var(--brand);color:var(--brand)}
  .q-b.call{background:var(--brand);border-color:var(--brand);color:#fff}
  .q-b.acc{border-color:var(--good-solid);color:var(--good-solid)}

  .q-expand{margin-top:8px;padding:8px 10px;background:var(--neutral-bg);border-radius:var(--r);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .q-exl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint)}
  .q-rchip{font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:var(--r);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);cursor:pointer}
  .q-rchip:hover{border-color:var(--brand);color:var(--brand);background:#fff}
  .q-skipline{font-size:11.5px;color:var(--ink-faint);margin-top:7px}
  .q-link{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:11.5px;text-decoration:underline}
  .q-cgroup{margin-bottom:9px}
  .q-cglabel{font-size:11px;font-weight:800;color:var(--ink-soft);margin-bottom:5px;display:flex;gap:6px;align-items:center}
  .crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 11px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px;background:var(--neutral-bg)}
  .crow.accepted{background:var(--good-bg);border-color:var(--good-solid)}

  .c-detail{font-size:11.5px;color:var(--ink-soft)}
  .c-cta{display:flex;gap:5px;flex:none}
  .q-mini{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--r);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:3px}

  .covered-card{display:flex;align-items:center;gap:14px;background:var(--good-bg);border:1px solid var(--good-solid);border-radius:var(--r);padding:16px 18px;margin-top:14px;color:var(--good-solid)}
  .cv-t{font-size:15px;font-weight:800;color:var(--ink)}
  .cv-s{font-size:12px;color:var(--ink-soft);margin-top:2px}

  /* ===== Requires Action Now — calm work queue ===== */
  .aq-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
  .aq-head h1{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
  .aq-count{font-size:12.5px;color:var(--ink-faint);font-weight:600}
  .aq{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
  .aq.crit{border-left-color:var(--crit-solid)}
  .aq.soon{border-left-color:var(--soon-solid)}
  .aq-n{flex:none;width:18px;text-align:center;font-weight:800;color:var(--ink-faint);font-size:13px;font-variant-numeric:tabular-nums}
  .aq-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .aq-name{font-size:14.5px;font-weight:750;color:var(--ink)}
  .aq-meta{font-size:12.5px;color:var(--ink-soft)}
  .aq-list.muted{opacity:.7}
  .aq-later{margin-top:16px;background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 2px;display:block}
  .aq-later:hover{color:var(--brand)}
  .aq-handled{margin-top:16px;font-size:12px;color:var(--good-solid);font-weight:600;display:flex;align-items:center;gap:5px}

  /* ===== Staff New Client ===== */
  .scard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:9px}
  .scard.role-primary{border-color:var(--good-solid);border-width:1.5px}
  .scard.role-backup{border-color:var(--brand)}
  .sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .sc-id{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .sc-name{font-size:15px;font-weight:750;color:var(--ink)}
  .sc-role{font-size:9.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:10px;color:#fff}
  .sc-role.primary{background:var(--good-solid)}
  .sc-role.backup{background:var(--brand)}
  .sc-match{text-align:right;flex:none}
  .sc-pct{font-size:20px;font-weight:800;color:var(--brand);line-height:1;font-variant-numeric:tabular-nums}
  .sc-pl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin-top:2px}
  .sc-facts{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.5}
  .sc-exp{font-size:11.5px;color:var(--ink-soft);margin-top:5px}
  .sc-conf{font-size:11.5px;color:var(--crit-solid);font-weight:650;margin-top:5px;display:flex;align-items:center;gap:5px}
  .sc-noconf{font-size:11.5px;color:var(--good-solid);margin-top:5px;display:flex;align-items:center;gap:5px}
  .sc-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .sp-panel{background:var(--navy-900,#1E2A33);color:#fff;border-radius:var(--r);padding:16px 18px;margin:14px 0}
  .sp-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px;opacity:.85;margin-bottom:12px}
  .sp-slots{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .sp-slot{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:var(--r);padding:11px 13px}
  .sp-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-bottom:4px}
  .sp-cg{font-size:15px;font-weight:750}
  .sp-empty{font-size:13px;opacity:.45}
  .sp-cands{margin-top:12px}
  .sp-cl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.65;margin-bottom:6px}
  .sp-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:12px;padding:3px 6px 3px 11px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
  .sp-chip button{background:none;border:none;color:#fff;opacity:.6;cursor:pointer;font-size:14px;padding:0 2px}
  .sp-ready{margin-top:13px;font-size:12px;color:#7FE3A8;display:flex;align-items:center;gap:6px;font-weight:600}
  .sp-note{margin-top:13px;font-size:12px;opacity:.6}

  /* ===== Coverage Command Center ===== */
  .cov-modes{display:flex;gap:8px;margin-bottom:16px}
  .cov-modes button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border:1px solid var(--line-strong);background:#fff;border-radius:var(--r);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer}
  .cov-modes button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .spk{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer}
  .spk:hover{border-color:var(--brand)}
  .spk-bar{flex:none;width:4px;height:34px;border-radius:2px;background:var(--line-strong)}
  .spk-bar.crit{background:var(--crit-solid)} .spk-bar.soon{background:var(--soon-solid)}
  .spk-main{flex:1}
  .spk-cl{font-size:14.5px;font-weight:750;color:var(--ink)}
  .spk-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  /* compact shift summary */
  .cov-summary{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
  .cv-sum-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cv-client{font-size:16px;font-weight:800;color:var(--ink)}
  .cv-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .cv-line2{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
  .cv-line2 b{color:var(--ink);font-weight:750}
  .cv-toggle{margin-left:auto;background:none;border:none;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:underline}
  .cv-details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .cv-dgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .cv-dl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);min-width:84px}
  .cv-tag{font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:10px;background:var(--neutral-bg);color:var(--ink-soft)}
  .cv-tag.warn{background:var(--soon-bg);color:var(--soon-tx)}
  .cv-none{font-size:11.5px;color:var(--ink-faint)}
  /* status bar */
  .cov-status{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:14px}
  .cov-status-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .cov-starts{margin-left:auto;font-size:12px;color:var(--ink-soft);font-weight:600}
  .cvs-row{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .cvs{text-align:center;padding:9px 4px;background:var(--neutral-bg);border-radius:var(--r)}
  .cvs-v{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
  .cvs-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin-top:4px}
  .cvs.crit .cvs-v{color:var(--crit-solid)} .cvs.soon .cvs-v{color:var(--soon-tx)} .cvs.good .cvs-v{color:var(--good-solid)}
  /* NEXT BEST ACTION hero */
  .nba-hero{background:var(--brand);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
  .nba-hero.crit{background:var(--crit-solid)}
  .nba-hero.done{background:var(--good-solid)}
  .nba-top{display:flex;align-items:center;gap:9px}
  .nba-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;opacity:.8}
  .nba-due{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;background:#fff;color:var(--brand);padding:2px 8px;border-radius:10px}
  .nba-name{font-size:26px;font-weight:800;letter-spacing:-.3px;margin:5px 0 11px}
  .nba-name.sm{font-size:18px}
  .nba-why{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
  .nba-chip{font-size:12px;font-weight:650;background:rgba(255,255,255,.16);padding:4px 11px;border-radius:12px}
  .nba-acts{display:flex;gap:9px;flex-wrap:wrap}
  .btn.nba-btn{padding:11px 20px;font-size:14px}
  .nba-hero .btn.pri{background:#fff;color:var(--brand);border-color:#fff}
  .nba-hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
  .nba-hero .oc-bar,.nba-hero .q-expand{background:rgba(255,255,255,.12)}
  .nba-hero .oc-l{color:#fff;opacity:.85}
  .nba-hero .q-b{background:#fff}
  /* outcome bar */
  .oc-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px;background:var(--neutral-bg);border-radius:var(--r)}
  .oc-l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint)}
  /* candidate list */
  .cc-list{margin-top:4px}
  .cc-list-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);padding:0 2px 8px}
  .cc-list-n{font-weight:650;color:var(--ink-soft);text-transform:none;letter-spacing:0;font-size:11.5px}
  .ccand{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:7px}
  .ccand.calling{border-color:var(--brand);border-width:2px}
  .ccand.part{border-left:3px solid var(--soon-solid)}
  .ccand.skip{opacity:.55}
  .cc-score{flex:none;width:46px;text-align:center;background:var(--brand);color:#fff;border-radius:var(--r);padding:6px 2px}
  .cc-score.none{background:var(--neutral-bg);color:var(--ink-faint);font-weight:800;display:flex;align-items:center;justify-content:center}
  .cc-sv{display:block;font-size:17px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .cc-sl{display:block;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;opacity:.85;margin-top:2px}
  .cc-main{flex:1;min-width:0}
  .cc-name{font-size:14px;font-weight:750;color:var(--ink)}
  .cc-part{font-size:10px;font-weight:700;color:var(--soon-tx);background:var(--soon-bg);padding:1px 7px;border-radius:9px;text-transform:uppercase;letter-spacing:.3px}
  .cc-facts{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
  .cc-acts{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
  .cc-skipped{margin-top:8px}
  .cc-sk-toggle{background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:12px;cursor:pointer;padding:5px 2px}
  /* attempt history */
  .ah-panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px}
  .ah-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:10px}
  .ah-n{background:var(--neutral-bg);color:var(--ink-soft);border-radius:9px;padding:1px 8px;font-size:11px}
  .ah-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .ah-row:first-of-type{border-top:none}
  .ah-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
  .ah-dot.declined{background:var(--crit-solid)} .ah-dot.no-answer{background:var(--soon-solid)} .ah-dot.callback{background:var(--brand)} .ah-dot.accepted{background:var(--good-solid)}
  .ah-name{font-weight:750;color:var(--ink)}
  .ah-out{color:var(--ink-soft)}
  .ah-out.declined{color:var(--crit-solid)} .ah-out.callback{color:var(--brand);font-weight:650}
  .ah-meta{margin-left:auto;font-size:11px;color:var(--ink-faint)}
  .ah-rq{background:none;border:1px solid var(--line-strong);border-radius:var(--r);padding:3px 9px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer}

  /* ===== candidate tiers + score explanation + multi-day search ===== */
  .cc-tier{margin-bottom:14px}
  .cc-summary{font-size:13px;font-weight:700;color:var(--ink);background:var(--good-bg);border:1px solid var(--good-solid);border-radius:var(--r);padding:9px 13px;margin-bottom:14px}
  .cc-avail{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;margin-left:2px}
  .cc-avail.full{background:var(--good-bg);color:var(--good-solid)}
  .cc-avail.part{background:var(--soon-bg);color:var(--soon-tx)}
  .sb{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:9px;background:var(--neutral-bg);color:var(--ink-faint)}
  .sb.yes{background:var(--good-bg);color:var(--good-solid)}
  .cov-dayblock{margin-top:12px}
  .cov-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin-bottom:7px}
  .cov-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .cov-preset{font-size:12px;font-weight:700;padding:6px 13px;border-radius:var(--r);border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);cursor:pointer}
  .cov-preset.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .cov-daychips{display:flex;flex-wrap:wrap;gap:6px}
  .cov-adv-toggle{margin-top:12px;background:none;border:none;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 2px;display:block}
  .adv-n{color:var(--ink-faint);font-weight:600}
  .cov-adv-body{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .cov-fhint{font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink-faint);font-size:10.5px;margin-left:6px}

  .shift-switch-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .ssw-l{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint)}
  .shift-switch{font-family:inherit;font-size:12.5px;font-weight:650;color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px 9px;background:#fff;cursor:pointer;max-width:240px}

  /* ===== Search availability (primary Find Coverage view) ===== */
  .srch-head{margin-bottom:16px}
  .srch-eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--brand)}
  .srch-title{font-size:21px;font-weight:800;color:var(--ink);margin:3px 0 5px;letter-spacing:-.2px}
  .srch-sub{font-size:12.5px;color:var(--ink-soft)}
  .srch-link{background:none;border:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}

  /* ===== prominent availability answer ===== */

  .aa-empty{background:var(--neutral-bg);border:1px dashed var(--line-strong);border-radius:var(--r);padding:18px 20px;color:var(--ink-soft);font-size:13.5px;margin:16px 0 12px}

  /* ===== availability bar (answer cards at top) ===== */
  .avail-bar{margin:0 0 16px}
  .ab-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:9px}

  .avc-row.five{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .avail-bar .avc{padding:12px 8px;min-height:92px;justify-content:center}

  .avail-bar .avc-l{font-size:11.5px;font-weight:700;color:var(--ink);margin-top:0}
  .avc-sub{font-size:10px;font-weight:650;color:var(--ink-faint);margin-top:1px}

  /* ===== specific time search section ===== */
  .spec-search{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:6px 0 14px}

  .cov-row3{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:13px;margin-top:12px}

  .cov-row3 .cov-field input,.cov-row3 .cov-field select{width:100%;font-family:inherit;font-size:13px;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;background:#fff;color:var(--ink)}

  .avail-bar .avc-l{font-size:11.5px;font-weight:700;color:var(--ink);margin-top:0}

  /* ===== rank badge + why-ranked expander ===== */
  .cc-rank{flex:none;width:52px;text-align:center;background:var(--neutral-bg);color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 2px}

  /* contact history travels with the shift (Open Shifts) */

  /* ===== sidebar brand (text only) ===== */

  /* ===== dashboard header ===== */
  .dash-head{margin-bottom:16px}
  .dash-greet{font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-.4px}

  .dash-attn .da-dot{width:8px;height:8px;border-radius:50%;background:var(--crit-solid);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  /* ===== snapshot ===== */
  .snapshot{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
  .snap-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin-bottom:11px}

  @media(max-width:1100px){.snap-grid{grid-template-columns:repeat(3,1fr)}}
  /* ===== today sections + cards ===== */

  .t-sec-h.crit{color:var(--crit-solid)} .t-sec-h.high{color:var(--soon-solid)} .t-sec-h.good{color:var(--good-solid)} .t-sec-h.watch{color:var(--brand)}

  .t-sec-dot.crit{background:var(--crit-solid)} .t-sec-dot.high{background:var(--soon-solid)} .t-sec-dot.good{background:var(--good-solid)} .t-sec-dot.watch{background:var(--brand)}

  .tc-body{flex:1;padding:13px 16px;min-width:0}

  .tc-pill .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .tc-type{font-size:14.5px;font-weight:800;color:var(--ink)}
