  .tc-risk.soft{color:var(--brand);background:var(--panel-head)}
  .tc-lastcall{margin-left:auto;font-size:11.5px;color:var(--ink-faint);font-weight:600}
  .tc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px 22px;margin-bottom:12px}
  .tc-f{display:flex;flex-direction:column;gap:2px;min-width:0}
  .tc-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}
  .tc-v{font-size:14px;font-weight:700;color:var(--ink)}
  .tc-v.crit{color:var(--crit-solid)} .tc-v.soon{color:var(--soon-solid)}
  .tc-sub{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
  .tc-acts{display:flex;gap:8px;flex-wrap:wrap}
  /* call outcome bar */
  .tc-outcomes{margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
  .tc-o-l{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:9px}
  .tc-o-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  @media(max-width:900px){.tc-o-grid{grid-template-columns:repeat(2,1fr)}}
  .tc-o-b{padding:9px 10px;border:1px solid var(--line-strong);background:#fff;border-radius:var(--r);font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center}
  .tc-o-b:hover{border-color:var(--brand);color:var(--brand)}
  .tc-o-b.confirmed:hover,.tc-o-b.onway:hover,.tc-o-b.resolved:hover{border-color:var(--good-solid);color:var(--good-solid)}
  .tc-o-b.calloff:hover,.tc-o-b.no-answer:hover{border-color:var(--crit-solid);color:var(--crit-solid)}
  .tc-o-b.late:hover{border-color:var(--soon-solid);color:var(--soon-solid)}

  /* ===== caregiver list (operational) ===== */
  .cg-intro{font-size:12.5px;color:var(--ink-soft);background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;margin-bottom:13px}
  .cglist{display:flex;flex-direction:column;gap:7px}
  .cglist-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;cursor:pointer}

  .cglr-main{flex:1;min-width:0}
  .cglr-name{font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px}
  .cglr-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .cglr-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint)}
  .cglr-sep{color:var(--line-strong);margin:0 4px}
  .cglr-notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cglr-note{font-size:11.5px;color:var(--ink-soft);background:var(--neutral-bg);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .cglr-go{flex:none;font-size:12px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:3px}
  /* ===== workspace ===== */
  .ws-back{background:none;border:none;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 0;margin-bottom:12px}

  .ws-name{font-size:23px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  .ws-meta{font-size:13px;color:var(--ink-soft);margin-top:3px;font-weight:600}
  .ws-status{font-size:12px}
  .ws-axis{font-size:12px;color:var(--ink-soft);background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:16px;display:flex;align-items:center;gap:7px}
  .ws-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:14px}
  .ws-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);margin-bottom:12px}
  .ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  @media(max-width:1000px){.ws-grid{grid-template-columns:1fr}}
  .ws-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:7px}

  .ws-list.restr li::before{background:var(--crit-solid)}
  .ws-contact{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px}
  .ws-none{font-size:13px;color:var(--ink-faint)}
  .ws-big{font-size:16px;font-weight:800;color:var(--ink)}
  .ws-sub{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

  .ci-v{font-size:13.5px;font-weight:800;color:var(--ink)}

  .ws-yn-grid{display:flex;flex-direction:column;gap:0}
  .ws-yn-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);font-weight:600}

  .ws-flag.crit{background:#FBEAE8;color:var(--crit-solid)} .ws-flag.soon{background:#FAF1DD;color:var(--soon-solid)} .ws-flag.good{background:#E9F5EE;color:var(--good-solid)}
  /* ===== calendar ===== */
  .cal-bar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
  .cal-month{font-size:16px;font-weight:800;color:var(--ink);min-width:170px;text-align:center}
  .cal-nav{background:var(--neutral-bg);border:1px solid var(--line-strong);border-radius:var(--r);width:32px;height:30px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
  .cal-nav:hover{border-color:var(--brand);color:var(--brand)}

  .cal-dow{text-align:center;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);padding-bottom:3px}
  .cal-cell{min-height:74px;border:1px solid var(--line);border-radius:4px;padding:5px;display:flex;flex-direction:column;gap:3px;background:#fff}

  .cal-dot.unavail,.cal-ev.unavail{background:#9AA7B2}

  /* workflow status badge */
  .tc-stat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:20px}

  .tc-stat .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}
  /* today filter tabs */
  .tfilter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .tf-chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-strong);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer}

  .tf-n{background:rgba(0,0,0,.08);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:800}

  /* activity log */
  .actlog{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
  .act-row{display:grid;grid-template-columns:78px 16px 1fr;align-items:start;gap:0;padding:0}
  .act-time{font-size:12px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding:11px 0;text-align:right;padding-right:14px}
  .act-line{display:flex;justify-content:center;position:relative}
  .act-line::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
  .act-dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:15px;position:relative;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1px var(--brand)}

  .act-row:last-child .act-line::before{bottom:calc(100% - 15px)}
  .act-text{font-size:13.5px;color:var(--ink);padding:11px 0 11px 12px;line-height:1.4;border-top:1px solid var(--line)}
  .act-row:first-child .act-text{border-top:none}
  .t-empty{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-soft);font-size:13.5px}

  /* caregiver directory list */
  .cg-filterbar{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin-bottom:14px}
  .cg-fgroup{display:flex;gap:9px;flex-wrap:wrap}
  .cglr-sum{font-size:13px;color:var(--ink-soft);margin-top:5px}
  /* preferences section */
  .pref-row{margin-top:11px;font-size:13px;color:var(--ink)}
  .pref-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);display:block;margin-bottom:5px}
  .pref-ems{display:flex;flex-wrap:wrap;gap:7px}
  .pref-em{font-size:12px;font-weight:600;border-radius:20px;padding:4px 11px;background:var(--neutral-bg);border:1px solid var(--line);color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px}
  .pref-em.on{background:#E9F5EE;border-color:#BFE3CD;color:var(--good-solid);font-weight:700}
  /* restrictions sub-labels */
  .rs-sub{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin:10px 0 5px}
  .rs-sub:first-child{margin-top:0}
  /* personality profile */
  .pp-summary{font-size:14px;font-weight:700;color:var(--ink);line-height:1.45;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
  .pp-row{display:flex;gap:12px;padding:5px 0;font-size:13px}
  .pp-l{flex:0 0 110px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);padding-top:2px}
  .pp-v{color:var(--ink);font-weight:600}
  /* resume generator */
  .resume-doc{background:#fff;border:1px solid var(--line-strong);border-radius:var(--r);padding:20px 22px;margin-bottom:10px}
  .rz-h{border-bottom:2px solid var(--brand);padding-bottom:10px;margin-bottom:14px}
  .rz-name{font-size:19px;font-weight:800;color:var(--ink)}
  .rz-role{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:600}
  .rz-sec{margin-bottom:12px}
  .rz-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);margin-bottom:5px}
  .rz-sec p{font-size:13.5px;color:var(--ink);line-height:1.55;margin:0}
  .rz-sec>div{font-size:13.5px;color:var(--ink)}
  .rz-tags{display:flex;flex-wrap:wrap;gap:6px}
  .rz-tags span{font-size:12px;background:var(--panel-head);border:1px solid var(--line);border-radius:3px;padding:3px 9px;color:var(--ink)}
  .rz-note{font-size:11.5px;color:var(--ink-faint);font-style:italic;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
  .resume-acts{display:flex;gap:8px}

  /* topbar date + attention */
  .tb-date{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
  .tb-title h1{font-size:13px;font-weight:600;color:var(--ink-soft);margin:2px 0 0;letter-spacing:0}
  .tb-attn{display:inline-flex}
  .tb-attn-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:20px}
  .tb-attn-pill.crit{background:#FBEAE8;color:var(--crit-solid)} .tb-attn-pill.good{background:#E9F5EE;color:var(--good-solid)}
  .tb-attn-pill .cdot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* directory rows — name + status only */
  .cglist-row.dir{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer}
  .cglist-row.dir .cglr-name{font-size:15.5px;font-weight:700;color:var(--brand)}

  .cglr-r{display:inline-flex;align-items:center;gap:10px;color:var(--ink-faint)}
  .fchip-n{margin-left:8px;background:rgba(0,0,0,.08);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:800}
  .cg-fgroup .fchip-n{margin-left:10px;font-size:14px;padding:2px 11px;min-width:26px;text-align:center}
  .fchip.on .fchip-n{background:rgba(255,255,255,.25)}
  .chip.neut{background:var(--neutral-bg);color:var(--ink-soft);border:1px solid var(--line)}
  /* schedule summary strip in availability section */
  .sched-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .ss-i{display:flex;flex-direction:column;gap:3px}
  .ss-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}
  .ss-v{font-size:14px;font-weight:800;color:var(--ink)}
  .ss-v.good{color:var(--good-solid)} .ss-v.soon{color:var(--soon-solid)}
  /* workspace head actions */
  .ws-head-r{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .ws-head-acts{display:flex;gap:7px}
  .pref-row{margin-top:11px;font-size:13px;color:var(--ink)}
  /* print: workspace only */
  @media print{
    .sidebar,.topbar,.ws-back,.ws-head-acts,.ws-axis,.cal-nav,.resume-acts{display:none!important}
    .app,.main,.content{display:block!important;margin:0!important;padding:0!important}
    .ws-grid{grid-template-columns:1fr 1fr!important}
    body{background:#fff!important}

  .tc-detail{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  /* last updated line */
  .ws-updated{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;padding:8px 14px;background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r)}
  .ws-updated b{color:var(--ink);font-weight:700}
  /* edit form */
  .ws-grid.edit .ws-card{min-height:auto}
  .el{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin:12px 0 6px}

  .ein{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 11px;box-sizing:border-box}
  .ein:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(44,95,124,.12)}

  .eb-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
  .edit-bar{position:sticky;bottom:0;display:flex;gap:10px;justify-content:flex-end;background:var(--bg);border-top:1px solid var(--line);padding:14px 0;margin-top:8px}

  /* availability verification */
  .av-panel.due{border-color:#E7B7B1;background:#FDF6F5}
  .av-status{margin-bottom:14px}
  .av-flag{display:inline-flex;align-items:center;gap:7px;background:#FBEAE8;color:var(--crit-solid);font-weight:800;font-size:13px;padding:7px 14px;border-radius:20px}
  .av-ok{display:inline-flex;align-items:center;gap:7px;color:var(--good-solid);font-weight:700;font-size:13px}
  .av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
  .av-f{display:flex;flex-direction:column;gap:3px}
  .av-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}
  .av-v{font-size:14px;font-weight:700;color:var(--ink)}
  .av-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .av-confirm-l{font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-right:2px}
  @media(max-width:900px){.av-grid{grid-template-columns:repeat(2,1fr)}}

  /* alert source provenance */
  .tc-source{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-faint)}
  .tc-source svg{opacity:.6;flex-shrink:0}
  .tc-src-l{font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:9.5px;background:var(--neutral-bg);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--ink-soft)}

  .ws-name-solo{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin:2px 0 8px}
  .ws-headrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:2px 0 4px}
  .ws-headrow .ws-name{font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin:0}
  .ws-headbtns{display:flex;flex-wrap:wrap;gap:8px}
  .ws-updated+.ws-card{margin-top:10px}
  .rz-modal-note{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
  .rz-preview{border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;background:#fff;max-height:46vh;overflow:auto}

  /* mark call-off entry points + modal */

  .open-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .co-f{display:flex;flex-direction:column;gap:2px}
  .co-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}

  .cal-cell{position:relative;cursor:pointer;min-height:58px;padding:7px 8px 8px 11px;border-left:3px solid transparent;transition:filter .12s}
  .cal-cell:not(.empty):hover{filter:brightness(.97)}
  .cal-cell .cal-d{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px;z-index:1}
  /* status tints + left bar */
  .st-avail{background:#EAF6EF;border-left-color:var(--good-solid)}
  .st-unavail{background:#F6F7F8;border-left-color:#C7CFD6}
  .st-unavail .cal-d{color:var(--ink-faint)}
  .st-devoted{background:#E8F0F6;border-left-color:var(--navy-900)}
  .st-agency{background:#F1ECFB;border-left-color:#8B5CF6}
  .st-vacation{background:#E5F5F4;border-left-color:#0E9B8E}
  .st-sick{background:#FBEAE8;border-left-color:var(--crit-solid)}
  /* time-of-day bar */
  .cal-seg{display:flex;gap:2px;margin-top:9px;height:8px}
  .cal-seg .seg{flex:1;background:#D4E4DA;border-radius:1px}
  .cal-seg .seg.on{background:var(--good-solid)}
  .cal-seg.sm{display:inline-flex;width:42px;height:7px;vertical-align:middle;margin-right:3px}
  .cal-seg.sm .seg{background:#D6DEE4}
  .cal-seg.sm .seg.on{background:var(--good-solid)}
  /* status tag for non-available days */
  .cal-tag{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px 7px;border-radius:3px}
  .cal-tag.unavail{color:var(--ink-faint);background:#ECEFF1}
  .cal-tag.devoted{color:var(--navy-900);background:#D5E3EF}
  .cal-tag.agency{color:#6D28D9;background:#E7DEFA}
  .cal-tag.vacation{color:#0B7A70;background:#CDEEEB}
  .cal-tag.sick{color:var(--crit-solid);background:#F7D9D5}
  .cal-note{position:absolute;top:7px;right:7px;color:var(--soon-solid);opacity:.85}
  /* status legend swatches */
  .cal-sw{width:11px;height:11px;border-radius:2px;display:inline-block;border-left:3px solid}
  .cal-sw.avail{background:#EAF6EF;border-left-color:var(--good-solid)}
  .cal-sw.unavail{background:#F6F7F8;border-left-color:#C7CFD6}
  .cal-sw.devoted{background:#E8F0F6;border-left-color:var(--navy-900)}
  .cal-sw.agency{background:#F1ECFB;border-left-color:#8B5CF6}
  .cal-sw.vacation{background:#E5F5F4;border-left-color:#0E9B8E}
  .cal-sw.sick{background:#FBEAE8;border-left-color:var(--crit-solid)}
  .cal-legend2{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .cal-leg2{display:inline-flex;align-items:center;font-size:11px;color:var(--ink-faint)}

  .st-clean{background:transparent;border-left-color:transparent}
  .dp-updated{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);margin-top:6px;padding-top:11px;border-top:1px solid var(--line)}

  /* AI assistant */
  .ai-wrap{max-width:880px}
  .ai-hero{text-align:center;padding:34px 20px 10px}
  .ai-hero-i{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .ai-hero-t{font-size:21px;font-weight:800;color:var(--navy-900)}
  .ai-hero-s{font-size:13.5px;color:var(--ink-soft);max-width:520px;margin:7px auto 0;line-height:1.55}
  .ai-ex-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin:22px 0 11px}
  .ai-ex-h.sm{margin-top:18px}
  .ai-chips{display:flex;flex-wrap:wrap;gap:8px}
  .ai-chip{text-align:left;padding:9px 14px;border:1px solid var(--line-strong);background:#fff;border-radius:20px;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .12s}
  .ai-chip:hover{border-color:var(--brand);background:var(--panel-head);color:var(--navy-900)}
  .ai-thread{display:flex;flex-direction:column;gap:18px;margin-bottom:8px}
  .ai-turn{display:flex;flex-direction:column;gap:9px}
  .ai-ask{display:flex;align-items:center;gap:8px;align-self:flex-end;max-width:80%;background:var(--brand);color:#fff;padding:9px 14px;border-radius:14px 14px 3px 14px;font-size:13.5px;font-weight:600}
  .ai-ask svg{opacity:.85;flex-shrink:0}
  .ai-ans{background:#fff;border:1px solid var(--line);border-radius:3px 14px 14px 14px;padding:15px 17px;box-shadow:0 1px 2px rgba(20,40,60,.04)}
  .ai-ans-t{font-size:14.5px;font-weight:800;color:var(--navy-900);margin-bottom:11px}
  .ai-rows{display:flex;flex-direction:column}
  .ai-r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-top:1px solid var(--line)}
  .ai-r:first-child{border-top:0;padding-top:0}
  .ai-rm{font-size:13.5px;color:var(--ink);font-weight:600}
  .ai-rmeta{font-size:11.5px;color:var(--ink-faint);text-align:right;flex-shrink:0;max-width:50%}
  .ai-cg{color:var(--brand);font-weight:700;cursor:pointer}
  .ai-cg:hover{text-decoration:underline}
  .ai-tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:middle;background:#ECEFF1;color:var(--ink-soft)}
  .ai-tag.good{background:#DDF0E6;color:var(--good-solid)}
  .ai-tag.soon{background:#F6E8CE;color:var(--soon-solid)}
  .ai-tag.crit{background:#F7D9D5;color:var(--crit-solid)}
  .ai-sub{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin:14px 0 8px}
  .ai-sub:first-child{margin-top:0}
  .ai-none{font-size:13px;color:var(--ink-soft);line-height:1.5}
  .ai-inbar{position:sticky;bottom:0;display:flex;gap:9px;padding:14px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:18px}
  .ai-input{flex:1;padding:12px 15px;border:1px solid var(--line-strong);border-radius:24px;font-size:14px;font-family:inherit;outline:none}
  .ai-input:focus{border-color:var(--brand)}
  .ai-inbar .btn{border-radius:24px}

  /* day side panel */
  .side-bg{position:fixed;inset:0;background:rgba(20,40,60,.34);opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
  .side-bg.show{opacity:1;pointer-events:auto}
  .side-panel{position:absolute;top:0;right:0;height:100%;width:390px;max-width:92vw;background:#fff;box-shadow:-6px 0 24px rgba(20,40,60,.16);transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden}
  .side-bg.show .side-panel{transform:translateX(0)}
  .sp-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--panel-head)}
  .sp-date{font-size:18px;font-weight:800;color:var(--navy-900);line-height:1.1}
  .sp-date2{font-size:12px;color:var(--ink-faint);margin-top:3px}
  .sp-body{flex:1;overflow-y:auto;padding:18px 20px}
  .sp-statusline{margin-bottom:16px}
  .sp-status{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:5px 13px;border-radius:4px;background:#ECEFF1;color:var(--ink-soft)}
  .sp-status.avail{background:#DDF0E6;color:var(--good-solid)}
  .sp-status.devoted{background:#D5E3EF;color:var(--navy-900)}
  .sp-status.agency{background:#E7DEFA;color:#6D28D9}
  .sp-status.vacation{background:#CDEEEB;color:#0B7A70}
  .sp-status.sick{background:#F7D9D5;color:var(--crit-solid)}
  .sp-status.unavail{background:#ECEFF1;color:var(--ink-soft)}
  .sp-status.clean{background:#F2F4F6;color:var(--ink-faint)}
  .sp-row{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-top:1px solid var(--line)}
  .sp-l{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint)}
  .sp-v{font-size:14px;color:var(--ink);line-height:1.4}
  .sp-v.strong{font-weight:700;color:var(--navy-900)}
  .sp-updated{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .sp-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  .sp-body .field{margin-bottom:15px}
  .sp-body .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-faint);margin-bottom:7px}
  .sp-body textarea{width:100%;min-height:64px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--r);font-family:inherit;font-size:13px;resize:vertical}

  /* mixed day */
  .st-mixed{background:linear-gradient(110deg,#E8F0F6 0%,#E8F0F6 50%,#EAF6EF 50%,#EAF6EF 100%);border-left-color:var(--navy-900)}
  .cal-tag.mixed{background:#DCE6F0;color:var(--navy-900);font-size:9.5px;letter-spacing:.1px;padding:2px 6px}
  .cal-sw.mixed{background:linear-gradient(110deg,#1B3B54 0%,#1B3B54 50%,#1F7A4A 50%,#1F7A4A 100%);border-left:0}
  .sp-status.mixed{background:#DCE6F0;color:var(--navy-900)}

  /* availability rules editor */
  .rule-days{display:flex;flex-direction:column;gap:8px}
  .rule-day{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .rule-d{width:40px;font-weight:800;font-size:13px;color:var(--ink-soft)}
  .rule-st{width:140px;flex-shrink:0}
  .rule-win{display:flex;align-items:center;gap:8px}
  .rule-win .ein{width:130px}
  .rule-custom{display:flex;align-items:center;gap:7px}
  .rule-custom .ein{width:110px}
  .tmp-add{display:flex;gap:7px;margin-bottom:10px}
  .tmp-add .ein{flex:1}
  .tmp-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
  .tmp-row:first-child{border-top:0}
  .tmp-d{font-weight:700;color:var(--navy-900);width:58px;flex-shrink:0}
  .tmp-v{flex:1;color:var(--ink-soft)}
  .tmp-x{border:0;background:none;color:var(--crit-solid);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
  /* availability rules summary */
  .rl-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.rl-grid{grid-template-columns:1fr}}
  .rl-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:9px}
  .rl-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
  .rl-row:first-of-type{border-top:0}
  .rl-d{font-weight:700;color:var(--ink-soft);width:64px;flex-shrink:0}
  .rl-v{color:var(--ink);text-align:right}
  .rl-av{color:var(--good-solid);font-weight:600}
  .rl-ag{color:#6D28D9;font-weight:600}
  .rl-off{color:var(--ink-faint)}
  .rl-due{color:var(--soon-solid);font-weight:700}
  .sp-src{display:inline-block;margin-left:7px;font-size:8.5px;font-weight:800;letter-spacing:.3px;padding:1px 5px;border-radius:8px;background:#E7EDF2;color:var(--brand);vertical-align:middle}

  /* weekly tasks */
  .tk-summary{background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:14px}
  .tk-sum-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:12px}
  .tk-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:640px){.tk-tiles{grid-template-columns:repeat(2,1fr)}}
  .tk-tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:center}
  .tk-tv{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .tk-tv.good{color:var(--good-solid)} .tk-tv.crit{color:var(--crit-solid)} .tk-tv.watch{color:var(--brand)}
  .tk-tl{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:600}
  .tk-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
  .tk-sech{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
  .tk-sech.done{color:var(--good-solid)}
  .tk-n{background:var(--line);color:var(--ink-soft);border-radius:9px;padding:1px 8px;font-size:11px}
  .tk-card{display:flex;gap:14px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:9px}
  .tk-card.is-over{border-color:#E8B7B1}
  .tk-card.is-done{opacity:.72;background:var(--panel-head)}
  .tk-main{flex:1;min-width:0}
  .tk-top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .tk-title{font-size:14px;font-weight:700;color:var(--navy-900)}
  .tk-card.is-done .tk-title{text-decoration:line-through;color:var(--ink-soft)}
  .tk-pri{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:9px}
  .tk-pri.high{background:#F7D9D5;color:var(--crit-solid)} .tk-pri.medium{background:#F6E8CE;color:var(--soon-solid)} .tk-pri.low{background:#E4EAEF;color:var(--ink-soft)}
  .tk-meta{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tk-dot{color:var(--ink-faint)}
  .tk-asg{font-weight:700;color:var(--brand)}
  .tk-due.over{color:var(--crit-solid);font-weight:700}
  .tk-notes{display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-size:12px;font-family:inherit;color:var(--ink)}
  .tk-notes:focus{outline:none;border-color:var(--brand)}
  .tk-doneline{font-size:11.5px;color:var(--good-solid);margin-top:7px;display:flex;align-items:center;gap:5px}
  .tk-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
  .tk-st{font-size:11px;font-weight:700;padding:5px 11px;border:1px solid var(--line-strong);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit;white-space:nowrap}
  .tk-st.on{background:var(--ink-soft);color:#fff;border-color:var(--ink-soft)}
  .tk-st.on.prog{background:var(--soon-solid);border-color:var(--soon-solid)}
  .tk-st.on.done{background:var(--good-solid);border-color:var(--good-solid)}

  /* school / childcare statuses + view-only */
  .st-school{background:#FBF1DF;border-left-color:#BD8312}
  .st-childcare{background:#F8E9F2;border-left-color:#C2569A}
  .cal-tag.school{background:#F2E2C0;color:#8A5E0E}
  .cal-tag.childcare{background:#F2D9E8;color:#9C3F76}
  .cal-sw.school{background:#FBF1DF;border-left-color:#BD8312}
  .cal-sw.childcare{background:#F8E9F2;border-left-color:#C2569A}
  .sp-status.school{background:#F2E2C0;color:#8A5E0E}
  .sp-status.childcare{background:#F2D9E8;color:#9C3F76}
  .cal-viewonly{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);background:var(--panel-head);border:1px solid var(--line);border-radius:10px;padding:3px 11px}
  .sp-foot-note{font-size:11.5px;color:var(--ink-faint);flex:1}

  .tk-intro{font-size:13px;color:var(--ink-soft);background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:14px;line-height:1.5}

  /* stacked day blocks */
  .cal-cell{min-height:62px!important;padding:6px 7px 7px 8px!important;border-left:1px solid var(--line)!important}
  .cal-blocks{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .cal-blk{display:flex;justify-content:space-between;align-items:baseline;gap:5px;padding:2px 6px;border-radius:2px;border-left:2.5px solid}
  .cb-l{font-weight:800;text-transform:uppercase;letter-spacing:.2px;font-size:9px;white-space:nowrap}
  .cb-t{font-size:9px;font-weight:600;white-space:nowrap;opacity:.9;font-variant-numeric:tabular-nums}
  .cal-blk.devoted{background:#E3EDF5;border-color:#1B3B54;color:#1B3B54}
  .cal-blk.open{background:#E6F4EC;border-color:#1F7A4A;color:#176B3F}
  .cal-blk.agency{background:#EEE7FB;border-color:#6D28D9;color:#5B21B6}
  .cal-blk.school{background:#FBF1DF;border-color:#BD8312;color:#8A5E0E}
  .cal-blk.childcare{background:#F8E9F2;border-color:#C2569A;color:#9C3F76}
  .cal-blk.vacation{background:#D7F0ED;border-color:#0B7A70;color:#0B6A62}
  .cal-blk.sick{background:#F9DCD8;border-color:#C0271A;color:#A8221A}
  .cal-blk.unavail{background:#ECEFF1;border-color:#90A0AC;color:#5A6A75}
  .cal-bsw{width:11px;height:11px;border-radius:2px;border-left:3px solid;display:inline-block;vertical-align:-1px;margin-right:4px}
  .cal-bsw.devoted{background:#E3EDF5;border-color:#1B3B54}
  .cal-bsw.open{background:#E6F4EC;border-color:#1F7A4A}
  .cal-bsw.agency{background:#EEE7FB;border-color:#6D28D9}
  .cal-bsw.school{background:#FBF1DF;border-color:#BD8312}
  .cal-bsw.childcare{background:#F8E9F2;border-color:#C2569A}
  .cal-bsw.vacation{background:#D7F0ED;border-color:#0B7A70}
  .cal-bsw.sick{background:#F9DCD8;border-color:#C0271A}
  .cal-bsw.unavail{background:#ECEFF1;border-color:#90A0AC}

  /* performance panel */
  .pf-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .pf-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .pf-title{font-size:14px;font-weight:800;color:var(--navy-900)}
  .pf-periods{display:flex;gap:5px;flex-wrap:wrap}
  .pf-chip{font-size:11.5px;font-weight:700;padding:5px 12px;border:1px solid var(--line-strong);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .pf-chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pf-sech{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin:14px 0 9px}
  .pf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:680px){.pf-grid{grid-template-columns:repeat(2,1fr)}}
  .pf-tile{background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;text-align:center}
  .pf-v{font-size:21px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .pf-v.good{color:var(--good-solid)} .pf-v.crit{color:var(--crit-solid)}
  .pf-l{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-weight:600;line-height:1.25}
  /* task source / reason / ownership */
  .tk-bar{justify-content:space-between!important}
  .tk-srcfilter{display:flex;gap:5px}
  .tk-srcf{font-size:11.5px;font-weight:700;padding:5px 12px;border:1px solid var(--line-strong);background:#fff;border-radius:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .tk-srcf.on{background:var(--ink-soft);color:#fff;border-color:var(--ink-soft)}
  .tk-src{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:9px}
  .tk-src.system{background:#E7EDF2;color:var(--brand)}
  .tk-src.manual{background:#EAE4F7;color:#5B21B6}
  .tk-reason{font-size:12px;color:var(--ink-soft);margin:5px 0 2px;display:flex;align-items:center;gap:5px}
  .tk-reason svg{color:var(--brand);flex-shrink:0}
  .tk-own{font-size:11.5px;color:var(--ink-faint);margin-top:5px}
  .tk-own b{color:var(--ink-soft);font-weight:700}

  /* leaderboard */
  .lb-tiles{display:flex;gap:9px}
  .lb-tile{background:var(--panel-head);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;text-align:center;min-width:74px}
  .lb-tv{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .lb-tv.watch{color:var(--brand)} .lb-tv.crit{color:var(--crit-solid)}

    else if(e.clockOut===false && NOW > s.end){ type='Missed clock-out'; sev='soon'; detail=`Shift ended ${agoShort(s.end)} \u2014 no clock-out recorded`; }
    else if(e.runningLate){ type='Running late'; sev='soon'; detail=`Caregiver reported ~${e.runningLate} min late`; }
    else if(e.clockIn===false && minsLate>=30){ type='No show'; sev='crit'; detail=`Shift started ${hmMins(minsLate)} ago \u2014 no clock-in recorded`; }
    else if(e.clockIn===false && minsLate>=5){ type='Late clock-in'; sev='soon'; detail=`Shift started ${hmMins(minsLate)} ago \u2014 has not checked in`; }
    else if(e.clockIn===false && minsLate>=0){ type='Missed clock-in'; sev='soon'; detail='Scheduled start passed \u2014 no clock-in yet'; }
    if(type){
      let tier=null;
      if(type==='No show') tier = minsLate>=60?'red':'orange';
      else if(type==='Late clock-in') tier='yellow';
      out.push({shift:s, cg, cl, type, sev, minsLate, detail, tier});
    }
  });
  const rank=t=>({'No show':0,'Missed clock-out':1,'Running late':2,'Late clock-in':3,'Missed clock-in':4}[t]??5);
  out.sort((a,b)=>rank(a.type)-rank(b.type) || b.minsLate-a.minsLate);
  return out;
}

function availableToday(){ return state.caregivers.filter(c=>c.today===1 && c.avail[dayKey(NOW)]===1); }

// CORE: rank caregivers for a shift or a manual query spec
function specFromShift(shift){
  const cl=clById(shift.clientId);
  return {shiftId:shift.id, clientId:cl.id, clientName:cl.name, city:cl.city, reqSkills:cl.reqSkills,
    restrictions:cl.restrictions, pets:cl.pets, smoking:cl.smoking, risk:cl.risk,
    start:shift.start, end:shift.end, callOff:shift.callOff, callOffReason:shift.callOffReason, prevCaregiver:shift.prevCaregiver};
}
function reqGender(restrictions){ if((restrictions||[]).includes('Female caregiver only')) return 'F'; if((restrictions||[]).includes('Male caregiver only')) return 'M'; return null; }
function rankCaregivers(arg){
  const ctx = (arg && arg.reqSkills!==undefined) ? arg : specFromShift(arg);
  const day = dayKey(ctx.start);
  const rg = reqGender(ctx.restrictions);
  const reqSkills = ctx.reqSkills||[];
  const results = state.caregivers.map(cg=>{
    const reasons=[]; let score=0; let excluded=null;

    if(ctx.callOff && ctx.prevCaregiver===cg.id) excluded = excluded || `Called off this shift${ctx.callOffReason?' \u2014 '+ctx.callOffReason:''}`;
    if(cg.today===0 && day===dayKey(NOW)) excluded = excluded || `Unavailable today${cg.tempNote?' \u2014 '+cg.tempNote:''}`;
    if(cg.avail[day]!==1) excluded = excluded || `Not available ${day}`;
    if(ctx.clientId && cg.blockedClients.includes(ctx.clientId)) excluded = excluded || `Blocked from client`;
    if(rg && cg.gender!==rg) excluded = excluded || `Client restriction \u00b7 ${rg==='F'?'female':'male'} only`;
    const missing = reqSkills.filter(s=>!cg.skills.includes(s));
    if(missing.length) excluded = excluded || `Missing skill: ${missing.join(', ')}`;
    if(ctx.pets && cg.restrictions.includes('No pets')) excluded = excluded || `Client has pets \u2014 caregiver restriction`;
    if(ctx.smoking && cg.restrictions.includes('No smoking homes')) excluded = excluded || `Smoking home conflict`;
    if(reqSkills.includes('Transfers') && cg.restrictions.includes('No transfers (back)')) excluded = excluded || `Can't do transfers`;
    if(!ctx.includeUnverified && availVerifyStatus(cg).key==='unverified') excluded = excluded || `Unverified availability \u2014 90+ days since confirmed`;

    if(excluded){ return {cg, score:0, reasons:[{t:excluded,k:'minus'}], excluded}; }

    score += 16; reasons.push({t:'Available', k:'plus'});
    if(cg.tempNote && /extra|open/i.test(cg.tempNote)){ score+=4; reasons.push({t:'Wants extra shifts', k:'plus'}); }

    const dist = miles(cg.base, ctx.city||cg.base);
    score += Math.max(0, 18 - dist*0.9);
    if(ctx.city) reasons.push({t:`${dist} mi \u00b7 ${driveMin(dist)} min`, k: dist<=10?'plus':(dist<=22?'note':'minus')});

    const extra = cg.skills.filter(s=>!reqSkills.includes(s) && ['Dementia','Hospice','Hoyer Lift'].includes(s));
    score += Math.min(10, reqSkills.length*2 + extra.length*2);
    if(reqSkills.length) reasons.push({t:'Skills match', k:'plus'});

    if(ctx.city && cg.prefCities.includes(ctx.city)){ score+=8; reasons.push({t:'Preferred city', k:'plus'}); }
    if(ctx.clientId && cg.priorClients.includes(ctx.clientId)){ score+=13; reasons.push({t:'Worked with client', k:'plus'}); }

    score += (cg.reliability/100)*15;
    if(cg.reliability>=95) reasons.push({t:`${cg.reliability}% reliable`, k:'plus'});
    else if(cg.reliability<85) reasons.push({t:`${cg.reliability}% reliable`, k:'minus'});
    const _av=availVerifyStatus(cg);
    if(_av.key==='current'){ score+=6; reasons.push({t:'Availability current', k:'plus'}); }
    else if(_av.key==='duesoon'){ score-=2; reasons.push({t:'Verification due soon', k:'minus'}); }
    else if(_av.key==='needs'){ score-=5; reasons.push({t:'Availability needs verification', k:'minus'}); }
    else if(_av.key==='overdue'){ score-=10; reasons.push({t:'Availability overdue', k:'minus'}); }

    if(cg.weekHrs>=40){ score-=16; reasons.push({t:'At 40 hrs \u2014 overtime', k:'minus'}); }
    else if(cg.weekHrs>=38){ score-=8; reasons.push({t:'Near overtime', k:'minus'}); }
    if(cg.recentDeclines>=3){ score-=10; reasons.push({t:`Declined ${cg.recentDeclines} in a row`, k:'minus'}); }
    else if(cg.recentDeclines>=1){ score-=4; reasons.push({t:'Recent decline', k:'minus'}); }
    if(cg.callOffs30>=2){ score-=6; reasons.push({t:`${cg.callOffs30} call-offs/30d`, k:'minus'}); }
    if((ctx.restrictions||[]).includes('Female caregiver preferred') && cg.gender==='M'){ score-=6; reasons.push({t:'Client prefers female', k:'minus'}); }

    if(ctx.shiftId){ const lc=lastContact(ctx.shiftId, cg.id); if(lc){ const map={'no-answer':'No answer','declined':'Declined','callback':'Call back','accepted':'Accepted'}; reasons.push({t:`Already: ${map[lc.result]||lc.result}`, k:'note'}); } }

    score = Math.max(0, Math.min(100, Math.round(score)));
    const lc2 = ctx.shiftId?lastContact(ctx.shiftId, cg.id):null;
    return {cg, score, reasons, excluded:null, contacted:!!lc2, contactResult: lc2?lc2.result:null};
  });
  const eligible = results.filter(r=>!r.excluded).sort((a,b)=>b.score-a.score);
  const excluded = results.filter(r=>r.excluded);
  return {eligible, excluded};
}

    a.push({k:'crit', icon:'flag', t:'Client with 2+ complaints (30d)', d:`${c.name} — keep consistent caregiver, no new faces`, go:null});
  });
  state.caregivers.filter(c=>c.callOffs30>=3).forEach(c=>{
    a.push({k:'soon', icon:'user', t:'Caregiver with 3+ call-offs (30d)', d:`${c.name} — reliability watch`, go:null});
  });
  state.caregivers.filter(c=>c.declinesStreak>=3).forEach(c=>{
    a.push({k:'soon', icon:'x', t:'Declined 3 shifts in a row', d:`${c.name} — confirm still active / availability changed?`, go:null});
  });
  const unfilled={};
  openShifts().forEach(s=>{ unfilled[s.clientId]=(unfilled[s.clientId]||0)+1; });
  Object.keys(unfilled).filter(k=>unfilled[k]>=2).forEach(k=>{
    a.push({k:'soon', icon:'repeat', t:'Client with repeated unfilled shifts', d:`${clById(k).name} — ${unfilled[k]} open shifts pending`, go:null});
  });
  state.caregivers.filter(c=>c.replacedOn.length>=2).forEach(c=>{
    a.push({k:'watch', icon:'swap', t:'Caregiver replaced on 2 clients', d:`${c.name} — review fit`, go:null});
  });
  state.clients.filter(c=>c.risk==='high' && !c.hasBackup).forEach(c=>{
    a.push({k:'crit', icon:'shield', t:'High-risk client without backup', d:`${c.name} — assign a secondary caregiver`, go:null});
  });
  const order={crit:0,soon:1,watch:2};
  return a.sort((x,y)=>order[x.k]-order[y.k]);
}

function findReplacement(shiftId, reason){
  const s=state.shifts.find(x=>x.id===shiftId); if(!s) return;
  const orig=s.assigned||s.prevCaregiver;
  if(s.evv) s.evv.resolved=true;            // clear the attendance alert — it's now an active coverage effort
  s.prevCaregiver=orig; s.assigned=null; s.status='open'; s.openedAt=s.openedAt||new Date();
  s.callOff=false; s.replacementNeeded=true; s.replacementReason=reason||s.replacementReason||'No-show / no clock-in';
  const cl=clById(s.clientId);
  if(orig) recordAttendance(orig, /late/i.test(s.replacementReason)?'late':'noshow', {client:cl.name, date:new Date()});
  logActivity(`Replacement needed \u2014 ${orig?cgById(orig).name:'caregiver'} ${/late/i.test(s.replacementReason)?'not arriving':'no clock-in'} for ${cl.name}. Searching for coverage.`, s.id);
  toast('Replacement needed \u2014 loading coverage options');
  openFindCoverage(shiftId);
}

function doNextAction(shiftId){
  const s=state.shifts.find(x=>x.id===shiftId); const a=nextBestAction(s);
  if(a.kind==='call') openContactModal(shiftId,a.cgId);
  else if(a.kind==='assign') assignShift(shiftId,a.cgId);
  else if(a.kind==='partial'){ if(state.coverageQuery&&state.coverageQuery.shiftId===shiftId){ state.showPartial=true; render(); } else openFindCoverage(shiftId); }
  else if(a.kind==='ot'){ if(state.coverageQuery&&state.coverageQuery.shiftId===shiftId){ state.showOT=true; render(); } else openFindCoverage(shiftId); }
  else if(a.kind==='escalate'){ if(s.escalated){ openFindCoverage(shiftId); } else escalateShift(shiftId); }
  else openFindCoverage(shiftId);
}

/* coverage progress for an open shift (prevents duplicate work) */
function coverageProgress(s){
  const log=state.contactLog[s.id]||[];
  const latest={}; log.forEach(l=>{ latest[l.caregiverId]=l.result; });
  const ids=Object.keys(latest);
  const declined=ids.filter(id=>latest[id]==='declined').length;
  const noAnswer=ids.filter(id=>latest[id]==='no-answer').length;
  const callback=ids.filter(id=>latest[id]==='callback').length;
  const accepted=ids.filter(id=>latest[id]==='accepted').length;
  const cl=clById(s.clientId);
  const q={clientId:cl.id, start:decHr(s.start), end:decHr(s.end), city:cl.city, skills:cl.reqSkills, filters:[], shiftId:s.id};
  const r=manualSearch(q, dayKey(s.start));
  const available=r.fullPool.length;
  const status = s.assigned?'Covered':(accepted>0?'Pending assign':(ids.length>0?'In progress':'Not started'));
  return {available, contacted:ids.length, declined, noAnswer, callback, accepted, assigned:!!s.assigned, status, pool:r.fullPool, partial:r.partialPool};
}
/* Next best action — single clear action following the escalation ladder */
/* ===== COVERAGE DECISION ENGINE — the heart of the system =====
   For any open shift, always computes status, full metrics, the single
   Next Best Action, and the auto-escalation ladder. */
function coverageDecision(s){
  const cl=clById(s.clientId), dKey=dayKey(s.start);
  const q={clientId:cl.id, start:decHr(s.start), end:decHr(s.end), city:cl.city, skills:cl.reqSkills, filters:[], shiftId:s.id};
  const base=manualSearch(q,dKey);
  const ot=manualSearch({...q,allowOT:true},dKey);
  const log=state.contactLog[s.id]||[]; const latest={}; log.forEach(l=>latest[l.caregiverId]=l);
  const cId=Object.keys(latest);
  const res=r=>cId.filter(id=>latest[id].result===r);
  const declined=res('declined'), noAnswer=res('no-answer'), callback=res('callback'), accepted=res('accepted');
  const fullActive=base.fullPool.filter(e=>!latest[e.cg.id]);
  const partialActive=base.partialPool.filter(e=>!latest[e.cg.id]);
  const otCand=ot.fullPool.filter(e=>e.ot && !latest[e.cg.id]);
  const prev=state.caregivers.filter(c=>c.priorClients.includes(cl.id) && !latest[c.id]
            && !base.fullPool.some(e=>e.cg.id===c.id) && !base.partialPool.some(e=>e.cg.id===c.id));
  let status = s.assigned?'Covered':(s.escalated?'Escalated':(cId.length?'In Progress':'Open'));
  // Next Best Action — strict precedence
  let next;
  if(s.assigned) next={text:'Shift covered \u2014 '+cgById(s.assigned).name, kind:'done'};
  else if(s.escalated) next={text:'Escalated to '+s.escalatedTo+' \u2014 awaiting decision', kind:'escalated'};
  else if(accepted.length) next={text:'Assign '+cgById(accepted[0]).name+' (accepted)', kind:'assign', cgId:accepted[0]};
  else if(fullActive.length) next={text:'Call '+fullActive[0].cg.name, kind:'call', cgId:fullActive[0].cg.id};
  else if(callback.length) next={text:'Retry '+cgById(callback[0]).name+' (callback due)', kind:'call', cgId:callback[0]};
  else if(noAnswer.length) next={text:'Retry '+cgById(noAnswer[0]).name+' (no answer)', kind:'call', cgId:noAnswer[0]};
  else if(partialActive.length) next={text:'Open partial coverage options', kind:'partial'};
  else if(prev.length) next={text:'Try previous caregiver \u2014 '+prev[0].name, kind:'call', cgId:prev[0].id};
  else if(otCand.length) next={text:'Consider overtime exception \u2014 '+otCand[0].cg.name, kind:'ot', cgId:otCand[0].cg.id};
  else next={text:'Escalate \u2014 client at risk', kind:'escalate'};
  return {
    status, hoursUntil:hoursUntil(s.start),
    full:base.fullPool.length, partial:base.partialPool.length,
    contacted:cId.length, declined:declined.length, noAnswer:noAnswer.length, callback:callback.length, accepted:accepted.length,
    remaining:fullActive.length, next, shiftId:s.id,
    steps:{ noAnswer:noAnswer.length, partial:partialActive.length, prev:prev.length, ot:otCand.length },
    pools:{ fullActive, partialActive, otCand, prev, noAnswer:noAnswer.map(cgById), callback:callback.map(cgById) }
  };
}
function nextBestAction(s){ return coverageDecision(s).next; }
function viewAllAvailable(shiftId){ seedQueryFromShift(shiftId); state.coverageQuery.mode='manual'; state.coverageQuery.locked=true; state.expandedOpen=false; go('coverage'); }
function toggleToday(shiftId){ state.todayTouched=true; state.todayExpand = (state.todayExpand===shiftId?null:shiftId); render(); }
function hm(h){ let hh=Math.floor(h), mm=Math.round((h-hh)*60); if(mm===60){hh++;mm=0;} if(hh>0&&mm===0) return hh+'h'; if(hh===0) return mm+'m'; return hh+'h '+mm+'m'; }

// total staffing pool for a shift (full vs partial coverage), reusing the manual-availability engine
function poolForShift(shift){
  const cl=clById(shift.clientId);
  const q={ clientId:cl.id, start:decHr(shift.start), end:decHr(shift.end), city:cl.city, skills:cl.reqSkills, shiftId:shift.id };
  const r=manualSearch(q, dayKey(shift.start));
  return {full:r.fullPool.length, partial:r.partialPool.length, total:r.fullPool.length+r.partialPool.length};
}

/* ===== PRIORITY ENGINE — Priority = Risk x Time-to-Impact ===== */
function clientRiskMult(cl){
  let m=1.0;
  if(cl.risk==='high' || cl.careType) m=1.5;          // 24/7, hospital sitter, high-risk
  else if(cl.risk==='medium') m=1.2;
  if(!cl.hasBackup) m=Math.max(m,1.3);
  if(cl.missedThisWeek>=2 || cl.complaints>=2) m=Math.max(m,1.5);
  return m;
}
function ttiUrgency(tti){
  if(tti<=0) return 100;          // client exposed right now
  if(tti<=30) return 96;          // within 30 min
  if(tti<=120) return 90;         // within 2 hours -> critical band
  if(tti<=360) return 62;         // within 6 hours
  if(tti<=720) return 52;         // within 12 hours (later today)
  if(tti<=1000) return 48;        // rest of today
  if(tti<=2880) return 22;        // 1-2 days (new client / future)
  return 10;                      // preventive / far out
}
function problemScore(p){
  let s=ttiUrgency(p.tti)*(p.risk||1);
  if(p.noViable) s=Math.max(s,72);   // coverage likely to fail -> at least High
  return Math.min(100, Math.round(s));
}
function priorityTier(score){ return score>=88?1 : score>=48?2 : score>=18?3 : 4; }
function ttiLabel(tti,exposed){
  if(exposed||tti<=0) return 'Uncovered now';
  if(tti<60) return 'Impact in '+Math.round(tti)+'m';
  return 'Impact in '+hm(tti/60);
}
function buildPriorityBoard(){
  const items=[];
  // Attendance / EVV problems
  attendanceAlerts().forEach(a=>{
    let tti, exposed=false;
    if(a.type==='No show'){ tti=0; exposed=true; }
    else if(a.type==='Late clock-in'||a.type==='Running late'){ tti=20; }
    else if(a.type==='Missed clock-in'){ tti=15; }
    else if(a.type==='Missed clock-out'){ tti=2000; }      // no client exposure
    else tti=30;
    const risk=clientRiskMult(a.cl);
    const score=problemScore({tti,risk,exposed});
    items.push({kind:'attendance', alert:a, score, tier:priorityTier(score), tti, risk, riskHigh:risk>=1.5});
  });
  // Coverage gaps (one row per client, soonest open shift)
  const byClient={};
  openShifts().forEach(s=>{ (byClient[s.clientId]=byClient[s.clientId]||[]).push(s); });
  Object.keys(byClient).forEach(cid=>{
    const list=byClient[cid].sort((a,b)=>a.start-b.start); const s=list[0]; const cl=clById(cid); const h=hoursUntil(s.start);
    const extra=list.length>1?` \u00b7 +${list.length-1} more shift${list.length-1>1?'s':''}`:'';
    const D=coverageDecision(s);
    const noViable=D.full===0 && D.partial===0 && !s.escalated && !s.assigned;
    const risk=clientRiskMult(cl);
    const tti=Math.max(0,h*60);
    const score = s.escalated ? 84 : problemScore({tti,risk,noViable,exposed:h<=0});
    items.push({kind:'coverage', shift:s, client:cl, h, extra, decision:D, noViable, score, tier:priorityTier(score), tti, risk, riskHigh:risk>=1.5});
  });
  // Preventive / standing risks (fixed tiers, risk can elevate)
  const ot=overtimeRisk();
  if(ot.length) items.push({kind:'nav', tone:'soon', score:30, tier:3, title:`Overtime risk \u2014 ${ot.length} caregiver${ot.length>1?'s':''}`, sub:`${ot.map(c=>c.name.split(' ')[0]+' '+c.weekHrs+'h').join(', ')} \u00b7 keep off open shifts`, go:`go('avail')`, chip:`${ot.length}`});
  state.clients.filter(c=>!c.hasBackup && !byClient[c.id]).forEach(c=>{
    items.push({kind:'nav', tone:'soon', score:32, tier:3, title:`No backup caregiver \u2014 ${c.name}`, sub:`${c.careType?c.careType+' \u00b7 ':''}${c.risk==='high'?'high-risk client \u00b7 ':''}assign a secondary caregiver`, go:`go('assistant')`, chip:'1'});
  });
  // sort strictly by score (risk x time), then soonest impact
  items.sort((a,b)=> b.score-a.score || a.tti-b.tti);
  const handled=[]; // filled today / resolved
  state.shifts.forEach(s=>{ if(s.filledToday){ handled.push({text:`${clById(s.clientId).name} \u2014 covered by ${cgById(s.assigned).name}`}); } });
  return {
    p1:items.filter(i=>i.tier===1),
    p2:items.filter(i=>i.tier===2),
    p3:items.filter(i=>i.tier===3),
    p4:items.filter(i=>i.tier===4),
    handled
  };
}
function buildWorkQueue(){
  const critical=[], warning=[], reference=[];

  // CRITICAL — attendance/EVV alerts + coverage gaps, ordered by the scheduler priority:
  // 1 No-show  ·  2 Call-off  ·  3 Uncovered  ·  4 Late arrival/EVV  ·  (within rank, by urgency)
  attendanceAlerts().forEach(a=>{
    const prank = a.type==='No show' ? 1 : a.type==='Missed clock-out' ? 6 : 2;
    critical.push({kind:'attendance', prank, _u:-a.minsLate, alert:a});
  });
  const byClient={};
  openShifts().forEach(s=>{ (byClient[s.clientId]=byClient[s.clientId]||[]).push(s); });
  Object.keys(byClient).forEach(cid=>{
    const list=byClient[cid].sort((a,b)=>a.start-b.start); const s=list[0]; const cl=clById(cid); const h=hoursUntil(s.start);
    const extra=list.length>1?` \u00b7 +${list.length-1} more shift${list.length-1>1?'s':''}`:'';
    critical.push({kind:'coverage', prank:s.callOff?3:4, _u:h, _start:s.start, shift:s, client:cl, h, extra});
  });
  critical.sort((a,b)=> a.prank-b.prank || a._u-b._u);

  // WARNING — risks that aren't a hard gap yet (below attendance + coverage)
  const ot=overtimeRisk();
  if(ot.length) warning.push({title:`Overtime risk \u2014 ${ot.length} caregiver${ot.length>1?'s':''}`, sub:`${ot.map(c=>c.name.split(' ')[0]+' '+c.weekHrs+'h').join(', ')} \u00b7 keep off open shifts`, go:`go('avail')`, chip:`${ot.length}`, chipTone:'soon'});
  const nb=state.clients.filter(c=>!c.hasBackup);
  if(nb.length) warning.push({title:`No backup caregiver \u2014 ${nb.length} client${nb.length>1?'s':''}`, sub:`${nb.map(c=>c.name).join(', ')} \u00b7 assign a secondary caregiver`, go:`go('assistant')`, chip:`${nb.length}`, chipTone:'soon'});

  // REFERENCE tier removed from Today — Recently declined lives in Find Coverage / Availability,
  // Open handoffs live in the Handoff page. Today stays action-only.

  return {critical, warning, reference};
}

/* ===== workflow: Open -> In Progress -> Resolved, with activity log ===== */
function logActivity(text, shiftId){ state.activityLog.unshift({time:new Date(), text, shiftId}); }
function resolveProblem(rec){ state.todayResolved.unshift(Object.assign({time:new Date()}, rec)); logActivity('Issue resolved \u2014 '+(rec.type||'')+(rec.client?' ('+rec.client+')':''), rec.shiftId); }
function itemStatus(item){
  if(item.kind==='attendance'){ const s=item.alert.shift, e=s.evv||{}; if(e.onTheWay||e.runningLate||e.lastCall||(state.contactLog[s.id]||[]).length) return 'progress'; return 'open'; }

function buildSystemTasks(){
  const out=[], now=NOW.getTime();
  const SA=activeSchedulerNames(), deskCg=SA[0]||state.onShift||'', deskCl=SA[1]||SA[0]||state.onShift||'';
  const mk=(key,title,o)=>({id:'sys_'+key, source:'system', createdBy:'System', title, relType:o.relType||'general', relId:o.relId||null, priority:o.priority||'medium', due:o.due||_dDue(2), assignedTo:o.assignedTo||deskCg, status:'Open', completedBy:null, completedAt:null, notes:'', reason:o.reason||'', createdAt:_hAgo(o.age||18)});
  // ---- 1. Caregiver follow-ups ----
  state.caregivers.filter(c=>c.active!==false).forEach(c=>{
    const evs=(c.ops.attendance&&c.ops.attendance.events)||[];
    const recentCO=evs.find(e=>e.type==='calloff' && (now-new Date(e.date).getTime())/864e5 <= 4);
    if(recentCO){
      if(/emergency/i.test(recentCO.reason||''))
        out.push(mk('coret_'+c.id,'Check status and return date after emergency absence',{relType:'caregiver',relId:c.id,priority:'high',assignedTo:deskCg,due:_dDue(0),reason:c.name+' was out for an emergency \u2014 confirm their status and expected return date'}));
      else
        out.push(mk('coret_'+c.id,'Confirm caregiver is returning for next shift',{relType:'caregiver',relId:c.id,priority:'high',assignedTo:deskCg,due:_dDue(0),reason:c.name+' called off ('+(recentCO.reason||'no reason given')+') \u2014 confirm they are back for the next shift'}));
    }
    if((c.callOffs30||0)>=3)
      out.push(mk('co_'+c.id,'Schedule follow-up conversation about repeated call-offs',{relType:'caregiver',relId:c.id,priority:'high',assignedTo:deskCg,reason:c.callOffs30+' call-offs in the last 30 days \u2014 needs a direct conversation'}));
  });
  // ---- availability verification needed ----
  state.caregivers.filter(c=>c.active!==false).forEach(c=>{ const st=availVerifyStatus(c); if(['duesoon','needs','overdue','unverified'].includes(st.key)){ const d=availDaysSince(c); out.push(mk('avv_'+c.id,'Verify availability with caregiver',{relType:'caregiver',relId:c.id,priority:(st.key==='unverified'||st.key==='overdue')?'high':(st.key==='needs'?'medium':'low'),assignedTo:deskCg,due:_dDue(st.key==='duesoon'?2:0),reason:c.name+' \u2014 '+st.label+' ('+c.ops.availCheckFreq+' cadence'+(d!=null?', last confirmed '+d+'d ago':'')+')'})); } });
  // ---- 2. New client placement follow-ups ----
  (state.placements||[]).forEach(p=>{
    const cg=cgById(p.cgId), cl=clById(p.clientId); if(!cg||!cl) return;
    const map={
      profile:['Send new caregiver\u2019s profile to family',`Send ${cg.name}\u2019s profile to ${cl.name}\u2019s family for review`],
      approval:['Confirm family approved the caregiver',`Waiting on ${cl.name}\u2019s family to approve ${cg.name} \u2014 follow up`],
      firstshift:['Confirm first shift completed successfully',`Check that ${cg.name}\u2019s first shift with ${cl.name} went well`],
      feedback:['Get client/family feedback on the new caregiver',`Collect ${cl.name} family feedback on ${cg.name}`]
    };
    const m=map[p.stage]; if(m) out.push(mk('plc_'+p.id, m[0], {relType:'client',relId:cl.id,priority:'medium',assignedTo:p.assignedTo||deskCl,due:_dDue(p.due!=null?p.due:1),reason:m[1]}));
  });
  // ---- 3. Open operational follow-ups ----
  // pending caregiver callbacks captured during coverage calls
  Object.entries(state.contactLog||{}).forEach(([sid,log])=>{ const cb=(log||[]).find(l=>l.result==='callback'); if(cb){ const c=cgById(cb.caregiverId); const s=state.shifts.find(x=>x.id===sid); const cl=s?clById(s.clientId):null; out.push(mk('cb_'+sid,'Return caregiver callback',{relType:'caregiver',relId:cb.caregiverId,priority:'medium',assignedTo:deskCg,due:_dDue(0),reason:(c?c.name:'Caregiver')+' asked for a callback'+(cl?' about '+cl.name+'\u2019s shift':'')})); } });
  // seeded operational follow-ups (family callbacks, change requests, discharge, etc.)
  (state.followUps||[]).forEach(fu=> out.push(mk('fu_'+fu.id, fu.title, {relType:fu.relType,relId:fu.relId,priority:fu.priority||'medium',assignedTo:fu.assignedTo||deskCl,due:_dDue(fu.due!=null?fu.due:0),reason:fu.reason})));
  // unresolved scheduling concerns from handoff
  const ho=[...state.handoff.opener,...state.handoff.closer].filter(h=>!h.done).length;
  if(ho) out.push(mk('ho','Follow up on unresolved scheduling concerns',{relType:'handoff',priority:'medium',assignedTo:deskCl,due:_dDue(0),reason:ho+' open handoff item'+(ho>1?'s':'')+' from the last shift'}));
  // previous-week coverage issues (recurring clients)
  state.clients.forEach(cl=>{ if((cl.missedThisWeek||0)>=2||(cl.complaints||0)>=2) out.push(mk('cov_'+cl.id,'Follow up on last week\u2019s coverage issues',{relType:'client',relId:cl.id,priority:'high',assignedTo:deskCl,reason:cl.missedThisWeek>=2?cl.missedThisWeek+' missed shifts last week':cl.complaints+' recent complaints to follow up on'})); });
  // ---- documentation: required forms not yet completed (administrative, belongs here not on Today) ----
  (missingFormsAll()||[]).forEach(m=>{
    out.push(mk('form_'+m.client.id+'_'+m.name.replace(/[^a-z0-9]+/gi,''),'Complete '+m.name+' for '+m.client.name,{relType:'client',relId:m.client.id,priority:'medium',assignedTo:deskCl,due:_dDue(3),reason:m.name+' is required for '+m.client.name+'\u2019s care needs and has not been completed yet'}));
  });
  return out;
}

// ===== Scheduler names =====
// A simple growing pool of names. New names typed into Created By / Assign To are saved here
// automatically and become available for future selection. No admin page needed.
function activeSchedulerNames(){ const seen=new Set(), out=[]; (state.schedulerNames||[]).forEach(n=>{ const k=(n||'').toLowerCase(); if(n&&!seen.has(k)){ seen.add(k); out.push(n); } }); return out; }
function defaultScheduler(){ return activeSchedulerNames()[0]||state.onShift||''; }
function addSchedulerName(n){ n=(n||'').trim(); if(!n) return ''; if(!state.schedulerNames) state.schedulerNames=[]; const ex=state.schedulerNames.find(x=>x.toLowerCase()===n.toLowerCase()); if(ex) return ex; state.schedulerNames.push(n); return n; }
function taskAssignees(t){ const a=t&&t.assignedTo; if(Array.isArray(a)) return a.filter(Boolean); return a?[a]:[]; }
function allSchedulers(){
  // Names in the pool, plus anyone who has actually been assigned/completed scheduling work or logged coverage.
  const set=new Set(activeSchedulerNames());
  [...state.tasks, ...(state.taskArchive||[])].forEach(t=>{ taskAssignees(t).forEach(a=>{ if(a) set.add(a); }); if(t.completedBy) set.add(t.completedBy); });
  Object.values(state.contactLog||{}).forEach(arr=>arr.forEach(l=>{ if(l.by) set.add(l.by); }));
  if(state.onShift) set.add(state.onShift);
  return [...set];
}
function schedulerScore(name){
  const now=NOW.getTime(), mo=now-30*864e5;
  const done=[...state.tasks,...(state.taskArchive||[])].filter(t=>t.status==='Done'&&t.completedBy===name&&t.completedAt);
  const monthTasks=done.filter(t=>new Date(t.completedAt).getTime()>=mo).length;
  const openTasks=state.tasks.filter(t=>t.status!=='Done'&&taskAssignees(t).includes(name)).length;
  const completionRate=(monthTasks+openTasks)?Math.round(monthTasks/(monthTasks+openTasks)*100):(monthTasks?100:0);
  let realAttempts=0; Object.values(state.contactLog||{}).forEach(arr=>arr.forEach(l=>{ if(l.by===name) realAttempts++; }));
  const a=SCHED_ACTIVITY[name]||{};
  return { name,
    filledWeek:a.filledWeek||0, filledMonth:a.filledMonth||0,
    attempts:Math.max(a.attempts||0, realAttempts), callOffCov:a.callOffCov||0,
    closed:a.closed||0, avgFill:a.avgFill||0, fillRate:a.fillRate||0,
    openTasks, completionRate };
}
function schedulerBoard(){ return allSchedulers().map(schedulerScore).sort((a,b)=>b.filledMonth-a.filledMonth||b.completionRate-a.completionRate||b.filledWeek-a.filledWeek); }
// legacy shim
function schedulerStats(name){ const s=schedulerScore(name); return {name, week:s.filledWeek, month:s.filledMonth, open:s.openTasks, rate:s.completionRate}; }
function updateTaskNotes(id,val){ const t=state.tasks.find(x=>x.id===id); if(t) t.notes=val; }
function taskRel(t){

  if(t.relType==='handoff') return `<a class="ai-cg" onclick="go('handoff')">Shift Handoff</a>`;
  return 'All caregivers';
}

function tasksPanel(){

  const open=state.tasks.filter(t=>t.status!=='Done'&&match(t)).sort((a,b)=>new Date(a.due)-new Date(b.due));

    const due=`<span class="tk-due ${overdue?'over':''}">${overdue?'Overdue \u00b7 ':'Due '}${new Date(t.due).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`;

        <div class="tk-meta">${taskRel(t)}<span class="tk-dot">\u00b7</span>${due}</div>
        ${own}

      </div>
      <div class="tk-actions"><button class="tk-st done solo" onclick="setTaskStatus('${t.id}','Done')">${ic('check',12)} Mark Done</button></div>
    </div>`;
  };
  const bar=`<div class="tk-bar"><div class="tk-srcfilter">${srcChips}</div><button class="btn sm pri" onclick="openTaskModal()">+ Add task</button></div>`;
  const openSec=`<div class="tk-sech">Open tasks <span class="tk-n">${open.length}</span></div>${open.length?open.map(card).join(''):'<div class="t-empty">Nothing open in this view \u2014 all caught up.</div>'}`;
  // ---- Completed Tasks History ----
  const hist=[...state.tasks.filter(t=>t.status==='Done'), ...state.taskArchive].filter(t=>t.completedAt).sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
  const histRows=hist.slice(0,40).map(t=>`<div class="hist-row">
    <span class="hist-task">${esc(t.title||'Task')}${t.source==='system'?'<span class="hist-src">auto</span>':''}</span>
    <span class="hist-by">${t.completedBy||'\u2014'}</span>
    <span class="hist-date">${new Date(t.completedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})} \u00b7 ${new Date(t.completedAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
  </div>`).join('');
  const history=`<div class="hist-sec"><div class="hist-h">Completed Tasks History <span class="tk-n">${hist.length}</span></div>
    <div class="hist-head"><span>Task</span><span>Completed by</span><span>Date completed</span></div>
    <div class="hist-list">${histRows}</div>${hist.length>40?`<div class="hist-more">+ ${hist.length-40} earlier completed tasks</div>`:''}</div>`;
  return bar + openSec + history;
}

function rvTbl(headers, rows){ if(!rows||!rows.length) return '<div class="rep-empty">None right now.</div>'; return `<table class="rv-table"><thead><tr>${headers.map((h,i)=>`<th${i?' class="num"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
function rvLegend(segs){ const tot=segs.reduce((a,s)=>a+s.value,0)||1; return `<div class="rv-legend">${segs.map(s=>`<div class="rv-leg"><span class="rv-dot" style="background:${s.color}"></span><span class="rv-leg-l">${s.label}</span><span class="rv-leg-v">${s.value} (${pct(s.value,tot)}%)</span></div>`).join('')}</div>`; }

function tallyTop(map, n){ return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n||5); }
function coverageReportBody(){

  open.forEach(s=>{ const cl=clById(s.clientId); if(!cl)return; byClient[cl.name]=(byClient[cl.name]||0)+1; byCity[cl.city]=(byCity[cl.city]||0)+1; });
  // shifts open > 24h
  const over24=open.filter(s=>s.openedAt && (NOW-new Date(s.openedAt))/3600000>24)
    .map(s=>{ const cl=clById(s.clientId); return {name:cl?cl.name:'Client', city:cl?cl.city:'', hrs:Math.round((NOW-new Date(s.openedAt))/3600000)}; })
    .sort((a,b)=>b.hrs-a.hrs);
  // call-off reasons (shifts + caregiver attendance)
  const reasons={};
  state.shifts.forEach(s=>{ if(s.callOff && s.callOffReason) reasons[s.callOffReason]=(reasons[s.callOffReason]||0)+1; });
  state.caregivers.forEach(c=>{ (c.ops&&c.ops.attendance&&c.ops.attendance.events||[]).forEach(e=>{ if(e.type==='calloff'){ const r=e.reason||'Not given'; reasons[r]=(reasons[r]||0)+1; } }); });
  // clients requiring frequent coverage (call-offs by client)
  const coverByClient={};
  state.shifts.forEach(s=>{ if(s.callOff){ const cl=clById(s.clientId); if(cl) coverByClient[cl.name]=(coverByClient[cl.name]||0)+1; } });
  state.caregivers.forEach(c=>{ (c.ops&&c.ops.attendance&&c.ops.attendance.events||[]).forEach(e=>{ if(e.type==='calloff'&&e.client) coverByClient[e.client]=(coverByClient[e.client]||0)+1; }); });

  const agingSegs=[{label:'Open > 24h',value:over24.length,color:RPT_COL.red},{label:'Under 24h',value:Math.max(0,open.length-over24.length),color:RPT_COL.green}];

  </div>`;

}
function cgLastAssignedDays(c){ if(c.ops&&c.ops.devoted) return 0; return ((parseInt(c.id.slice(1))*13)%55)+9; }
function availReportBody(){
  const C=state.caregivers, act=C.filter(c=>c.active!==false), wh=c=>c.weekHrs||0;
  // Availability
  const available=act.filter(c=>hasOpenSchedule(c)).length;
  const noCase=act.filter(c=>!(c.ops&&c.ops.devoted)).length;
  const overnight=act.filter(c=>c.ops&&c.ops.emergency&&c.ops.emergency.overnight).length;
  const weekend=act.filter(c=>c.avail.Sat===1||c.avail.Sun===1).length;
  const dueUpd=C.filter(availDue).length;
  // Hours distribution
  const under20=act.filter(c=>wh(c)>0&&wh(c)<20).length;
  const mid=act.filter(c=>wh(c)>=20&&wh(c)<40).length;
  const long=act.filter(c=>wh(c)>=40).length;
  const ot=act.filter(c=>wh(c)>40).length;
  const zero=act.filter(c=>wh(c)===0).length;
  const nearOT=act.filter(c=>wh(c)>=38&&wh(c)<40).length;
  // Workforce / assignment stability (HR-sourced)
  const W=state.workforceStats;
  const newMatches=(state.placements||[]).length;
  const changeReq=(state.followUps||[]).filter(f=>/caregiver change/i.test(f.title)).length;
  // Staffing risk
  const cgMatches=cl=>act.filter(c=>{
    const skillsOk=(cl.reqSkills||[]).every(s=>c.skills.includes(s));
    const genderOk=!/female/i.test((cl.restrictions||[]).join(' '))||c.gender==='F';
    const blocked=(c.blockedClients||[]).includes(cl.id);
    return skillsOk&&genderOk&&!blocked;
  }).length;
  const only1=state.clients.filter(cl=>cgMatches(cl)===1).length;
  const highRiskLimited=state.clients.filter(cl=>cl.risk==='high'&&!cl.hasBackup).length;
  const stale=act.filter(c=>cgLastAssignedDays(c)>30).length;
  const tile=(l,v,tone)=>`<div class="pf-tile"><div class="pf-v ${tone||''}">${v}</div><div class="pf-l">${l}</div></div>`;

      if(/transportation/i.test(k)) out.push(['watch', `<b>Transportation issues are becoming a recurring reason</b> (${p} \u2192 ${v}) \u2014 consider mileage support or matching caregivers to nearer clients.`]);
      else if(/not enough hours/i.test(k)) out.push(['watch', `<b>Departures over insufficient hours are rising</b> (${p} \u2192 ${v}) \u2014 review hour guarantees and how assignments are distributed.`]);

let _pdfLibPromise=null;
function loadPdfLibs(){
  if(window.jspdf && window.html2canvas) return Promise.resolve();
  if(_pdfLibPromise) return _pdfLibPromise;
  const load=src=>new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load failed')); document.head.appendChild(s); setTimeout(()=>rej(new Error('timeout')),12000); });
  _pdfLibPromise=load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(()=>load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'));
  return _pdfLibPromise;
}
function addPdfPageNumbers(doc){
  const n=doc.getNumberOfPages(), w=doc.internal.pageSize.getWidth(), h=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(150);
    doc.text('Devoted Care Services \u00b7 Confidential', 28, h-14);
    doc.text('Page '+i+' of '+n, w-28, h-14, {align:'right'});

function printFallback(){
  document.body.classList.add('printing-report');
  const cleanup=()=>{ document.body.classList.remove('printing-report'); window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  setTimeout(()=>{ try{ window.print(); }catch(e){ toast('Open this page in a browser tab to export the PDF'); cleanup(); } }, 60);

}

function staffingAlerts(cl){
  const out=[]; const req=cl.reqSkills||[], restr=(cl.restrictions||[]).join(' ').toLowerCase(), ct=cl.careType||'';
  if(/female/.test(restr)) out.push('Female Caregiver Required');
  else if(/male caregiver/.test(restr)) out.push('Male Caregiver Required');
  if(cl.needsDriver || /driver|transport/.test(restr)) out.push('Driver Required');
  if(cl.langReq && /spanish/i.test(cl.langReq) || /spanish/.test(restr)) out.push('Spanish Required');
  if(req.includes('Hoyer Lift')) out.push('Hoyer Lift');
  if(req.includes('Feeding Tube')) out.push('Feeding Tube');
  if(req.includes('Suctioning')) out.push('Suctioning');
  if(req.includes('Transfers')) out.push('Heavy Transfer');
  if(/sitter|hospital/i.test(ct)) out.push('Hospital Sitter');
  return out;
}
function openAgeInfo(s){
  if(!s.openedAt) return {label:'just opened', hrs:0};
  const hrs=Math.max(0, Math.round((NOW-new Date(s.openedAt))/3600000));
  const label = hrs<48 ? `${hrs} hour${hrs===1?'':'s'}` : `${Math.round(hrs/24)} days`;
  return {label, hrs};
}
function startPriority(s){
  const hrs=(new Date(s.start)-NOW)/3600000;
  if(hrs<6) return {tier:'critical', label:'Critical', hrs};
  if(hrs<24) return {tier:'urgent', label:'Urgent', hrs};
  if(hrs<48) return {tier:'upcoming', label:'Upcoming', hrs};
  return {tier:'future', label:'Future', hrs};
}
function timeUntilText(s){
  const mins=(new Date(s.start)-NOW)/60000;
  if(mins<=0) return 'Started '+agoShort(s.start)+' ago';
  if(mins<60) return Math.round(mins)+' minutes';
  const hrs=mins/60;
  if(hrs<48) return Math.round(hrs)+' hour'+(Math.round(hrs)===1?'':'s');
  const days=Math.round(hrs/24);
  return days+' days ('+new Date(s.start).toLocaleDateString('en-US',{weekday:'long'})+')';
}
function startsBig(s){
  const mins=(new Date(s.start)-NOW)/60000;
  if(mins<=0) return 'STARTED '+agoShort(s.start).toUpperCase()+' AGO';
  if(mins<60) return 'STARTS IN '+Math.round(mins)+' MIN';
  const hrs=mins/60;
  if(hrs<48) return 'STARTS IN '+Math.round(hrs)+' HOUR'+(Math.round(hrs)===1?'':'S');
  const days=Math.round(hrs/24);
  return 'STARTS IN '+days+' DAYS';
}
function toggleAttempts(id){ state.openAtt=state.openAtt||{}; state.openAtt[id]=!state.openAtt[id]; render(); }
function startsParts(s){
  const mins=(new Date(s.start)-NOW)/60000;
  if(mins<=0) return {lead:'STARTED', big:agoShort(s.start).toUpperCase()+' AGO'};
  if(mins<60) return {lead:'STARTS IN', big:Math.round(mins)+' MIN'};
  const hrs=mins/60;
  if(hrs<48) return {lead:'STARTS IN', big:Math.round(hrs)+' HOUR'+(Math.round(hrs)===1?'':'S')};
  return {lead:'STARTS IN', big:Math.round(hrs/24)+' DAYS'};
}

/* ============ OPEN SHIFTS — grouped by client ============ */
/* One expandable card per client; each open shift is a compact,
   selectable row. Selection drives the Find Coverage count. */
const OSG_TIERS=['critical','urgent','upcoming','future'];
/* Open Shifts rows always spell the date out: "Monday, Aug 24". */
function openDateText(d){ return new Date(d).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }
function openGroupUrgency(shifts){
  let best='future';
  shifts.forEach(s=>{ const t=startPriority(s).tier; if(OSG_TIERS.indexOf(t)<OSG_TIERS.indexOf(best)) best=t; });
  return best;
}
/* Most urgent client first; soonest start breaks ties. */
function openGroups(){
  const by={};
  openShifts().forEach(s=>{ (by[s.clientId]=by[s.clientId]||[]).push(s); });
  return Object.keys(by).map(cid=>{
    const shifts=by[cid].slice().sort((a,b)=>a.start-b.start);
    return {cl:clById(cid), shifts, tier:openGroupUrgency(shifts)};
  }).sort((a,b)=> (OSG_TIERS.indexOf(a.tier)-OSG_TIERS.indexOf(b.tier)) || (a.shifts[0].start-b.shifts[0].start));
}
function openGroupBy(cid){ return openGroups().find(g=>g.cl.id===cid); }
function openSelIds(g){ const sel=state.openSel||{}; return g.shifts.filter(s=>sel[s.id]).map(s=>s.id); }
function openToggleShift(id){ state.openSel=state.openSel||{}; state.openSel[id]=!state.openSel[id]; render(); }
function openToggleGroup(cid){ state.openGroupShut=state.openGroupShut||{}; state.openGroupShut[cid]=!state.openGroupShut[cid]; render(); }
/* The selection chooses which shift seeds Find Coverage (soonest selected);
   openFindCoverage() locks the coverage page to that one shift. */
function openSeedShift(cid){
  const g=openGroupBy(cid); if(!g) return null;
  const chosen=g.shifts.filter(s=>(state.openSel||{})[s.id]);
  return (chosen.length?chosen:g.shifts)[0];
}
function openFindCoverageSel(cid){ const s=openSeedShift(cid); if(s) openFindCoverage(s.id); }
function openRowHTML(s){

function openClientCardHTML(g){

// --- time / date helpers ---
function pad2(n){ return String(n).padStart(2,'0'); }
function decHr(d){ return d.getHours()+d.getMinutes()/60; }
function toDateInput(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function toTimeInput(dec){ let h=Math.floor(dec)%24, m=Math.round((dec-Math.floor(dec))*60); if(m===60){h=(h+1)%24;m=0;} return `${pad2(h)}:${pad2(m)}`; }
function decFromTime(str){ const [h,m]=str.split(':').map(Number); return h+(m||0)/60; }
function fmtHr(dec){ let d=((dec%24)+24)%24; let h=Math.floor(d), m=Math.round((d-h)*60); if(m===60){h++;m=0;} const ap=h<12?'a':'p'; let hh=h%12; if(hh===0)hh=12; return hh+(m?':'+pad2(m):'')+ap; }
function dayKeyFromDate(dateStr){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(dateStr+'T12:00:00').getDay()]; }
function dateFromInputs(dateStr,dec){ const d=new Date(dateStr+'T00:00:00'); d.setHours(Math.floor(dec), Math.round((dec-Math.floor(dec))*60),0,0); return d; }

const SKILL_UNIVERSE=['Companion','Dementia','Hospice','Transfers','Hoyer Lift','Medication Reminders','Feeding Tube','Suctioning'];
const FILTER_GROUPS=[
  {label:'Caregiver Requirements', items:['Female','Male','Driver Required','Non-Driver','Spanish Speaking','Tagalog Speaking','Pet Friendly','Smoker Home OK','Family Preference','Previously Worked With Client']},
];
function caregiverPassesFilters(cg, filters, ctx){
  ctx=ctx||{};
  for(const f of (filters||[])){
    switch(f){
      case 'Female': if(cg.gender!=='F') return false; break;
      case 'Male': if(cg.gender!=='M') return false; break;
      case 'Driver Required': if(!cg.driver) return false; break;
      case 'Non-Driver': if(cg.driver) return false; break;
      case 'Spanish Speaking': if(!cg.languages.includes('Spanish')) return false; break;
      case 'Tagalog Speaking': if(!cg.languages.includes('Tagalog')) return false; break;
      case 'Pet Friendly': if(cg.restrictions.includes('No pets')) return false; break;
      case 'Smoker Home OK': if(!cg.smokerHomeOk) return false; break;
      case 'Family Preference': if(!(ctx.clientId && (clById(ctx.clientId).preferred||[]).includes(cg.id))) return false; break;
      case 'Previously Worked With Client': if(!(ctx.clientId && cg.priorClients.includes(ctx.clientId))) return false; break;
    }
  }
  return true;
}
function renderFilterGroups(skillSel, filterSel, skillToggle, filterToggle){
  const grp=(label,items,sel,toggle)=>`<div class="cov-fgroup"><div class="cov-flabel">${label}</div><div class="cov-fchips">${items.map(it=>`<span class="sk ${sel.includes(it)?'on':''}" onclick="${toggle}('${it}')">${it}</span>`).join('')}</div></div>`;
  return `<div class="cov-filters">
    ${grp('Care Needs', SKILL_UNIVERSE, skillSel, skillToggle)}
    ${FILTER_GROUPS.map(g=>grp(g.label, g.items, filterSel, filterToggle)).join('')}
  </div>`;
}

function toggleRecFilter(f){ const rq=state.recurringQuery; if(!rq.filters)rq.filters=[]; const i=rq.filters.indexOf(f); if(i>=0)rq.filters.splice(i,1); else rq.filters.push(f); render(); }

function autoOfferTiers(shiftId){

function aoReasonSummary(e,shiftId){ const cg=e.cg, cl=clById(shiftById(shiftId).clientId); const dist=miles(cg.base, cl.city);
